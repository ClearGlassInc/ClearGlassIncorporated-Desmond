version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.2.3

executors:
  node22:
    docker:
      - image: cimg/node:22.10
    resource_class: medium
    working_directory: ~/project

  browser22:
    docker:
      - image: cimg/node:22.10-browsers
    resource_class: medium
    working_directory: ~/project

  python311:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

  base:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    working_directory: ~/project

commands:
  setup-root-python:
    steps:
      - restore_cache:
          keys:
            - pip-root-v2-{{ checksum "requirements.txt" }}-{{ checksum "pyproject.toml" }}-{{ checksum "clearglass-commerce/control-plane/requirements.txt" }}
            - pip-root-v2-
      - run:
          name: Install root Python and commerce dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
            python -m pip install -r clearglass-commerce/control-plane/requirements.txt
            python -m pip check
      - save_cache:
          key: pip-root-v2-{{ checksum "requirements.txt" }}-{{ checksum "pyproject.toml" }}-{{ checksum "clearglass-commerce/control-plane/requirements.txt" }}
          paths:
            - ~/.cache/pip

  setup-osit:
    steps:
      - restore_cache:
          keys:
            - pip-osit-v1-{{ checksum "osit/pyproject.toml" }}
            - pip-osit-v1-
      - run:
          name: Install OSIT and development dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e './osit[dev]'
            python -m pip check
      - save_cache:
          key: pip-osit-v1-{{ checksum "osit/pyproject.toml" }}
          paths:
            - ~/.cache/pip

jobs:
  node-tooling:
    executor: node22
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install locked Node dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Type check
          command: npm run typecheck
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Deterministic tooling build
          command: npm run build
      - run:
          name: Verify expected build artifact
          command: test -s dist/scripts/sync-stripe-products.js
      - store_artifacts:
          path: dist
          destination: node-dist

  root-python-deps:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Compile configured Python sources
          command: python -m compileall -q artemis sentinel clearglass-commerce/control-plane

  pytest-artemis:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: ARTEMIS tests
          command: |
            mkdir -p test-results/artemis
            python -m pytest artemis/tests -q --junitxml=test-results/artemis/junit.xml
      - store_test_results:
          path: test-results

  pytest-sentinel:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Sentinel tests
          command: |
            mkdir -p test-results/sentinel
            python -m pytest sentinel/tests -q --junitxml=test-results/sentinel/junit.xml
      - store_test_results:
          path: test-results

  pytest-commerce:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Commerce control-plane tests
          command: |
            mkdir -p test-results/commerce
            python -m pytest clearglass-commerce/control-plane/tests -q --junitxml=test-results/commerce/junit.xml
      - store_test_results:
          path: test-results

  pytest-root-a-f:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Root tests A-F
          command: |
            set -euo pipefail
            shopt -s nullglob
            files=(tests/test_[a-f]*.py)
            if (( ${#files[@]} == 0 )); then exit 0; fi
            python -m pytest "${files[@]}" -q

  pytest-root-g-l:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Root tests G-L
          command: |
            set -euo pipefail
            shopt -s nullglob
            files=(tests/test_[g-l]*.py)
            if (( ${#files[@]} == 0 )); then exit 0; fi
            python -m pytest "${files[@]}" -q

  pytest-root-m-r:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Root tests M-R
          command: |
            set -euo pipefail
            shopt -s nullglob
            files=(tests/test_[m-r]*.py)
            if (( ${#files[@]} == 0 )); then exit 0; fi
            python -m pytest "${files[@]}" -q

  pytest-root-s-z:
    executor: python311
    steps:
      - checkout
      - setup-root-python
      - run:
          name: Root tests S-Z
          command: |
            set -euo pipefail
            shopt -s nullglob
            files=(tests/test_[s-z]*.py)
            if (( ${#files[@]} == 0 )); then exit 0; fi
            python -m pytest "${files[@]}" -q

  lint:
    executor: python311
    steps:
      - checkout
      - run:
          name: Install pinned Ruff
          command: python -m pip install "ruff==0.15.8"
      - run:
          name: Repository-wide Ruff
          command: ruff check .

  site-reliability:
    executor: python311
    steps:
      - checkout
      - run:
          name: Site reliability audit
          command: python scripts/site_reliability_audit.py

  search-assets:
    executor: python311
    steps:
      - checkout
      - run:
          name: Validate generated search assets are current
          command: |
            python tools/generate_search_assets.py
            git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json

  seo-audit:
    executor: python311
    steps:
      - checkout
      - run:
          name: Validate indexability links metadata and JSON-LD
          command: python tools/seo_audit.py

  internal-links:
    executor: python311
    steps:
      - checkout
      - run:
          name: Validate generated internal links
          command: python tools/internal_links.py --check

  workflow-doctor:
    executor: python311
    steps:
      - checkout
      - run:
          name: Install workflow audit dependency
          command: python -m pip install "PyYAML==6.0.2"
      - run:
          name: Workflow Doctor dry run
          command: python scripts/workflow_doctor.py

  actions-audit:
    executor: python311
    steps:
      - checkout
      - run:
          name: Install workflow audit dependency
          command: python -m pip install "PyYAML==6.0.2"
      - run:
          name: Enforce workflow safety invariants
          command: python scripts/audit_github_actions.py

  osint-deck:
    executor: python311
    steps:
      - checkout
      - run:
          name: OSINT deck strict validation
          command: python scripts/osint_deck_release.py --strict

  lighthouse:
    executor: browser22
    steps:
      - checkout
      - browser-tools/install-chrome
      - run:
          name: Verify Chrome is available
          command: google-chrome --version
      - run:
          name: Lighthouse performance accessibility and SEO budgets
          command: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - store_artifacts:
          path: .lighthouseci
          destination: lighthouse

  osit-deps:
    executor: python311
    steps:
      - checkout
      - setup-osit
      - run:
          name: Compile OSIT
          command: python -m compileall -q osit/src osit/tests

  osit-ruff:
    executor: python311
    steps:
      - checkout
      - setup-osit
      - run:
          name: Ruff OSIT
          command: cd osit && ruff check src tests

  osit-tests:
    executor: python311
    steps:
      - checkout
      - setup-osit
      - run:
          name: OSIT unit and export tests
          command: |
            mkdir -p osit/test-results
            cd osit
            pytest --cov=osit --cov-report=xml:coverage.xml --junitxml=test-results/junit.xml
      - store_test_results:
          path: osit/test-results
      - store_artifacts:
          path: osit/coverage.xml
          destination: osit-coverage.xml

  production-smoke:
    executor: base
    steps:
      - run:
          name: Verify ClearGlass production endpoints
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors https://www.clearglassinc.com/ -o /tmp/home.html
            grep -qi "ClearGlass" /tmp/home.html
            curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors https://www.clearglassinc.com/robots.txt -o /tmp/robots.txt
            curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors https://www.clearglassinc.com/sitemap.xml -o /tmp/sitemap.xml
            test -s /tmp/robots.txt
            test -s /tmp/sitemap.xml

workflows:
  full-validation-and-production-smoke:
    jobs:
      - node-tooling
      - root-python-deps
      - pytest-artemis:
          requires: [root-python-deps]
      - pytest-sentinel:
          requires: [root-python-deps]
      - pytest-commerce:
          requires: [root-python-deps]
      - pytest-root-a-f:
          requires: [root-python-deps]
      - pytest-root-g-l:
          requires: [root-python-deps]
      - pytest-root-m-r:
          requires: [root-python-deps]
      - pytest-root-s-z:
          requires: [root-python-deps]
      - lint
      - site-reliability
      - search-assets
      - seo-audit
      - internal-links
      - workflow-doctor
      - actions-audit
      - osint-deck
      - lighthouse
      - osit-deps
      - osit-ruff:
          requires: [osit-deps]
      - osit-tests:
          requires: [osit-deps]
      - production-smoke:
          requires:
            - node-tooling
            - pytest-artemis
            - pytest-sentinel
            - pytest-commerce
            - pytest-root-a-f
            - pytest-root-g-l
            - pytest-root-m-r
            - pytest-root-s-z
            - lint
            - site-reliability
            - search-assets
            - seo-audit
            - internal-links
            - workflow-doctor
            - actions-audit
            - osint-deck
            - lighthouse
            - osit-ruff
            - osit-tests
          filters:
            branches:
              only: main
