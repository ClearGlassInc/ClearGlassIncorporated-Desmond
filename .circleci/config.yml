version: 2.1
# Final verification after published Control Plane route repair.

jobs:
  control_plane_root:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify published control-plane root
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --retry-all-errors https://git-hub-control-plane--dezzy231.replit.app/ -o /tmp/root.html
            test -s /tmp/root.html

  agent_health_primary:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify primary agent health route
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --retry-all-errors https://git-hub-control-plane--dezzy231.replit.app/clearglass-agent/health -o /tmp/health.json
            grep -qi 'clearglass-agent-service' /tmp/health.json
            grep -qi '"status"' /tmp/health.json
            grep -qi '"ok"' /tmp/health.json

  agent_health_alias:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify API alias agent health route
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --retry-all-errors https://git-hub-control-plane--dezzy231.replit.app/api/clearglass-agent/health -o /tmp/health.json
            grep -qi 'clearglass-agent-service' /tmp/health.json
            grep -qi '"status"' /tmp/health.json
            grep -qi '"ok"' /tmp/health.json

  policy_primary_fail_closed:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify primary policy route fails closed
          command: |
            set -euo pipefail
            code="$(curl --silent --show-error --location --output /tmp/policy.json --write-out '%{http_code}' --max-time 30 https://git-hub-control-plane--dezzy231.replit.app/clearglass-agent/policy || true)"
            case "$code" in 401|403|404|405|503) exit 0;; 200) echo "ERROR: unauthenticated policy route returned 200" >&2; exit 1;; *) echo "Unexpected HTTP $code" >&2; exit 1;; esac

  policy_alias_fail_closed:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify API alias policy route fails closed
          command: |
            set -euo pipefail
            code="$(curl --silent --show-error --location --output /tmp/policy.json --write-out '%{http_code}' --max-time 30 https://git-hub-control-plane--dezzy231.replit.app/api/clearglass-agent/policy || true)"
            case "$code" in 401|403|404|405|503) exit 0;; 200) echo "ERROR: unauthenticated policy route returned 200" >&2; exit 1;; *) echo "Unexpected HTTP $code" >&2; exit 1;; esac

  authoritative_repo_verify:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify authoritative repository access
          command: |
            set -euo pipefail
            git clone --depth 1 --branch main https://github.com/ClearGlassInc/ClearGlassIncorporated-Desmond.git /tmp/primary
            cd /tmp/primary
            git rev-parse HEAD
            test -s .circleci/config.yml
            test -s services/clearglass_agent_service/main.py

  website_production_verify:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify production website
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --retry-all-errors https://www.clearglassinc.com/ -o /tmp/home.html
            grep -qi 'ClearGlass' /tmp/home.html
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --retry-all-errors https://www.clearglassinc.com/robots.txt -o /tmp/robots.txt
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --retry-all-errors https://www.clearglassinc.com/sitemap.xml -o /tmp/sitemap.xml
            test -s /tmp/robots.txt
            test -s /tmp/sitemap.xml

workflows:
  production_route_isolation:
    jobs:
      - control_plane_root
      - agent_health_primary
      - agent_health_alias
      - policy_primary_fail_closed
      - policy_alias_fail_closed
      - authoritative_repo_verify
      - website_production_verify
