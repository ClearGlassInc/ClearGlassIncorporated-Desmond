version: 2.1

jobs:
  replit_agent_health:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify ClearGlass Agent replacement health
          command: |
            set -euo pipefail
            url="https://git-hub-control-plane--dezzy231.replit.app/clearglass-agent/health"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              "$url" -o /tmp/health.json
            grep -q '"service"' /tmp/health.json
            grep -q 'clearglass-agent-service' /tmp/health.json
            grep -q '"status"' /tmp/health.json
            grep -q '"ok"' /tmp/health.json
            echo "ClearGlass Agent replacement health: PASS"

  replit_control_plane_root:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify existing GitHub Control Plane still responds
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              https://git-hub-control-plane--dezzy231.replit.app/ \
              -o /tmp/root.html
            test -s /tmp/root.html
            echo "Existing GitHub Control Plane root: PASS"

workflows:
  production_runtime_verify:
    jobs:
      - replit_agent_health
      - replit_control_plane_root
