version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.10
    resource_class: medium
    working_directory: ~/project

  python311:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

  base:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    working_directory: ~/project

jobs:
  node-tooling:
    executor: node22
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install locked Node dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Type check
          command: npm run typecheck
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Deterministic tooling build
          command: npm run build
      - run:
          name: Verify expected build artifact
          command: test -s dist/scripts/sync-stripe-products.js
      - store_artifacts:
          path: dist
          destination: node-dist

  python-tests:
    executor: python311
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-root-v1-{{ checksum "requirements.txt" }}-{{ checksum "pyproject.toml" }}
            - pip-root-v1-
      - run:
          name: Install project and test dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
            python -m pip check
      - save_cache:
          key: pip-root-v1-{{ checksum "requirements.txt" }}-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Compile Python sources
          command: python -m compileall -q artemis sentinel clearglass-commerce/control-plane
      - run:
          name: Run configured Python test suite
          command: |
            mkdir -p test-results/python
            python -m pytest --cov=artemis --cov-report=xml:coverage.xml --junitxml=test-results/python/junit.xml -q
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage.xml
          destination: python-coverage.xml

  lint:
    executor: python311
    steps:
      - checkout
      - run:
          name: Install pinned Ruff
          command: python -m pip install "ruff==0.15.8"
      - run:
          name: Repository-wide Ruff
          command: ruff check .

  site-integrity:
    executor: python311
    steps:
      - checkout
      - run:
          name: Install workflow audit dependency
          command: python -m pip install "PyYAML==6.0.2"
      - run:
          name: Site reliability audit
          command: python scripts/site_reliability_audit.py
      - run:
          name: Validate generated search assets are current
          command: |
            python tools/generate_search_assets.py
            git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json
      - run:
          name: Validate indexability links metadata and JSON-LD
          command: python tools/seo_audit.py
      - run:
          name: Validate generated internal links
          command: python tools/internal_links.py --check
      - run:
          name: Workflow Doctor dry run
          command: python scripts/workflow_doctor.py
      - run:
          name: Enforce workflow safety invariants
          command: python scripts/audit_github_actions.py
      - run:
          name: OSINT deck strict validation
          command: python scripts/osint_deck_release.py --strict

  lighthouse:
    executor: node22
    steps:
      - checkout
      - run:
          name: Lighthouse performance accessibility and SEO budgets
          command: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - store_artifacts:
          path: .lighthouseci
          destination: lighthouse

  osit:
    executor: python311
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-osit-v1-{{ checksum "osit/pyproject.toml" }}
            - pip-osit-v1-
      - run:
          name: Install OSIT and development dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e './osit[dev]'
            python -m pip check
      - save_cache:
          key: pip-osit-v1-{{ checksum "osit/pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Compile OSIT
          command: python -m compileall -q osit/src osit/tests
      - run:
          name: Ruff OSIT
          command: cd osit && ruff check src tests
      - run:
          name: OSIT unit and export tests
          command: |
            mkdir -p osit/test-results
            cd osit
            pytest --cov=osit --cov-report=xml:coverage.xml --junitxml=test-results/junit.xml
      - store_test_results:
          path: osit/test-results
      - store_artifacts:
          path: osit/coverage.xml
          destination: osit-coverage.xml

  production-smoke:
    executor: base
    steps:
      - run:
          name: Verify ClearGlass production endpoints
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors https://www.clearglassinc.com/ -o /tmp/home.html
            grep -qi "ClearGlass" /tmp/home.html
            curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors https://www.clearglassinc.com/robots.txt -o /tmp/robots.txt
            curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors https://www.clearglassinc.com/sitemap.xml -o /tmp/sitemap.xml
            test -s /tmp/robots.txt
            test -s /tmp/sitemap.xml

workflows:
  full-validation-and-production-smoke:
    jobs:
      - node-tooling
      - python-tests
      - lint
      - site-integrity
      - lighthouse
      - osit
      - production-smoke:
          requires:
            - node-tooling
            - python-tests
            - lint
            - site-integrity
            - lighthouse
            - osit
          filters:
            branches:
              only: main
