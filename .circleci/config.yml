version: 2.1

jobs:
  credential_probe:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify production deploy credential presence
          command: |
            set -euo pipefail
            missing=0
            if [ -z "${FLY_API_TOKEN:-}" ]; then
              echo "FLY_API_TOKEN_PRESENT=false"
              missing=1
            else
              echo "FLY_API_TOKEN_PRESENT=true"
            fi
            if [ "$missing" -ne 0 ]; then
              echo "Production credential is not available in the CircleCI project environment."
              exit 2
            fi
            echo "Production credential presence check: PASS"
      - run:
          name: Verify current public agent health
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 2 --retry-all-errors \
              https://clearglass-agent-service.fly.dev/health \
              -o /tmp/health.json
            grep -q '"status"' /tmp/health.json
            echo "Public agent health endpoint: PASS"

workflows:
  production_credential_probe:
    jobs:
      - credential_probe
