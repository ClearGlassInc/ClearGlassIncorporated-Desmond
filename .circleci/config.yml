version: 2.1

jobs:
  production_credential_probe:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify CircleCI execution and credential presence
          command: |
            set -euo pipefail
            git clone --depth 1 --branch main https://github.com/ClearGlassInc/ClearGlassIncorporated-Desmond.git /tmp/primary
            cd /tmp/primary
            sha="$(git rev-parse HEAD)"
            echo "authoritative_sha=${sha}"
            if [ -n "${FLY_API_TOKEN:-}" ]; then
              echo "fly_api_token_present=true"
            else
              echo "fly_api_token_present=false"
              exit 2
            fi

workflows:
  production_credential_probe:
    jobs:
      - production_credential_probe
