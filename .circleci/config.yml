version: 2.1

jobs:
  agent_health_primary:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify primary ClearGlass Agent health path
          command: |
            set -euo pipefail
            url="https://git-hub-control-plane--dezzy231.replit.app/clearglass-agent/health"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              "$url" -o /tmp/health.json
            grep -q 'clearglass-agent-service' /tmp/health.json
            grep -q '"status"' /tmp/health.json
            grep -q '"ok"' /tmp/health.json
            echo "Primary ClearGlass Agent health: PASS"

  agent_health_api_alias:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify API alias ClearGlass Agent health path
          command: |
            set -euo pipefail
            url="https://git-hub-control-plane--dezzy231.replit.app/api/clearglass-agent/health"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              "$url" -o /tmp/health.json
            grep -q 'clearglass-agent-service' /tmp/health.json
            grep -q '"status"' /tmp/health.json
            grep -q '"ok"' /tmp/health.json
            echo "API alias ClearGlass Agent health: PASS"

  control_plane_root:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify existing GitHub Control Plane still responds
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              https://git-hub-control-plane--dezzy231.replit.app/ \
              -o /tmp/root.html
            test -s /tmp/root.html
            echo "Existing GitHub Control Plane root: PASS"

workflows:
  production_runtime_verify:
    jobs:
      - agent_health_primary
      - agent_health_api_alias
      - control_plane_root
