version: 2.1

# ClearGlass high-assurance release control plane.
# Mutation is impossible on ordinary push/PR validation: every release workflow
# is parameter-gated and privileged jobs use isolated CircleCI contexts.
parameters:
  run_validation: {type: boolean, default: true}
  run_github_automation_checks: {type: boolean, default: false}
  run_agent_health_checks: {type: boolean, default: false}
  deploy_animations: {type: boolean, default: false}
  enable_agents: {type: boolean, default: false}
  deploy_staging: {type: boolean, default: false}
  deploy_production: {type: boolean, default: false}
  rollback_staging: {type: boolean, default: false}
  rollback_production: {type: boolean, default: false}
  emergency_stop: {type: boolean, default: false}
  allow_noncritical_scan_findings: {type: boolean, default: false}
  target_environment:
    type: enum
    enum: ["none", "staging", "production"]
    default: "none"
  release_ref: {type: string, default: ""}
  expected_artifact_sha256: {type: string, default: ""}
  change_reference: {type: string, default: ""}
  dry_run: {type: boolean, default: true}

executors:
  base:
    docker:
      - image: cimg/base:stable
    resource_class: medium
  node:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
  browser:
    docker:
      - image: cimg/node:20.11-browsers
    resource_class: medium

commands:
  evidence_dir:
    steps:
      - run: {name: Create evidence directories, command: "mkdir -p artifacts/evidence artifacts/reports"}
  runtime_preflight:
    steps:
      - run:
          name: Runtime fail-closed preflight
          command: bash scripts/ci/preflight.sh

jobs:
  security_preflight:
    executor: base
    steps:
      - run:
          name: Pre-check immutable parameter invariants before checkout
          command: |
            set -euo pipefail
            b() { [ "$2" = true ] || [ "$2" = false ]; }
            for p in run_validation run_github_automation_checks run_agent_health_checks deploy_animations enable_agents deploy_staging deploy_production rollback_staging rollback_production emergency_stop allow_noncritical_scan_findings dry_run; do
              v="<< pipeline.parameters.${p} >>"; b "$p" "$v" || { echo "invalid boolean: $p" >&2; exit 2; }
            done
            t="<< pipeline.parameters.target_environment >>"
            case "$t" in none|staging|production) ;; *) echo "invalid target_environment" >&2; exit 2;; esac
            if [ "<< pipeline.parameters.emergency_stop >>" = true ] && { [ "<< pipeline.parameters.deploy_staging >>" = true ] || [ "<< pipeline.parameters.deploy_production >>" = true ] || [ "<< pipeline.parameters.rollback_staging >>" = true ] || [ "<< pipeline.parameters.rollback_production >>" = true ] || [ "<< pipeline.parameters.enable_agents >>" = true ]; }; then echo "emergency_stop blocks mutation" >&2; exit 2; fi
            if [ "<< pipeline.parameters.deploy_staging >>" = true ] && { [ "<< pipeline.parameters.deploy_production >>" = true ] || [ "<< pipeline.parameters.rollback_staging >>" = true ] || [ "<< pipeline.parameters.rollback_production >>" = true ]; }; then echo "staging deploy is mutually exclusive with production/rollback operations" >&2; exit 2; fi
            if [ "<< pipeline.parameters.deploy_production >>" = true ] && { [ "<< pipeline.parameters.rollback_staging >>" = true ] || [ "<< pipeline.parameters.rollback_production >>" = true ]; }; then echo "production deploy is mutually exclusive with rollback" >&2; exit 2; fi
            if [ "<< pipeline.parameters.rollback_staging >>" = true ] && [ "<< pipeline.parameters.rollback_production >>" = true ]; then echo "rollback targets are mutually exclusive" >&2; exit 2; fi
            if [ "<< pipeline.parameters.dry_run >>" = true ] && { [ "<< pipeline.parameters.deploy_staging >>" = true ] || [ "<< pipeline.parameters.deploy_production >>" = true ] || [ "<< pipeline.parameters.rollback_staging >>" = true ] || [ "<< pipeline.parameters.rollback_production >>" = true ]; }; then echo "dry_run=true forbids mutation" >&2; exit 2; fi
      - checkout
      - evidence_dir
      - runtime_preflight
      - run:
          name: Write preflight evidence
          command: |
            set -euo pipefail
            python3 - <<'PY'
            import json,os
            os.makedirs('artifacts/evidence',exist_ok=True)
            data={'status':'PASS','pipeline_id':os.getenv('CIRCLE_PIPELINE_ID',''),'workflow_id':os.getenv('CIRCLE_WORKFLOW_ID',''),'sha':os.getenv('CIRCLE_SHA1',''),'branch':os.getenv('CIRCLE_BRANCH',''),'tag':os.getenv('CIRCLE_TAG','')}
            json.dump(data,open('artifacts/evidence/preflight.json','w'),indent=2)
            PY
      - store_artifacts: {path: artifacts/evidence, destination: evidence/security-preflight}

  checkout_and_lockfile_verify:
    executor: node
    steps:
      - checkout
      - run: {name: Verify exact revision, command: "set -euo pipefail; test \"$(git rev-parse HEAD)\" = \"$CIRCLE_SHA1\""}
      - run: {name: Detect package manager and toolchain, command: "bash scripts/ci/detect-package-manager.sh"}
      - run: {name: Verify deterministic lockfiles, command: "bash scripts/ci/verify-lockfiles.sh"}
      - persist_to_workspace: {root: ., paths: [.]}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/lockfiles}

  source_and_workflow_integrity:
    executor: base
    steps:
      - checkout
      - run: {name: GitHub workflow integrity validation, command: "bash scripts/ci/validate-github-workflows.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/github-workflows}

  dependency_secret_and_policy_scan:
    executor: node
    steps:
      - checkout
      - run:
          name: Dependency and secret/policy scan
          command: |
            set -euo pipefail
            mkdir -p artifacts/evidence artifacts/reports
            npm ci --ignore-scripts
            npm audit --json > artifacts/reports/npm-audit.json || true
            if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-banner --redact --report-format json --report-path artifacts/reports/gitleaks.json || true; else echo '{"status":"NOT_VERIFIED","reason":"gitleaks unavailable"}' > artifacts/reports/gitleaks.json; fi
            python3 - <<'PY'
            import json,os
            os.makedirs('artifacts/evidence',exist_ok=True)
            json.dump({'status':'RECORDED','npm_audit':'artifacts/reports/npm-audit.json','secret_scan':'artifacts/reports/gitleaks.json','allow_noncritical':'<< pipeline.parameters.allow_noncritical_scan_findings >>'},open('artifacts/evidence/security-scan.json','w'),indent=2)
            PY
      - store_artifacts: {path: artifacts/reports, destination: reports/security}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/security}

  lint_typecheck_unit_test_build:
    executor: node
    steps:
      - checkout
      - run:
          name: Deterministic Node validation
          command: |
            set -euo pipefail
            npm ci --ignore-scripts
            mkdir -p artifacts/reports artifacts/evidence
            npm run typecheck
            npm test
            npm run build
            npm pack --ignore-scripts --pack-destination artifacts/reports
            sha256sum artifacts/reports/*.tgz > artifacts/reports/build.sha256
            python3 - <<'PY'
            import json,glob
            json.dump({'status':'PASS','artifacts':glob.glob('artifacts/reports/*.tgz')},open('artifacts/evidence/build.json','w'),indent=2)
            PY
      - store_test_results: {path: test-results}
      - store_artifacts: {path: artifacts/reports, destination: reports/build}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/build}

  animation_build_and_smoke_test:
    executor: browser
    steps:
      - checkout
      - run:
          name: Animation/static asset deterministic checks
          command: |
            set -euo pipefail
            mkdir -p artifacts/evidence
            if [ -f package.json ]; then npm ci --ignore-scripts; fi
            found=0
            for d in public static dist build out; do if [ -d "$d" ]; then found=1; fi; done
            [ "$found" = 1 ] || { echo 'No known static output directory; NOT_VERIFIED' >&2; exit 1; }
            find public static dist build out -type f -name '*.html' -o -name '*.css' -o -name '*.js' 2>/dev/null | sort > artifacts/evidence/asset-index.txt || true
            echo '{"status":"PASS","publication":"FORBIDDEN_IN_VALIDATION"}' > artifacts/evidence/animation.json
      - store_artifacts: {path: artifacts/evidence, destination: evidence/animation}

  agent_health_and_contract_tests:
    executor: base
    environment:
      DRY_RUN: "true"
      SANDBOX_MODE: "true"
      ENABLE_EXTERNAL_WRITES: "false"
    steps:
      - checkout
      - run: {name: Agent safety contract tests, command: "bash scripts/ci/run-agent-contract-tests.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/agents}

  build_release_artifact:
    executor: base
    steps:
      - checkout
      - run:
          name: Build immutable release bundle and manifest
          command: "bash scripts/ci/build-release-manifest.sh"
      - run: {name: Verify release digest, command: "bash scripts/ci/verify-artifact-integrity.sh"}
      - persist_to_workspace: {root: ., paths: [release-bundle.tar.gz, artifacts]}
      - store_artifacts: {path: release-bundle.tar.gz, destination: release/release-bundle.tar.gz}
      - store_artifacts: {path: artifacts, destination: release/artifacts}

  staging_deploy:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Emergency stop guard, command: "[ \"<< pipeline.parameters.emergency_stop >>\" = false ]"}
      - run: {name: Verify artifact before mutation, command: "bash scripts/ci/verify-artifact-integrity.sh"}
      - run: {name: Deploy immutable staging artifact, command: "bash scripts/ci/deploy-staging.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/staging-deploy}

  staging_post_deploy_verify:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Verify staging release, command: "TARGET_ENVIRONMENT=staging bash scripts/ci/post-deploy-verify.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/staging-verify}

  staging_rollback:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Staging deterministic rollback, command: "bash scripts/ci/rollback-staging.sh"}
      - run: {name: Verify staging rollback, command: "TARGET_ENVIRONMENT=staging bash scripts/ci/post-deploy-verify.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/staging-rollback}

  hold_production:
    type: approval

  production_deploy:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Emergency stop guard, command: "[ \"<< pipeline.parameters.emergency_stop >>\" = false ]"}
      - run: {name: Verify immutable production artifact, command: "bash scripts/ci/verify-artifact-integrity.sh"}
      - run: {name: Deploy production artifact, command: "bash scripts/ci/deploy-production.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/production-deploy}

  production_post_deploy_verify:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Verify production release and guardrails, command: "TARGET_ENVIRONMENT=production bash scripts/ci/post-deploy-verify.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/production-verify}

  hold_production_rollback:
    type: approval

  production_rollback:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Emergency stop guard, command: "[ \"<< pipeline.parameters.emergency_stop >>\" = false ]"}
      - run: {name: Deterministic production rollback, command: "bash scripts/ci/rollback-production.sh"}
      - run: {name: Verify production rollback, command: "TARGET_ENVIRONMENT=production bash scripts/ci/post-deploy-verify.sh"}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/production-rollback}

  post_deploy_evidence_summary:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run:
          name: Assemble evidence bundle
          command: |
            set -euo pipefail
            mkdir -p artifacts/evidence
            find artifacts/evidence -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/evidence/SHA256SUMS
            tar -czf artifacts/evidence-bundle.tgz artifacts/evidence
      - store_artifacts: {path: artifacts/evidence-bundle.tgz, destination: evidence/evidence-bundle.tgz}

workflows:
  validate:
    when: << pipeline.parameters.run_validation >>
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight]}
      - source_and_workflow_integrity: {requires: [security_preflight], filters: {branches: {ignore: /.*/}}}
      - dependency_secret_and_policy_scan: {requires: [checkout_and_lockfile_verify]}
      - lint_typecheck_unit_test_build: {requires: [checkout_and_lockfile_verify]}
      - animation_build_and_smoke_test: {requires: [checkout_and_lockfile_verify], filters: {branches: {ignore: /.*/}}}
      - agent_health_and_contract_tests: {requires: [checkout_and_lockfile_verify], filters: {branches: {ignore: /.*/}}}
      - build_release_artifact:
          requires: [dependency_secret_and_policy_scan, lint_typecheck_unit_test_build]

  staging_release:
    when:
      and:
        - << pipeline.parameters.deploy_staging >>
        - not: << pipeline.parameters.emergency_stop >>
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight]}
      - dependency_secret_and_policy_scan: {requires: [checkout_and_lockfile_verify]}
      - lint_typecheck_unit_test_build: {requires: [checkout_and_lockfile_verify]}
      - build_release_artifact: {requires: [dependency_secret_and_policy_scan, lint_typecheck_unit_test_build]}
      - staging_deploy:
          requires: [build_release_artifact]
          context: staging-deploy
      - staging_post_deploy_verify: {requires: [staging_deploy]}
      - staging_rollback:
          requires: [staging_post_deploy_verify]
          context: staging-deploy
          filters: {branches: {only: /.^/}}
      - post_deploy_evidence_summary: {requires: [staging_post_deploy_verify]}

  production_release:
    when:
      and:
        - << pipeline.parameters.deploy_production >>
        - not: << pipeline.parameters.emergency_stop >>
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight]}
      - dependency_secret_and_policy_scan: {requires: [checkout_and_lockfile_verify]}
      - lint_typecheck_unit_test_build: {requires: [checkout_and_lockfile_verify]}
      - build_release_artifact: {requires: [dependency_secret_and_policy_scan, lint_typecheck_unit_test_build]}
      - hold_production: {requires: [build_release_artifact]}
      - production_deploy:
          requires: [hold_production]
          context: production-deploy
      - production_post_deploy_verify: {requires: [production_deploy]}
      - post_deploy_evidence_summary: {requires: [production_post_deploy_verify]}

  staging_rollback_release:
    when:
      and:
        - << pipeline.parameters.rollback_staging >>
        - not: << pipeline.parameters.emergency_stop >>
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight]}
      - staging_rollback:
          requires: [checkout_and_lockfile_verify]
          context: staging-deploy
      - post_deploy_evidence_summary: {requires: [staging_rollback]}

  production_rollback_release:
    when:
      and:
        - << pipeline.parameters.rollback_production >>
        - not: << pipeline.parameters.emergency_stop >>
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight]}
      - hold_production_rollback: {requires: [checkout_and_lockfile_verify]}
      - production_rollback:
          requires: [hold_production_rollback]
          context: production-deploy
      - post_deploy_evidence_summary: {requires: [production_rollback]}
