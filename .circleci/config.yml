version: 2.1

parameters:
  run_validation: {type: boolean, default: true}
  run_github_automation_checks: {type: boolean, default: false}
  run_agent_health_checks: {type: boolean, default: false}
  deploy_staging: {type: boolean, default: false}
  deploy_production: {type: boolean, default: false}
  rollback_staging: {type: boolean, default: false}
  rollback_production: {type: boolean, default: false}
  emergency_stop: {type: boolean, default: false}
  target_environment: {type: enum, enum: [none, staging, production], default: none}
  change_reference: {type: string, default: ""}

executors:
  base: {docker: [{image: cimg/base:2026.08}], resource_class: medium}
  node: {docker: [{image: cimg/node:20.11}], resource_class: medium}

jobs:
  preflight:
    executor: base
    steps:
      - checkout
      - run:
          name: Fail-closed parameter preflight
          environment:
            RUN_VALIDATION: << pipeline.parameters.run_validation >>
            RUN_GITHUB_AUTOMATION_CHECKS: << pipeline.parameters.run_github_automation_checks >>
            RUN_AGENT_HEALTH_CHECKS: << pipeline.parameters.run_agent_health_checks >>
            DEPLOY_STAGING: << pipeline.parameters.deploy_staging >>
            DEPLOY_PRODUCTION: << pipeline.parameters.deploy_production >>
            ROLLBACK_STAGING: << pipeline.parameters.rollback_staging >>
            ROLLBACK_PRODUCTION: << pipeline.parameters.rollback_production >>
            EMERGENCY_STOP: << pipeline.parameters.emergency_stop >>
            TARGET_ENVIRONMENT: << pipeline.parameters.target_environment >>
            CHANGE_REFERENCE: << pipeline.parameters.change_reference >>
          command: bash scripts/ci/preflight.sh
      - store_artifacts: {path: artifacts/evidence, destination: evidence/preflight}

  verify_lockfiles:
    executor: node
    steps:
      - checkout
      - run: {name: Verify immutable revision, command: 'set -euo pipefail; test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"'}
      - run: {name: Verify lockfiles, command: bash scripts/ci/verify-lockfiles.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/lockfiles}

  test_build:
    executor: node
    steps:
      - checkout
      - run:
          name: Install, typecheck, test and build
          command: |
            set -euo pipefail
            mkdir -p artifacts/evidence artifacts/reports
            npm ci --ignore-scripts
            npm run typecheck
            npm test
            npm run build
            npm pack --ignore-scripts --pack-destination artifacts/reports
            sha256sum artifacts/reports/*.tgz > artifacts/reports/package.sha256
            printf '{"status":"PASS","git_sha":"%s"}\n' "$CIRCLE_SHA1" > artifacts/evidence/build.json
      - store_artifacts: {path: artifacts, destination: evidence/build}

  validate_github_workflows:
    executor: base
    steps:
      - checkout
      - run: {name: Validate GitHub workflow integrity, command: bash scripts/ci/validate-github-workflows.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/github-workflows}

  agent_contract_tests:
    executor: base
    steps:
      - checkout
      - run:
          name: Sandbox agent contract tests
          environment: {DRY_RUN: "true", SANDBOX_MODE: "true", ENABLE_EXTERNAL_WRITES: "false"}
          command: bash scripts/ci/run-agent-contract-tests.sh
      - store_artifacts: {path: artifacts/evidence, destination: evidence/agents}

  build_release:
    executor: base
    steps:
      - checkout
      - run: {name: Build immutable release and manifest, command: bash scripts/ci/build-release-manifest.sh}
      - persist_to_workspace:
          root: .
          paths: [release-bundle.tar.gz, artifacts/release]
      - store_artifacts: {path: release-bundle.tar.gz, destination: release/release-bundle.tar.gz}
      - store_artifacts: {path: artifacts/release, destination: release/manifest}

  deploy_staging:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Deploy approved staging artifact, command: bash scripts/ci/deploy-staging.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/staging-deploy}

  deploy_production:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Deploy approved production artifact, command: bash scripts/ci/deploy-production.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/production-deploy}

  verify_deployment:
    executor: base
    parameters:
      environment: {type: enum, enum: [staging, production]}
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Post-deploy verification, command: bash scripts/ci/post-deploy-verify.sh << parameters.environment >>}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/post-deploy}

  rollback_staging:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Roll back to last verified staging artifact, command: bash scripts/ci/rollback-staging.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/staging-rollback}

  rollback_production:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Roll back to last verified production artifact, command: bash scripts/ci/rollback-production.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/production-rollback}

  hold_production:
    type: approval

  hold_production_rollback:
    type: approval

workflows:
  validation_only:
    when: pipeline.parameters.run_validation
    jobs:
      - preflight
      - verify_lockfiles: {requires: [preflight], context: ci-readonly}
      - test_build: {requires: [verify_lockfiles], context: ci-readonly}
      - validate_github_workflows: {requires: [verify_lockfiles], context: ci-readonly}
      - agent_contract_tests: {requires: [verify_lockfiles], context: ci-readonly}

  staging_release:
    when: pipeline.parameters.deploy_staging
    jobs:
      - preflight
      - verify_lockfiles: {requires: [preflight], context: ci-readonly}
      - test_build: {requires: [verify_lockfiles], context: ci-readonly}
      - validate_github_workflows: {requires: [verify_lockfiles], context: ci-readonly}
      - agent_contract_tests: {requires: [verify_lockfiles], context: ci-readonly}
      - build_release: {requires: [test_build, validate_github_workflows, agent_contract_tests], context: ci-readonly}
      - deploy_staging: {requires: [build_release], context: staging-deploy}
      - verify_staging: {name: verify_staging, requires: [deploy_staging], context: staging-deploy, environment: staging}
      - rollback_staging: {requires: [{verify_staging: failed}], context: staging-deploy}

  production_release:
    when: pipeline.parameters.deploy_production
    jobs:
      - preflight
      - verify_lockfiles: {requires: [preflight], context: ci-readonly}
      - test_build: {requires: [verify_lockfiles], context: ci-readonly}
      - validate_github_workflows: {requires: [verify_lockfiles], context: ci-readonly}
      - agent_contract_tests: {requires: [verify_lockfiles], context: ci-readonly}
      - build_release: {requires: [test_build, validate_github_workflows, agent_contract_tests], context: ci-readonly}
      - hold_production: {requires: [build_release]}
      - deploy_production: {requires: [hold_production], context: production-deploy}
      - verify_production: {name: verify_production, requires: [deploy_production], context: production-deploy, environment: production}

  staging_rollback:
    when: pipeline.parameters.rollback_staging
    jobs:
      - preflight
      - hold_staging_rollback: {requires: [preflight]}
      - rollback_staging: {requires: [hold_staging_rollback], context: staging-deploy}
      - verify_staging_rollback: {name: verify_staging_rollback, requires: [rollback_staging], context: staging-deploy, environment: staging}

  production_rollback:
    when: pipeline.parameters.rollback_production
    jobs:
      - preflight
      - hold_production_rollback: {requires: [preflight]}
      - rollback_production: {requires: [hold_production_rollback], context: production-deploy}
      - verify_production_rollback: {name: verify_production_rollback, requires: [rollback_production], context: production-deploy, environment: production}
