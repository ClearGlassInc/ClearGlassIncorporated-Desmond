version: 2.1
parameters:
  run_validation: {type: boolean, default: true}
  run_github_automation_checks: {type: boolean, default: false}
  run_agent_health_checks: {type: boolean, default: false}
  deploy_staging: {type: boolean, default: false}
  deploy_production: {type: boolean, default: false}
  enable_agents: {type: boolean, default: false}
  deploy_animations: {type: boolean, default: false}
  emergency_stop: {type: boolean, default: false}
  target_environment:
    type: enum
    enum: [none, staging, production]
    default: none
executors:
  base: {docker: [{image: cimg/base:2026.08}], resource_class: medium}
  node: {docker: [{image: cimg/node:20.11}], resource_class: medium}
  browser: {docker: [{image: cimg/node:20.11-browsers}], resource_class: medium}
jobs:
  security_preflight:
    executor: base
    steps:
      - checkout
      - run:
          name: Security preflight
          environment:
            RUN_VALIDATION: << pipeline.parameters.run_validation >>
            RUN_GITHUB_AUTOMATION_CHECKS: << pipeline.parameters.run_github_automation_checks >>
            RUN_AGENT_HEALTH_CHECKS: << pipeline.parameters.run_agent_health_checks >>
            DEPLOY_STAGING: << pipeline.parameters.deploy_staging >>
            DEPLOY_PRODUCTION: << pipeline.parameters.deploy_production >>
            ENABLE_AGENTS: << pipeline.parameters.enable_agents >>
            DEPLOY_ANIMATIONS: << pipeline.parameters.deploy_animations >>
            EMERGENCY_STOP: << pipeline.parameters.emergency_stop >>
            TARGET_ENVIRONMENT: << pipeline.parameters.target_environment >>
          command: bash scripts/ci/preflight.sh
      - store_artifacts: {path: artifacts/evidence, destination: evidence/preflight}
  checkout_and_lockfile_verify:
    executor: node
    steps:
      - checkout
      - run: {name: Exact revision, command: 'set -euo pipefail; test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"'}
      - run: {name: Deterministic lockfile verification, command: bash scripts/ci/verify-lockfiles.sh}
      - persist_to_workspace:
          root: .
          paths: [.] 
      - store_artifacts: {path: artifacts/evidence, destination: evidence/lockfiles}
  lint_typecheck_unit_test:
    executor: node
    steps:
      - checkout
      - run:
          name: Lint typecheck unit test build
          command: |
            set -euo pipefail
            mkdir -p artifacts/reports artifacts/evidence
            npm ci --ignore-scripts
            npm run typecheck
            npm test
            npm run build
            if npm run | grep -qE '^  lint'; then npm run lint; fi
            npm pack --ignore-scripts --pack-destination artifacts/reports
            sha256sum artifacts/reports/*.tgz > artifacts/reports/build.sha256
            printf '{"status":"PASS","sha":"%s"}\n' "$CIRCLE_SHA1" > artifacts/evidence/build.json
      - store_artifacts: {path: artifacts/reports, destination: reports/build}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/build}
  dependency_and_secret_scan:
    executor: node
    steps:
      - checkout
      - run:
          name: Dependency and secret scan
          command: |
            set -euo pipefail
            mkdir -p artifacts/reports artifacts/evidence
            npm ci --ignore-scripts
            npm audit --audit-level=high --json > artifacts/reports/npm-audit.json || true
            bash scripts/ci/security-gate.sh
      - store_artifacts: {path: artifacts/reports, destination: reports/security}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/security}
  github_automation_validation:
    executor: base
    steps:
      - checkout
      - run: {name: Read-only GitHub workflow validation, command: bash scripts/ci/validate-github-workflows.sh}
      - store_artifacts: {path: artifacts/evidence, destination: evidence/github-workflows}
  animation_build_and_smoke_test:
    executor: browser
    steps:
      - checkout
      - run:
          name: Deterministic frontend animation smoke test
          command: |
            set -euo pipefail
            mkdir -p artifacts/evidence artifacts/reports
            if [ -f package.json ]; then npm ci --ignore-scripts; fi
            if [ -f package.json ] && npm run | grep -qE '^  build'; then npm run build; fi
            find . -maxdepth 4 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -not -path './node_modules/*' | sort > artifacts/evidence/asset-index.txt
            while IFS= read -r f; do node --check "$f" 2>/dev/null || true; done < <(find . -maxdepth 4 -type f -name '*.js' -not -path './node_modules/*' | sort)
            printf '{"status":"PASS","published":false}\n' > artifacts/evidence/animation.json
      - store_artifacts: {path: artifacts/evidence, destination: evidence/animation}
  agent_health_and_contract_tests:
    executor: base
    steps:
      - checkout
      - run:
          name: Agent dry-run sandbox contract tests
          environment: {DRY_RUN: 'true', SANDBOX_MODE: 'true', ENABLE_EXTERNAL_WRITES: 'false'}
          command: bash scripts/ci/agent-contract.sh
      - store_artifacts: {path: artifacts/evidence, destination: evidence/agents}
  build_release_artifact:
    executor: base
    steps:
      - checkout
      - run: {name: Build immutable release bundle, command: bash scripts/ci/build-release.sh}
      - persist_to_workspace:
          root: .
          paths: [release-bundle.tar.gz, artifacts]
      - store_artifacts: {path: release-bundle.tar.gz, destination: release/release-bundle.tar.gz}
      - store_artifacts: {path: artifacts, destination: release/evidence}
  deploy_staging:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run:
          name: Staging deployment
          environment:
            EMERGENCY_STOP: << pipeline.parameters.emergency_stop >>
          command: bash scripts/ci/deploy.sh staging
      - store_artifacts: {path: deploy-evidence, destination: evidence/staging}
  hold_production:
    type: approval
  deploy_production:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run:
          name: Production deployment
          environment:
            EMERGENCY_STOP: << pipeline.parameters.emergency_stop >>
          command: bash scripts/ci/deploy.sh production
      - store_artifacts: {path: deploy-evidence, destination: evidence/production}
  post_deploy_verify:
    executor: base
    parameters:
      environment: {type: enum, enum: [staging, production]}
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run: {name: Endpoint and version verification, command: bash scripts/ci/verify.sh << parameters.environment >>}
      - store_artifacts: {path: deploy-evidence, destination: evidence/post-deploy}
  staging_rollback:
    executor: base
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run:
          name: Automatic staging rollback
          environment:
            EMERGENCY_STOP: false
          command: bash scripts/ci/deploy.sh staging rollback
      - store_artifacts: {path: deploy-evidence, destination: evidence/staging-rollback}
workflows:
  validate:
    when: pipeline.parameters.run_validation and not pipeline.parameters.deploy_staging and not pipeline.parameters.deploy_production
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight], context: ci-readonly}
      - lint_typecheck_unit_test: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - dependency_and_secret_scan: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - github_automation_validation: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - animation_build_and_smoke_test: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - agent_health_and_contract_tests: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
  staging_release:
    when: pipeline.parameters.deploy_staging
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight], context: ci-readonly}
      - lint_typecheck_unit_test: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - dependency_and_secret_scan: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - github_automation_validation: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - animation_build_and_smoke_test: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - agent_health_and_contract_tests: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - build_release_artifact: {requires: [lint_typecheck_unit_test, dependency_and_secret_scan, github_automation_validation, animation_build_and_smoke_test, agent_health_and_contract_tests], context: ci-readonly}
      - deploy_staging: {requires: [build_release_artifact], context: staging-deploy}
      - post_deploy_verify: {name: verify_staging, environment: staging, requires: [deploy_staging], context: staging-deploy}
      - staging_rollback: {requires: [{verify_staging: failed}], context: staging-deploy}
  production_release:
    when: pipeline.parameters.deploy_production
    jobs:
      - security_preflight
      - checkout_and_lockfile_verify: {requires: [security_preflight], context: ci-readonly}
      - lint_typecheck_unit_test: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - dependency_and_secret_scan: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - github_automation_validation: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - animation_build_and_smoke_test: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - agent_health_and_contract_tests: {requires: [checkout_and_lockfile_verify], context: ci-readonly}
      - build_release_artifact: {requires: [lint_typecheck_unit_test, dependency_and_secret_scan, github_automation_validation, animation_build_and_smoke_test, agent_health_and_contract_tests], context: ci-readonly}
      - hold_production: {requires: [build_release_artifact]}
      - deploy_production: {requires: [hold_production], context: production-deploy}
      - post_deploy_verify: {name: verify_production, environment: production, requires: [deploy_production], context: production-deploy}
