version: 2.1

jobs:
  fly_credential_present:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify Fly credential presence without disclosure
          command: |
            set -euo pipefail
            if [ -z "${FLY_API_TOKEN:-}" ]; then
              echo "FLY_API_TOKEN_PRESENT=false"
              exit 2
            fi
            echo "FLY_API_TOKEN_PRESENT=true"

  agent_health_live:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify current public agent health
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 2 --retry-all-errors \
              https://clearglass-agent-service.fly.dev/health \
              -o /tmp/health.json
            grep -q '"status"' /tmp/health.json
            grep -q '"ok"' /tmp/health.json
            echo "Public agent health endpoint: PASS"

workflows:
  production_probe:
    jobs:
      - fly_credential_present
      - agent_health_live
