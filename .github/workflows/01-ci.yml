name: 01 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    name: validate-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in index.html 404.html sitemap.xml robots.txt; do
            if [ ! -f "$file" ]; then
              echo "ERROR: required site file missing: $file"
              missing=1
            else
              echo "OK: $file present"
            fi
          done
          exit "$missing"

      - name: Install Python dependencies when present
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[test]"
          fi

      - name: Run Python tests when present
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -d tests ] && find tests -type f -name "test_*.py" -print -quit | grep -q .; then
            python -m pytest tests -q
          else
            echo "No pytest tests found; skipping Python tests."
          fi

      - name: Validate HTML parsing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class Parser(HTMLParser):
              pass

          failed = False
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              try:
                  Parser().feed(path.read_text(encoding='utf-8'))
                  print(f'OK {path}')
              except Exception as exc:
                  failed = True
                  print(f'ERROR {path}: {exc}')
          sys.exit(1 if failed else 0)
          PY

      - name: Check internal links
        shell: bash
        run: |
          set -euo pipefail
          find . -name "*.html" -not -path "./.git/*" | while read -r file; do
            grep -oE 'href="[^"]+"' "$file" | sed -E 's/^href="//; s/"$//' | grep -vE '^(https?:)?//|mailto:|tel:|#|javascript:' | while read -r link; do
              clean="${link%%#*}"
              [ -z "$clean" ] && continue
              base="$(dirname "$file")"
              target="$base/$clean"
              if [ ! -f "$target" ] && [ ! -f "$clean" ] && [ ! -d "$target" ] && [ ! -d "$clean" ]; then
                echo "WARN: possible broken internal link '$link' in $file"
              fi
            done || true
          done
          echo "Internal link check complete."
