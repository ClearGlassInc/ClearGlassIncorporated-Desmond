name: 03 Dependency Scan
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: never
      - name: Failure alert
        if: failure()
        run: echo "Workflow failed. Check GitHub Actions logs immediately."

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else echo "No requirements.txt found; skipping."; fi
      - name: Failure alert
        if: failure()
        run: echo "Workflow failed. Check GitHub Actions logs immediately."
