name: Deploy ClearGlass Pages

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clearglass-pages
  cancel-in-progress: true

jobs:
  build:
    name: build-static-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f sitemap.xml
          test -f robots.txt

      - name: Prepare static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R index.html 404.html sitemap.xml robots.txt assets _site/ 2>/dev/null || true
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearglass-site
          path: _site
          if-no-files-found: error

  deploy:
    name: deploy-static-site-branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: clearglass-site
          path: _site

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
