name: Add Business Productivity Suite product

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-business-productivity-suite.yml

permissions:
  contents: write

jobs:
  integrate-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch centralized product navigation and catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/cg-design-system.js')
          text = path.read_text(encoding='utf-8')

          product_line = "      ['Business Productivity Suite', '/business-productivity-suite.html', '▦', 'CAD Productivity Plans'],\n"
          product_anchor = "      ['SMB Cyber Trust Kit', '/smb-cyber-trust-kit.html', '🔐', 'Plain-Language Security'],\n"
          if product_line not in text:
              if product_anchor not in text:
                  raise SystemExit('Product navigation anchor not found')
              text = text.replace(product_anchor, product_anchor + product_line, 1)

          catalog_function = r'''
          /* Add the externally deployed Business Productivity Suite to the
             main product catalog without rewriting the existing catalog file. */
          function mountBusinessProductCard() {
            var pagePath = location.pathname.replace(/\/+$/, '').toLowerCase();
            if (pagePath !== '/products' && pagePath !== '/products.html') return;
            if (document.getElementById('cg-business-productivity-suite-card')) return;

            var container = document.querySelector('.cg-page .cg-container');
            var hero = container && container.querySelector('.cg-hero');
            if (!container || !hero) return;

            var section = document.createElement('section');
            section.className = 'cg-product-section';
            section.id = 'business-productivity-suite';
            section.innerHTML =
              '<div class="cg-section-head">' +
                '<p class="cg-eyebrow">Business productivity systems</p>' +
                '<h2>Business productivity systems</h2>' +
                '<p>Canadian-first plan comparison and subscription-readiness experiences connected to the ClearGlass product ecosystem.</p>' +
              '</div>' +
              '<div class="cg-product-grid">' +
                '<article class="cg-product-card" id="cg-business-productivity-suite-card">' +
                  '<span class="cg-card-icon" aria-hidden="true">▦</span>' +
                  '<p class="cg-card-meta">Business productivity systems</p>' +
                  '<h3>Business Productivity Suite</h3>' +
                  '<p>CAD-oriented productivity plan comparison, seat configuration, and subscription lifecycle architecture.</p>' +
                  '<div class="cg-card-actions">' +
                    '<a class="btn btn-dark" href="/business-productivity-suite.html">View Product</a>' +
                    '<a class="btn btn-glass" href="https://turbo-fishstick-jg11zep.pages.github.io/" target="_blank" rel="noopener noreferrer">Launch Live App ↗</a>' +
                  '</div>' +
                '</article>' +
              '</div>';

            hero.insertAdjacentElement('afterend', section);
          }
          '''

          function_anchor = "  function init() {\n"
          if 'function mountBusinessProductCard()' not in text:
              if function_anchor not in text:
                  raise SystemExit('Initialization function anchor not found')
              text = text.replace(function_anchor, catalog_function + '\n' + function_anchor, 1)

          call_anchor = "    mountTopbar();\n    mountAmbient();"
          call_replacement = "    mountTopbar();\n    mountBusinessProductCard();\n    mountAmbient();"
          if '    mountBusinessProductCard();' not in text:
              if call_anchor not in text:
                  raise SystemExit('Initialization call anchor not found')
              text = text.replace(call_anchor, call_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check assets/js/cg-design-system.js

      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/add-business-productivity-suite.yml
          git config user.name "ClearGlass Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Business Productivity Suite into product catalog [skip ci]"
          git push origin main
