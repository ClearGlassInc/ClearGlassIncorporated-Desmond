name: Agent Army Rust Crypto

on:
  pull_request:
    branches: ["main"]
    paths:
      - "agent_army/secure_runtime/**"
      - "agent_army/README.md"
      - "agent_army/AGENT_POLICY.md"
      - ".github/workflows/agent-army-crypto.yml"
  push:
    branches: ["main"]
    paths:
      - "agent_army/secure_runtime/**"
      - "agent_army/README.md"
      - "agent_army/AGENT_POLICY.md"
      - ".github/workflows/agent-army-crypto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-army-crypto-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secure-runtime:
    name: Rust encryption validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent_army/secure_runtime

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy

      - name: Generate dependency lock
        run: cargo generate-lockfile

      - name: Verify exact direct dependency pin
        run: grep -F 'age = { version = "=0.12.1"' Cargo.toml

      - name: Normalize formatting on runner
        run: cargo fmt --all

      - name: Commit verified lock and formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git add agent_army/secure_runtime/Cargo.lock agent_army/secure_runtime/src/
          if git diff --cached --quiet; then
            echo "Runner output already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(agent-army): lock and format Rust secure runtime"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run cryptographic tests
        run: cargo test --all-targets --all-features --locked

      - name: Build hardened release binary
        run: cargo build --release --locked

      - name: Validate CLI round trip and tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          binary="target/release/clearglass-secure"

          "$binary" keygen \
            --identity "$work/agent.identity" \
            --recipient "$work/agent.recipient"

          printf '%s\n' '{"plan_id":"ci-round-trip","classification":"confidential"}' > "$work/plan.json"
          "$binary" encrypt \
            --recipient "$work/agent.recipient" \
            --input "$work/plan.json" \
            --output "$work/plan.json.age"
          "$binary" decrypt \
            --identity "$work/agent.identity" \
            --input "$work/plan.json.age" \
            --output "$work/decrypted.json"
          cmp "$work/plan.json" "$work/decrypted.json"
          test "$(stat -c '%a' "$work/agent.identity")" = "600"
          test "$(stat -c '%a' "$work/decrypted.json")" = "600"

          cp "$work/plan.json.age" "$work/tampered.age"
          python - "$work/tampered.age" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          data[-1] ^= 1
          path.write_bytes(data)
          PY

          if "$binary" decrypt \
            --identity "$work/agent.identity" \
            --input "$work/tampered.age" \
            --output "$work/must-not-exist.json"; then
            echo "tampered ciphertext unexpectedly decrypted" >&2
            exit 1
          fi
          test ! -e "$work/must-not-exist.json"
