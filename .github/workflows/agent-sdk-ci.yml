name: Agent SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'clearglassinc_sdk/**'
      - '.github/workflows/agent-sdk-ci.yml'
  pull_request:
    paths:
      - 'clearglassinc_sdk/**'
      - '.github/workflows/agent-sdk-ci.yml'

permissions:
  contents: read

concurrency:
  group: agent-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: clearglassinc_sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # dev/server pull fastapi + httpx so the server and TestClient tests
          # run instead of silently skipping; `all` pulls the real openai and
          # anthropic SDKs so the provider-adapter tests do the same.
          pip install -e ".[dev,server,all]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test examples and CLI
        run: |
          python examples/hello_agent.py
          python examples/streaming_agent.py
          python examples/advanced_agent.py
          python -m clearglassinc_sdk.cli version

  docker:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t clearglassinc-sdk:ci clearglassinc_sdk

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name sdk-smoke -p 8000:8000 clearglassinc-sdk:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "health check passed"
              docker rm -f sdk-smoke
              exit 0
            fi
            sleep 3
          done
          echo "health check never passed; container logs:"
          docker logs sdk-smoke
          docker rm -f sdk-smoke
          exit 1
