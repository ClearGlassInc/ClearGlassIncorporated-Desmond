name: AgentOps Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "doctor debug deploy"
        required: false
        default: "deploy"
        type: string
  push:
    paths:
      - "clearglass-agentops/**"

permissions:
  contents: read

jobs:
  run-agentops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run AgentOps
        working-directory: clearglass-agentops
        run: npm run ${{ inputs.mode || 'deploy' }}
      - uses: actions/upload-artifact@v4
        with:
          name: agentops-reports
          path: clearglass-agentops/reports/*.json
          if-no-files-found: error
