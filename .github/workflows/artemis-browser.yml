name: Artemis Browser Assistant

on:
  push:
    branches: [main]
    paths:
      - 'apps/artemis-browser/**'
      - 'artemis/intelligence/browser_assistant.py'
      - 'artemis/tests/test_browser_assistant.py'
      - '.github/workflows/artemis-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/artemis-browser/**'
      - 'artemis/intelligence/browser_assistant.py'
      - 'artemis/tests/test_browser_assistant.py'
      - '.github/workflows/artemis-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install pytest
      - run: python -m pytest artemis/tests/test_browser_assistant.py -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/artemis-browser/package-lock.json
      - working-directory: apps/artemis-browser
        run: npm ci
      - working-directory: apps/artemis-browser
        run: npm run typecheck
      - working-directory: apps/artemis-browser
        run: npm run build
