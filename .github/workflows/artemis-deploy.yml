name: Artemis Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: artemis-pages
  cancel-in-progress: true

jobs:
  build:
    name: build-static-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f sitemap.xml
          test -f robots.txt

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_site' \
            ! -name 'node_modules' \
            ! -name '.gitignore' \
            -exec cp -R {} _site/ \;
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy-github-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate_pipeline:
    name: validate-pipeline
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment completed
        shell: bash
        run: echo "Artemis GitHub Pages deployment completed successfully."
