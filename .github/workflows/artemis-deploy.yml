name: artemis-deploy

on:
  push:
    branches: ["main"]
    paths:
      - "deployment/artemis/**"
      - ".github/workflows/artemis-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: production
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: clearglassinc/artemis-model

jobs:
  resolve-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependencies(model_name)
        run: ./deployment/artemis/scripts/dependencies.sh

  test_stage:
    runs-on: ubuntu-24.04
    needs: resolve-dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install -r deployment/artemis/app/requirements.txt
      - name: Pre-deploy validation
        run: |
          python -m py_compile deployment/artemis/app/main.py
          docker --version

  build_image:
    runs-on: ubuntu-24.04
    needs: test_stage
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deployment/artemis
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-24.04
    needs: build_image
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      - name: Deploy manifests
        run: |
          kubectl apply -f deployment/artemis/k8s/configmap.yaml
          kubectl apply -f deployment/artemis/k8s/deployment.yaml
          kubectl apply -f deployment/artemis/k8s/hpa.yaml
          kubectl rollout status deploy/artemis-model -n artemis --timeout=180s

  validate_pipeline:
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - name: Post-deploy health checks + rollback conditions
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' https://artemis-model.prod.clearglassinc.internal/health/ready || true)
            if [ "$code" = "200" ]; then
              echo "ready check passed"
              break
            fi
            sleep 10
          done
          code=$(curl -sS -o /tmp/live.json -w '%{http_code}' https://artemis-model.prod.clearglassinc.internal/health/live || true)
          if [ "$code" != "200" ]; then
            echo "Health check failed; triggering rollback"
            kubectl rollout undo deploy/artemis-model -n artemis
            exit 1
          fi
