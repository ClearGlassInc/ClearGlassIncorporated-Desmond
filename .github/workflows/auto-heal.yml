name: Auto Heal

on:
  workflow_run:
    workflows:
      - CI
      - Security
      - CodeQL
      - Deploy Pages
      - Policy Gate
      - Site Integrity Guard
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-heal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  heal:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.name != 'Auto Heal')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automation-write
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" FETCH_HEAD

      - name: Analyze and heal recent failures
        id: heal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_HEAL_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          AUTO_HEAL_WORKFLOW_NAME: Auto Heal
        run: python .github/auto-heal/auto_heal.py

      - name: Apply deterministic workflow doctor repairs
        if: steps.heal.outputs.needs_workflow_doctor == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/workflow_doctor.py ]]; then
            python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
            python scripts/workflow_doctor.py --fix
          else
            echo "No scripts/workflow_doctor.py present; diagnostics will remain review-only."
          fi

      - name: Create review branch for generated changes
        id: changes
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain .github/auto-heal .github/workflows)" ]]; then
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "writeback=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="auto-heal/${SOURCE_RUN}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "ClearGlass Auto Heal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add .github/auto-heal .github/workflows
          git commit -m "Auto-heal: record diagnostics and deterministic repairs"

          # Diagnostic persistence is useful, but repository policy must never
          # turn the healer itself into another failed workflow. Preserve the
          # local diagnosis and emit a warning when writeback is blocked.
          if git push --set-upstream origin "${BRANCH}"; then
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "writeback=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Auto-heal diagnosis completed, but GitHub policy/token permissions blocked review-branch push."
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "writeback=blocked" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-heal pull request
        if: steps.changes.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.changes.outputs.branch }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          set -euo pipefail
          if gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --title "Auto-heal: repair GitHub Actions failure" \
            --body "Automated, review-gated self-healing update.

          Source run: ${SOURCE_RUN_URL:-scheduled scan}

          This PR contains only generated diagnostics/history and deterministic workflow repairs permitted by .github/auto-heal/healing-strategies.json. No secrets are changed, no protected branch is force-pushed, and auto-merge is disabled."; then
            echo "Auto-heal review PR opened successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Review branch was pushed, but automatic PR creation is disabled or blocked by repository policy."
            {
              echo "### Auto-heal review branch ready"
              echo ""
              echo "Branch: \`${BRANCH}\`"
              echo ""
              echo "Diagnosis and deterministic repairs were preserved. Automatic PR creation was blocked by repository policy; the healer remains healthy instead of recursively failing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Auto-heal execution summary
        if: always()
        shell: bash
        env:
          PROCESSED: ${{ steps.heal.outputs.processed || '0' }}
          WRITEBACK: ${{ steps.changes.outputs.writeback || 'not-run' }}
        run: |
          {
            echo "### Auto Heal"
            echo ""
            echo "- Failures processed: ${PROCESSED}"
            echo "- Diagnostic writeback: ${WRITEBACK}"
            echo "- Security controls: preserved"
            echo "- Protected branch force-push: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
