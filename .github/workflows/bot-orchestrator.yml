name: Bot Orchestrator

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      target_bots:
        description: 'Comma-separated bot IDs to run (empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — log actions without writing or committing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bot-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Run Bot Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run master orchestrator
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_BOTS: ${{ inputs.target_bots || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bot_runner.py master_orchestrator

      - name: Commit generated outputs
        if: ${{ inputs.dry_run != true }}
        # Signed via the GitHub API so orchestrator commits show as "Verified" on
        # main; falls back to a plain push if the API path fails so outputs never
        # get dropped. (Mirrors scripts/content_committer.py's staged dirs.)
        uses: ./.github/actions/verified-commit
        with:
          message: "content: auto-update generated bot outputs [skip ci]"
          branch: main
          paths: marketing/output/ operations/output/

      - name: Upload bot outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bot-outputs-${{ github.run_id }}
          path: |
            marketing/output/
            operations/output/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          SUMMARY="operations/output/orchestrator_summary.json"
          echo "## 🤖 Bot Orchestrator Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$SUMMARY" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("operations/output/orchestrator_summary.json"))
          print(f"**Run:** {data['run_utc']}")
          print(f"**Total:** {data['total']} | **OK:** {data['ok']} | **Failed:** {data['failed']} | **Skipped:** {data['skipped']}")
          print()
          print("| Bot | Status | Duration |")
          print("|-----|--------|----------|")
          for b in data["bots"]:
              icon = "✅" if b["status"] == "ok" else "❌" if b["status"] == "error" else "⊘"
              err = f" — {b['error']}" if b.get("error") else ""
              print(f"| `{b['bot_id']}` | {icon} {b['status']}{err} | {b['duration_s']}s |")
          PY
          else
            echo "Summary not available" >> "$GITHUB_STEP_SUMMARY"
          fi
