name: Campaign Weekly Summary

on:
  schedule:
    - cron: '0 8 * * 1'      # Every Monday 8:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write              # Required to open issues

jobs:

  generate-weekly-campaign-report:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.build_report.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4          # Node 22 — fixes deprecation warning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dateutil --quiet

      - name: Generate campaign report
        id: build_report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os, json
          from datetime import datetime, timedelta

          today = datetime.utcnow()
          week_start = (today - timedelta(days=7)).strftime('%Y-%m-%d')
          week_end = today.strftime('%Y-%m-%d')

          report = f"""## ClearGlass Campaign Weekly Summary
          **Period:** {week_start} to {week_end}

          ### Activity Log
          - Scheduled report generated successfully
          - Review campaign KPIs and content performance below

          ### Action Items
          - [ ] Review post engagement metrics
          - [ ] Schedule next week content batch
          - [ ] Update ClearGlass LinkedIn pipeline

          *Generated by ClearGlass Master Control — {today.strftime('%Y-%m-%d %H:%M')} UTC*
          """

          # Write to env output (GitHub Actions v2 style)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              # Multiline output requires delimiter
              f.write('report<<EOF\n')
              f.write(report.strip())
              f.write('\nEOF\n')

          print("Report generated successfully.")
          EOF

  open-weekly-summary-issue:
    needs: generate-weekly-campaign-report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open GitHub Issue with report
        uses: actions/github-script@v7       # Node 22
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Campaign Weekly Summary — ${today}`,
              body: `${{ needs.generate-weekly-campaign-report.outputs.report }}`,
              labels: ['campaign', 'weekly-report']
            });
            console.log('Issue created successfully.');
