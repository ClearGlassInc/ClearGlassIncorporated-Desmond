name: Campaign Weekly Summary

# ── Monday morning recap of the prior week's content pipeline ─────────────────
# Reads metrics/runs.json, produces a pillar-coverage report and platform
# distribution table, then opens a GitHub issue for operator review.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC every Monday
    - cron: '0 8 * * 1'

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Generate the weekly report ─────────────────────────────────────
  report:
    name: "Generate weekly campaign report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report_week: ${{ steps.reporter.outputs.report_week }}
      trailing_runs: ${{ steps.reporter.outputs.trailing_runs }}
      days_covered: ${{ steps.reporter.outputs.days_covered }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi

      - name: Ensure output directories
        run: mkdir -p marketing/output/metrics marketing/output/reports

      - name: Run campaign reporter
        id: reporter
        run: |
          python bots/campaign_reporter.py
          # Emit key values to GITHUB_OUTPUT for downstream use
          WEEK=$(python -c "from datetime import datetime, timezone; now=datetime.now(timezone.utc); y,w,_=now.isocalendar(); print(f'{y}-W{w:02d}')")
          echo "report_week=${WEEK}" >> "$GITHUB_OUTPUT"

          # Parse trailing runs from generated report
          RUNS=$(python -c "
          import json; from pathlib import Path
          f = Path('marketing/output/metrics/latest_weekly.json')
          if f.exists():
              d = json.loads(f.read_text())
              print(d.get('trailing_7_days', 0))
          else:
              print(0)
          ")
          echo "trailing_runs=${RUNS}" >> "$GITHUB_OUTPUT"

          DAYS=$(python -c "
          import json; from pathlib import Path
          f = Path('marketing/output/metrics/latest_weekly.json')
          if f.exists():
              d = json.loads(f.read_text())
              print(d.get('days_with_content', 0))
          else:
              print(0)
          ")
          echo "days_covered=${DAYS}" >> "$GITHUB_OUTPUT"

      - name: Commit report to repository
        run: |
          if git status --porcelain -- marketing/output/reports marketing/output/metrics | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marketing/output/reports marketing/output/metrics
            git commit -m "Campaign reporter: weekly summary $(date -u +%Y-W%V) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No report changes to commit."
          fi

  # ── Job 2: Create summary issue ───────────────────────────────────────────
  issue:
    name: "Open weekly summary issue"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "type:report"    --color "BFD4F2" --description "Automated report" 2>/dev/null || true
          gh label create "status:published" --color "0E8A16" --description "Published to all platforms" 2>/dev/null || true

      - name: Create weekly summary issue
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ needs.report.outputs.report_week }}
          RUNS: ${{ needs.report.outputs.trailing_runs }}
          DAYS: ${{ needs.report.outputs.days_covered }}
        run: |
          REPORT_FILE="marketing/output/reports/weekly_latest.md"
          if [[ -f "$REPORT_FILE" ]]; then
            BODY=$(cat "$REPORT_FILE")
          else
            BODY="Weekly report not found. Check the \`report\` job for errors."
          fi

          gh issue create \
            --title "Campaign Summary: ${WEEK} · ${RUNS} runs · ${DAYS}/7 days" \
            --body "$BODY" \
            --label "type:report,status:published" \
            2>/dev/null || echo "Issue creation skipped (may already exist or label missing)"

      - name: Write job summary
        env:
          WEEK: ${{ needs.report.outputs.report_week }}
          RUNS: ${{ needs.report.outputs.trailing_runs }}
          DAYS: ${{ needs.report.outputs.days_covered }}
        run: |
          echo "## Campaign Weekly Summary · ${WEEK}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runs last 7 days | ${RUNS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Days with content | ${DAYS} / 7 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full report committed to \`marketing/output/reports/weekly_latest.md\`." >> "$GITHUB_STEP_SUMMARY"
