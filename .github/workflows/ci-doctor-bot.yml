name: ClearGlass CI Doctor Bot

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "tools/ci_doctor_bot.py"
      - "requirements*.txt"
      - "pyproject.toml"
  push:
    branches: ["main", "fix/ci-node24-validate-site"]
    paths:
      - ".github/workflows/**"
      - "tools/ci_doctor_bot.py"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ci-doctor-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: diagnose-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bot dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Run CI Doctor Bot
        run: python tools/ci_doctor_bot.py

      - name: Upload CI Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-doctor-report
          path: |
            ci-doctor-report.md
            ci-doctor-report.json
          if-no-files-found: ignore
