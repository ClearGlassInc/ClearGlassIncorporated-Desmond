name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  # Allow manual on-demand runs (Python Tests, Site Reliability Audit, lint,
  # workflow-doctor, OSINT deck) from the Actions tab / API.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tooling:
    name: Node Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Deterministic tooling build
        run: npm run build
      - name: Verify expected build artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/scripts/sync-stripe-products.js
          {
            echo "### Node tooling verification"
            echo "- npm ci: PASS"
            echo "- typecheck: PASS"
            echo "- tests: PASS"
            echo "- build: PASS"
            echo "- expected artifact: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            clearglass-commerce/control-plane/requirements.txt
      - name: Install project, commerce, and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CI on the reviewed test-tool versions in requirements.txt.
          # The configured suite also includes the commerce control-plane tests,
          # so install their declared runtime dependencies before collection.
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
          python -m pip install -r clearglass-commerce/control-plane/requirements.txt
          python -m pip check
      - name: Run configured Python test suite
        run: python -m pytest --cov=artemis --cov-report=xml -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # Pin ruff: an unpinned install lets CI pull a newer ruff whose expanded
      # default rule set flags hundreds of pre-existing style issues, turning
      # this repo-wide `ruff check .` red with no code change. Bump deliberately.
      - run: pip install "ruff==0.15.8"
      - run: ruff check .

  site-audit:
    name: Site Reliability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/site_reliability_audit.py

  search-integrity:
    name: Search discovery and structured data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate generated search assets are current
        run: |
          python3 tools/generate_search_assets.py
          git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json
      - name: Validate indexability, links, metadata, and JSON-LD
        run: python3 tools/seo_audit.py
      - name: Validate generated internal links
        run: python3 tools/internal_links.py --check

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enforce performance, accessibility, and SEO budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  workflow-doctor:
    name: Workflow Doctor (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - run: python scripts/workflow_doctor.py
      - name: Enforce workflow safety invariants
        run: python scripts/audit_github_actions.py

  osint-deck:
    name: OSINT Deck Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Fail-closed validation of the Ontario/Burlington OSINT deck: present,
      # indexable, intel.json valid, sitemap/nav/sw wired, inline JS + sw.js
      # syntax. Node ships on the runner, so the JS syntax checks run too.
      - run: python scripts/osint_deck_release.py --strict
