name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allow manual on-demand runs (Python Tests, Site Reliability Audit, lint,
  # workflow-doctor, OSINT deck) from the Actions tab / API.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    name: validate-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # Node24-compatible pinned checkout

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for required_file in index.html 404.html sitemap.xml robots.txt; do
            if [ ! -f "$required_file" ]; then
              echo "::error file=$required_file::Required site file is missing"
              missing=1
            else
              echo "OK: $required_file present"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required site files present. index.html is protected and not modified."

      - name: Validate HTML files without blocking deploy
        shell: bash
        run: |
          set -euo pipefail
          if sudo apt-get update -y >/dev/null 2>&1 && sudo apt-get install -y tidy >/dev/null 2>&1; then
            find . -name "*.html" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
              echo "Checking HTML: $file"
              tidy -errors -quiet -utf8 "$file" 2>&1 || true
            done
            echo "HTML validation completed with warnings only."
          else
            echo "::warning::Unable to install tidy; skipping HTML validation."
          fi

      - name: Check internal links without blocking deploy
        shell: bash
        run: |
          set -euo pipefail
          find . -name "*.html" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
            base=$(dirname "$file")
            grep -oE 'href="[^"]+"' "$file" | sed -E 's/^href="//; s/"$//' | grep -Ev '^(https?:|mailto:|tel:|#|javascript:)' | while IFS= read -r link; do
              clean="${link%%#*}"
              [ -z "$clean" ] && continue
              target="$base/$clean"
              if [ ! -f "$target" ] && [ ! -f "$clean" ] && [ ! -d "$target" ] && [ ! -d "$clean" ]; then
                echo "::warning file=$file::Possible broken internal link: $link"
              fi
            done || true
          done
          echo "Internal link check completed with warnings only."

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest pytest-cov pyyaml
      - run: pytest tests/ --cov --cov-report=xml -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  site-audit:
    name: Site Reliability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - run: python scripts/site_reliability_audit.py

  workflow-doctor:
    name: Workflow Doctor (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - run: python scripts/workflow_doctor.py

  osint-deck:
    name: OSINT Deck Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      # Fail-closed validation of the Ontario/Burlington OSINT deck: present,
      # indexable, intel.json valid, sitemap/nav/sw wired, inline JS + sw.js
      # syntax. Node ships on the runner, so the JS syntax checks run too.
      - run: python scripts/osint_deck_release.py --strict
