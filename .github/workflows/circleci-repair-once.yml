name: CircleCI Branch Repair Once

on:
  push:
    branches:
      - circleci-project-setup
    paths:
      - .github/workflows/circleci-repair-once.yml

permissions:
  contents: write

concurrency:
  group: circleci-branch-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: circleci-project-setup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            clearglass-commerce/control-plane/requirements.txt

      - name: Apply verified repository repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one repair anchor in {path!r}; found {text.count(old)}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_before(path: str, marker: str, snippet: str, sentinel: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              if sentinel in text:
                  return
              index = text.lower().rfind(marker.lower())
              if index < 0:
                  raise SystemExit(f"missing insertion marker {marker!r} in {path}")
              target.write_text(text[:index] + snippet + "\n" + text[index:], encoding="utf-8")

          graph = "blog/graph-topology-multi-agent-research-workflow.html"
          replace_once(
              graph,
              "<title>Graph Topology Beats One Giant Context | ClearGlass Intelligence</title>",
              "<title>Graph Topology for Multi-Agent Research | ClearGlass</title>",
          )
          insert_before(
              graph,
              "</body>",
              '<script defer src="/logo-badge.js"></script>',
              "logo-badge.js",
          )
          insert_before(
              "data-fabric.html",
              "</body>",
              '<script defer src="/logo-badge.js"></script>',
              "logo-badge.js",
          )

          blog_index = ROOT / "blog/index.html"
          blog_text = blog_index.read_text(encoding="utf-8")
          graph_href = "/blog/graph-topology-multi-agent-research-workflow.html"
          if f'href="{graph_href}"' not in blog_text:
              snippet = (
                  '<section aria-label="Latest research" class="cg-latest-research">'
                  '<p><a href="/blog/graph-topology-multi-agent-research-workflow.html">'
                  'Graph topology for multi-agent research</a></p></section>'
              )
              marker = "</main>"
              index = blog_text.lower().rfind(marker)
              if index < 0:
                  raise SystemExit("blog/index.html has no </main> insertion point")
              blog_index.write_text(blog_text[:index] + snippet + "\n" + blog_text[index:], encoding="utf-8")

          replace_once(
              "llms.txt",
              "> investigations, and software architecture. Based in Burlington, Ontario,\n> Canada and serving clients worldwide.",
              "> investigations, and software architecture. Based in Burlington, Ontario, Canada\n> and serving clients worldwide.",
          )

          replace_once(
              "tools/authority_network_ci.py",
              '_RELEASE_SUPPLEMENTAL_PAGES: dict[str, tuple[str, str, str]] = {}',
              '_RELEASE_SUPPLEMENTAL_PAGES: dict[str, tuple[str, str, str]] = {\n'
              '    "blog/graph-topology-multi-agent-research-workflow.html": (\n'
              '        "Graph Topology Beats One Giant Context",\n'
              '        "planner-worker-verifier multi-agent research workflow",\n'
              '        "blog",\n'
              '    ),\n'
              '}',
          )

          replace_once(
              "tests/test_minerals_intelligence.py",
              '''def test_initial_live_feeds_fail_closed():\n    for name in ("policy", "news"):\n        payload = load_json(f"feeds/minerals/latest/{name}.json")\n        assert payload["status"] == "UNAVAILABLE"\n        assert payload["records"] == []\n        assert payload["retrieved_at"] is None\n''',
              '''def test_live_feeds_fail_closed_when_empty_and_report_refreshes_truthfully():\n    healthy_or_stale = {\n        "LIVE", "NEAR LIVE", "DELAYED", "DAILY", "WEEKLY", "MONTHLY",\n        "STALE", "DEGRADED", "OPERATIONAL", "HEALTHY",\n    }\n    for name in ("policy", "news"):\n        payload = load_json(f"feeds/minerals/latest/{name}.json")\n        records = payload["records"]\n        assert isinstance(records, list)\n        if records:\n            assert payload["status"] in healthy_or_stale\n            assert payload["retrieved_at"] is not None\n        else:\n            assert payload["status"] == "UNAVAILABLE"\n            assert payload["retrieved_at"] is None\n''',
          )
          PY

          # Use repository-owned generators for the exact site contracts rather
          # than hand-authoring their derived output.
          python tools/design_system.py
          python tools/generate_search_assets.py
          python tools/security_release_manifest.py

      - name: Install exact CI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
          python -m pip install -r clearglass-commerce/control-plane/requirements.txt
          python -m pip check

      - name: Validate repaired repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --cov=artemis --cov-report=xml -q
          python tools/internal_links.py --check
          python tools/tab_icons.py --check
          python tools/seo_audit.py
          python tools/security_release_manifest.py --check

          # Re-run deterministic generation and require a clean tree for every
          # generated search artifact.
          python tools/generate_search_assets.py
          git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json

      - name: Commit validated repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/circleci-repair-once.yml
          git config user.name "ClearGlass CI Repair"
          git config user.email "77194670+ClearGlasslabs@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve CircleCI site validation regressions"
          git push origin HEAD:circleci-project-setup
