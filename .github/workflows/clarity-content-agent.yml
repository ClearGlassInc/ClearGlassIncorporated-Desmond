name: Clarity 50-30-20 Content Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Test content policy and allocation
        run: python -m unittest -v test_content_agent.py
      - name: Generate governed draft brief
        run: python content_agent.py --seed content_seed.example.json --output content-brief.md --json-output content-brief.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: clarity-content-drafts
          path: |
            content-brief.md
            content-brief.json
          if-no-files-found: error
          retention-days: 14
