name: Clear Signal Homepage Integration

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/clear-signal-homepage-hero.jpg'
      - '.github/workflows/clear-signal-homepage.yml'

permissions:
  contents: write

concurrency:
  group: clear-signal-homepage
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add Clear Signal hero without deleting existing homepage content
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'data-clear-signal-hero="v1"'

          if marker in text:
              print('Clear Signal integration already present; no changes required.')
              raise SystemExit(0)

          asset = 'assets/images/clear-signal-homepage-hero.jpg'
          if not Path(asset).is_file():
              raise SystemExit(f'Missing required asset: {asset}')

          preload = '''\n<link rel="preload" as="image" href="/assets/images/clear-signal-homepage-hero.jpg" fetchpriority="high">\n'''
          if 'clear-signal-homepage-hero.jpg' not in text:
              head = re.search(r'</head>', text, flags=re.I)
              if not head:
                  raise SystemExit('No </head> element found; refusing to modify homepage.')
              text = text[:head.start()] + preload + text[head.start():]

          styles = r'''\n<style id="clear-signal-hero-v1">\n  /* Clear Signal: additive cinematic layer. Existing homepage structure remains intact. */\n  .clear-signal-hero {\n    position: relative;\n    z-index: 2;\n    width: min(1080px, 92vw);\n    margin: clamp(26px, 5vw, 56px) auto 0;\n    overflow: hidden;\n    border: 1px solid rgba(209,31,47,.24);\n    border-radius: 22px;\n    background: #070707;\n    box-shadow: 0 24px 70px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.06);\n    isolation: isolate;\n  }\n  .clear-signal-hero::before {\n    content: "";\n    position: absolute;\n    inset: 0;\n    z-index: 2;\n    pointer-events: none;\n    background:\n      linear-gradient(180deg, rgba(7,7,7,.04) 0%, rgba(7,7,7,.12) 52%, rgba(7,7,7,.78) 100%),\n      linear-gradient(90deg, rgba(7,7,7,.32), transparent 45%, rgba(209,31,47,.12));\n    mix-blend-mode: normal;\n  }\n  .clear-signal-hero::after {\n    content: "";\n    position: absolute;\n    inset: 0;\n    z-index: 3;\n    pointer-events: none;\n    border: 1px solid rgba(255,255,255,.045);\n    border-radius: inherit;\n    box-shadow: inset 0 0 80px rgba(0,0,0,.34);\n  }\n  .clear-signal-hero img {\n    display: block;\n    width: 100%;\n    aspect-ratio: 16 / 7;\n    min-height: 300px;\n    object-fit: cover;\n    object-position: center;\n    filter: grayscale(.18) contrast(1.08) brightness(.82);\n    transform: scale(1.012);\n    transition: transform 1.2s cubic-bezier(.2,.65,.2,1), filter .6s ease;\n  }\n  .clear-signal-hero:hover img {\n    transform: scale(1.035);\n    filter: grayscale(.08) contrast(1.1) brightness(.9);\n  }\n  .clear-signal-hero-copy {\n    position: absolute;\n    left: clamp(20px, 4vw, 48px);\n    right: clamp(20px, 4vw, 48px);\n    bottom: clamp(20px, 4vw, 40px);\n    z-index: 4;\n    display: flex;\n    align-items: end;\n    justify-content: space-between;\n    gap: 24px;\n    pointer-events: none;\n  }\n  .clear-signal-hero-kicker {\n    margin: 0 0 7px;\n    color: #d11f2f;\n    font: 700 9px/1.2 var(--mono, monospace);\n    letter-spacing: .2em;\n    text-transform: uppercase;\n  }\n  .clear-signal-hero-title {\n    margin: 0;\n    color: #f7f7f7;\n    font: 600 clamp(24px, 4vw, 48px)/.98 var(--serif, Georgia, serif);\n    letter-spacing: -.025em;\n    text-shadow: 0 4px 24px rgba(0,0,0,.6);\n  }\n  .clear-signal-hero-title span { color: #d11f2f; }\n  .clear-signal-hero-meta {\n    color: rgba(244,244,245,.68);\n    font: 600 8px/1.5 var(--mono, monospace);\n    letter-spacing: .13em;\n    text-transform: uppercase;\n    text-align: right;\n    white-space: nowrap;\n  }\n  .clear-signal-hero-signal {\n    display: inline-block;\n    width: 6px;\n    height: 6px;\n    margin-right: 7px;\n    border-radius: 50%;\n    background: #d11f2f;\n    box-shadow: 0 0 10px rgba(209,31,47,.7);\n    animation: clearSignalPulse 2.4s ease-in-out infinite;\n  }\n  @keyframes clearSignalPulse {\n    0%, 100% { opacity: .45; transform: scale(.9); }\n    50% { opacity: 1; transform: scale(1.15); }\n  }\n  @media (max-width: 700px) {\n    .clear-signal-hero { width: min(94vw, 1080px); border-radius: 16px; }\n    .clear-signal-hero img { aspect-ratio: 4 / 3; min-height: 270px; }\n    .clear-signal-hero-copy { display: block; }\n    .clear-signal-hero-meta { margin-top: 10px; text-align: left; white-space: normal; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .clear-signal-hero img, .clear-signal-hero-signal { transition: none; animation: none; }\n  }\n</style>\n'''

          if 'id="clear-signal-hero-v1"' not in text:
              head = re.search(r'</head>', text, flags=re.I)
              if not head:
                  raise SystemExit('No </head> element found; refusing to modify homepage.')
              text = text[:head.start()] + styles + text[head.start():]

          block = '''\n<!-- Clear Signal cinematic brand film still — additive homepage layer; existing content preserved. -->\n<figure class="clear-signal-hero" data-clear-signal-hero="v1" aria-label="Clear Signal — ClearGlass Inc. cinematic security brand film">\n  <img src="/assets/images/clear-signal-homepage-hero.jpg" alt="ClearGlass Inc. security architects coordinating a protected city network through transparent intelligence systems" loading="eager" decoding="async" fetchpriority="high">\n  <figcaption class="clear-signal-hero-copy">\n    <div>\n      <p class="clear-signal-hero-kicker"><span class="clear-signal-hero-signal" aria-hidden="true"></span>Clear Signal // Intelligence Layer</p>\n      <p class="clear-signal-hero-title">See clearly.<br><span>Operate securely.</span></p>\n    </div>\n    <p class="clear-signal-hero-meta">ClearGlass Inc. &nbsp;|&nbsp; Trust / Clarity / Resilience</p>\n  </figcaption>\n</figure>\n'''

          hero = re.search(r'(<section\b[^>]*class=["\'][^"\']*\bhero\b[^"\']*["\'][^>]*>)', text, flags=re.I)
          if not hero:
              hero = re.search(r'(<section\b[^>]*\bid=["\']hero["\'][^>]*>)', text, flags=re.I)
          if not hero:
              raise SystemExit('Hero section not found; refusing to modify homepage.')

          insert_at = hero.end()
          text = text[:insert_at] + block + text[insert_at:]
          path.write_text(text, encoding='utf-8', newline='\n')
          print('Clear Signal cinematic layer added. Existing homepage content was not deleted.')

      - name: Validate HTML and asset integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/images/clear-signal-homepage-hero.jpg
          grep -q 'data-clear-signal-hero="v1"' index.html
          grep -q 'clear-signal-hero-v1' index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if s.count('data-clear-signal-hero="v1"') != 1:
              raise SystemExit('Clear Signal marker must occur exactly once.')
          if '</html>' not in s.lower():
              raise SystemExit('Homepage HTML appears truncated; refusing commit.')
          print(f'index.html bytes: {p.stat().st_size}')
          print(f'Clear Signal asset bytes: {Path("assets/images/clear-signal-homepage-hero.jpg").stat().st_size}')
          PY

      - name: Commit additive homepage integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No homepage mutation required."
            exit 0
          fi
          git add index.html
          git commit -m "feat(homepage): activate Clear Signal cinematic hero"
          git push origin HEAD:main
