name: ClearGlass Agent Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/clearglass_agent_service/**'
      - '.github/workflows/clearglass-agent-service.yml'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate FastAPI service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/clearglass_agent_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/clearglass_agent_service/requirements.txt

      - name: Import application
        env:
          CLEARGLASS_AGENT_API_KEYS: ci-test-key
        run: |
          python - <<'PY'
          from services.clearglass_agent_service.main import app
          print(app.title)
          PY

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clearglass-agent-service"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f services/clearglass_agent_service/Dockerfile \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

      - name: Deployment summary
        run: |
          echo "## ClearGlass Agent Service" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Container image built and pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime deployment requires a hosting target such as Cloud Run, Render, Fly.io, Railway, ECS, or Azure Container Apps." >> "$GITHUB_STEP_SUMMARY"
