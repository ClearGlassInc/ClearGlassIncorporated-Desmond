name: ClearGlassInc COO Bot – Daily Operations

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run COO Bot Analysis (Python precision)
        id: coo_analysis
        shell: python
        run: |
          import datetime
          import json
          from pathlib import Path

          now = datetime.datetime.now(datetime.timezone.utc)
          report = {
              "generated_at_utc": now.isoformat(),
              "cadence": "weekly-monday-0900-utc",
              "organization": "ClearGlassInc Artemis",
              "focus_areas": [
                  "operations-health",
                  "automation-readiness",
                  "risk-and-reliability"
              ],
              "summary": "COO Bot executed weekly cadence and generated an operations summary.",
          }

          out = Path("coo_report.json")
          out.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("COO Bot executing weekly cadence...")
          print(json.dumps(report, indent=2))

      - name: Upload COO report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coo-daily-report
          path: coo_report.json

      - name: Post Executive Summary
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: 1
          body: |
            ✅ COO Bot Daily Report attached.

            - Organization: ClearGlassInc Artemis
            - Cadence: Weekly (Monday 09:00 UTC)
            - Artifact: `coo_report.json`
