name: Clearway Compliance Gate

on:
  pull_request:
    paths:
      - 'clearway/**'
      - 'docs/CLEARWAY_COMPLIANCE_AUDIT.md'
      - '.github/workflows/clearway-compliance-gate.yml'
      - 'services/**'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clearway-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m pytest -q clearway/test_clearway.py

      - name: Compliance gate
        run: python clearway/agent.py --input clearway/example_audit.json --policy clearway/policy.json --report-dir clearway/reports --gate

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clearway-compliance-evidence
          path: clearway/reports/
          if-no-files-found: error
