name: Clearway Compliance Gate

on:
  pull_request:
    paths:
      - 'clearway/**'
      - 'docs/CLEARWAY_COMPLIANCE_AUDIT.md'
      - '.github/workflows/clearway-compliance-gate.yml'
      - 'services/**'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clearway-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Unit tests
        run: python3 -m unittest -v clearway.test_clearway

      - name: Compliance gate
        run: python3 clearway/agent.py --input clearway/example_audit.json --policy clearway/policy.json --report-dir clearway/reports --gate

      - name: Print evidence decision
        if: always()
        run: cat clearway/reports/clearway_decision.json 2>/dev/null || true
