name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy ClearGlass to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.11.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build tooling
        run: npm run build

      - name: Test tooling
        run: npm test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=clearglassinc-site --branch=main --commit-hash=${{ github.sha }} --commit-message=${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message || 'GitHub Actions deployment' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
