name: Codex Autofix

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Run Codex autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex -a auto-edit --quiet "
          You are Codex, a careful and conservative automated developer working inside the repository.
          Your goal is to make the minimal, well-scoped changes necessary to make the repository pass its CI checks and local test suite, and to fix clear runtime errors revealed by running project checks.

          Only change files required to fix the failing tests or errors.
          Run the repo tests and linters, inspect failures, apply minimal patches, and re-run the checks.
          Commit only the necessary fixes and prepare changes for a pull request.
          "

      - name: Show git status
        run: git status --short
