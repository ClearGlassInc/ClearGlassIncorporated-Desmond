name: Commerce Daily Loop

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily — executive report + governance self-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-loop:
    name: Daily executive report + governance self-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Governance self-check (fails if any financial action is auto-executable)
        working-directory: clearglass-commerce/control-plane
        run: python -m app.daily_loop --json
      - name: Executive report
        working-directory: clearglass-commerce/control-plane
        run: |
          python -m app.daily_loop | tee "$GITHUB_STEP_SUMMARY"
