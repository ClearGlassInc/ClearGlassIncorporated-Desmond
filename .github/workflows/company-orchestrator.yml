name: ClearGlass Company Orchestrator

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-company-system:
    name: Validate Company System
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workflow audit dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate orchestrator manifest and required files
        run: python scripts/validate-site

      - name: Audit local links
        run: python scripts/check-links

      - name: Audit static assets
        run: python scripts/audit-assets

      - name: Run site reliability audit
        run: python scripts/site_reliability_audit.py

      - name: Run workflow doctor
        run: python scripts/workflow_doctor.py

      - name: Write deployment readiness summary
        if: always()
        run: |
          {
            echo "## ClearGlass Company Orchestrator"
            echo ""
            echo "Repository: ${{ github.repository }}"
            echo "Ref: ${{ github.ref }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "### Checks"
            echo "- Company orchestrator manifest"
            echo "- Required docs/scripts"
            echo "- Local links"
            echo "- Static assets"
            echo "- Site reliability"
            echo "- Workflow doctor"
            echo ""
            echo "### Deployment"
            echo "Core GitHub Pages deploy remains handled by .github/workflows/pages.yml after merge to main."
            echo ""
            echo "### Rollback"
            echo "Use docs/rollback.md and revert the merge commit if production regresses."
          } >> "$GITHUB_STEP_SUMMARY"
