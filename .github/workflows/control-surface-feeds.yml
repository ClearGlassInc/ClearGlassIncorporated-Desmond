name: Control Surface Feeds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One feed refresh at a time; never cancel a publish mid-flight.
concurrency:
  group: control-surface-feeds
  cancel-in-progress: false

jobs:
  publish-feeds:
    name: Generate & Publish Data Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit refreshed feeds
      actions: read     # read workflow runs for the feeds
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install jsonschema

      - name: Generate feeds from live sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/control_surface_feeds.py --strict

      - name: Commit refreshed feeds
        id: commit
        # Signed via the GitHub API so the commit shows as "Verified" on main;
        # falls back to a plain push if the API path fails so feeds never stall.
        uses: ./.github/actions/verified-commit
        with:
          message: "bot: refresh control-surface data feeds [skip ci]"
          branch: main
          paths: data/control-surface

  dispatch-pages-deploy:
    name: Publish to Pages
    needs: publish-feeds
    if: ${{ always() && needs.publish-feeds.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write    # dispatch pages.yml ([skip ci] commit suppresses its push trigger)
    steps:
      - name: Dispatch Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main || echo "::warning::Pages dispatch failed — next deploy will pick feeds up"
