name: ClearGlass GitHub Pages Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege: this workflow only reads the repo to validate the static
# site and upload it as an artifact. It never writes back, so contents: read
# is sufficient.
permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          echo "✓ index.html found"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearglass-site
          path: .
