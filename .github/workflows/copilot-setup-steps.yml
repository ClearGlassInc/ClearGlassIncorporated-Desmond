name: ClearGlass Copilot Setup

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege: this workflow only checks out the repo and runs a node
# build/test. It never writes to the repo, so the default token is read-only.
permissions:
  contents: read

jobs:
  copilot-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm test
