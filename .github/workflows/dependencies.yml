name: Dependencies

on:
  workflow_call:                    # Called by master-control.yml
  workflow_dispatch:                # Manual trigger
  schedule:
    - cron: '0 5 * * 1'            # Every Monday 5:00 AM UTC
  push:
    branches:
      - main
    paths:
      - 'requirements*.txt'
      - 'package*.json'
      - 'Pipfile*'

permissions:
  contents: read
  issues: write
  security-events: write

jobs:

  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Run pip-audit
        id: audit
        run: |
          pip-audit --format=json --output=audit-results.json || true
          pip-audit --format=columns || true

      - name: Check for requirements file
        id: check_req
        run: |
          if [ -f requirements.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No requirements.txt found — skipping audit."
          fi

      - name: Audit requirements.txt
        if: steps.check_req.outputs.found == 'true'
        run: |
          pip install -r requirements.txt --quiet || true
          pip-audit -r requirements.txt --format=columns || true

      - name: Report audit results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency Audit Report — ${today}`,
              body: `## ClearGlass Dependency Scan

- Audit completed on \`${today}\`
- Check Actions log for full pip-audit output
- [ ] Review any flagged vulnerabilities
- [ ] Update pinned versions if needed

*Auto-generated by Master Control — dependencies/pip-audit*`,
              labels: ['dependencies', 'security']
            });
