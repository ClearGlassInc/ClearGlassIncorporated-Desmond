name: Dependencies

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  pull_request:
    branches:
      - main
    paths:
      - 'requirements*.txt'
      - 'package*.json'
      - 'Pipfile*'
      - '.github/workflows/dependencies.yml'
  push:
    branches:
      - main
    paths:
      - 'requirements*.txt'
      - 'package*.json'
      - 'Pipfile*'
      - '.github/workflows/dependencies.yml'

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Check for requirements file
        id: check_req
        run: |
          if [ -f requirements.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No requirements.txt found — skipping audit."
          fi

      - name: Audit installed environment
        run: |
          pip-audit --format=columns || true

      - name: Audit requirements.txt
        if: steps.check_req.outputs.found == 'true'
        run: |
          pip install -r requirements.txt --quiet || true
          pip-audit -r requirements.txt --format=columns || true

      - name: Report audit results
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency Audit Report — ${today}`,
              body: `## ClearGlass Dependency Scan\n\n- Audit completed on \`${today}\`\n- Check Actions log for full pip-audit output\n- [ ] Review any flagged vulnerabilities\n- [ ] Update pinned versions if needed\n\n*Auto-generated by Master Control — dependencies/pip-audit*`,
              labels: ['dependencies', 'security']
            });
