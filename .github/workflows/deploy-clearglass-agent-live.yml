name: Deploy ClearGlass Agent Live

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "fly"
        type: choice
        options:
          - fly
      dry_run:
        description: "Validate deployment path without pushing to host"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
    paths:
      - 'services/clearglass_agent_service/**'
      - 'fly.toml'
      - '.github/workflows/deploy-clearglass-agent-live.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: clearglass-agent-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight service and deployment route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dry_run: ${{ steps.route.outputs.dry_run }}
      should_deploy: ${{ steps.route.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set deployment route
        id: route
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLEARGLASS_AGENT_API_KEYS: ${{ secrets.CLEARGLASS_AGENT_API_KEYS }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'fly' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'true' }}"
          SHOULD_DEPLOY="true"

          if [[ "$TARGET" != "fly" ]]; then
            echo "Unsupported target: $TARGET"
            exit 1
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            SHOULD_DEPLOY="false"
          fi

          if [[ -z "${FLY_API_TOKEN:-}" || -z "${CLEARGLASS_AGENT_API_KEYS:-}" ]]; then
            echo "Fly deployment secrets are missing; running preflight only."
            SHOULD_DEPLOY="false"
          fi

          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment route"
            echo "- Target: $TARGET"
            echo "- Dry run: $DRY_RUN"
            echo "- Should deploy: $SHOULD_DEPLOY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate expected files
        shell: bash
        run: |
          set -euo pipefail
          test -f fly.toml
          test -f services/clearglass_agent_service/Dockerfile
          test -f services/clearglass_agent_service/requirements.txt
          test -f services/clearglass_agent_service/main.py
          echo "Required deployment files exist."

      - name: Validate Python application import
        env:
          CLEARGLASS_AGENT_API_KEYS: preflight-test-key
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r services/clearglass_agent_service/requirements.txt
          python - <<'PY'
          from services.clearglass_agent_service.main import app
          print(f"Validated FastAPI app: {app.title}")
          PY

      - name: Validate Docker image builds
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f services/clearglass_agent_service/Dockerfile \
            -t clearglass-agent-service:preflight \
            .

  deploy_fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    timeout-minutes: 30
    environment:
      name: production-fly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl version
          flyctl auth whoami

      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if flyctl status --app clearglass-agent-service >/dev/null 2>&1; then
            echo "Fly app exists."
          else
            flyctl apps create clearglass-agent-service
          fi

      - name: Set Fly runtime secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLEARGLASS_AGENT_API_KEYS: ${{ secrets.CLEARGLASS_AGENT_API_KEYS }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets set \
            CLEARGLASS_AGENT_API_KEYS="$CLEARGLASS_AGENT_API_KEYS" \
            CLEARGLASS_ALLOWED_ORGS="ClearGlassInc" \
            CLEARGLASS_ALLOWED_ORIGINS="https://clearglassinc.github.io" \
            CLEARGLASS_AGENT_VERSION="0.1.0" \
            --app clearglass-agent-service

      - name: Deploy Fly service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy \
            --config fly.toml \
            --remote-only \
            --app clearglass-agent-service

      - name: Smoke test Fly health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 18 --retry-delay 5 --retry-all-errors \
            https://clearglass-agent-service.fly.dev/health
