name: Deploy ClearGlass Agent Live

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target: fly or render"
        required: true
        default: "fly"
        type: choice
        options:
          - fly
          - render
      dry_run:
        description: "Validate deployment path without pushing to host"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - 'services/clearglass_agent_service/**'
      - 'fly.toml'
      - 'render.yaml'
      - '.github/workflows/deploy-clearglass-agent-live.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: clearglass-agent-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight service and deployment route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_fly: ${{ steps.route.outputs.deploy_fly }}
      deploy_render: ${{ steps.route.outputs.deploy_render }}
      dry_run: ${{ steps.route.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment route
        id: route
        run: |
          TARGET="${{ github.event.inputs.target || 'fly' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [[ "$TARGET" == "fly" ]]; then
            echo "deploy_fly=true" >> "$GITHUB_OUTPUT"
            echo "deploy_render=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TARGET" == "render" ]]; then
            echo "deploy_fly=false" >> "$GITHUB_OUTPUT"
            echo "deploy_render=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported target: $TARGET"
            exit 1
          fi

          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Python application import
        env:
          CLEARGLASS_AGENT_API_KEYS: preflight-test-key
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/clearglass_agent_service/requirements.txt
          python - <<'PY'
          from services.clearglass_agent_service.main import app
          print(f"Validated: {app.title}")
          PY

      - name: Validate Docker image builds
        run: |
          docker build \
            -f services/clearglass_agent_service/Dockerfile \
            -t clearglass-agent-service:preflight \
            .

  deploy_fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy_fly == 'true'
    timeout-minutes: 25
    environment:
      name: production-fly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate required Fly secrets
        id: flysecrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLEARGLASS_AGENT_API_KEYS: ${{ secrets.CLEARGLASS_AGENT_API_KEYS }}
        run: |
          if [[ -z "$FLY_API_TOKEN" ]]; then
            echo "Missing GitHub secret: FLY_API_TOKEN" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -z "$CLEARGLASS_AGENT_API_KEYS" ]]; then
            echo "Missing GitHub secret: CLEARGLASS_AGENT_API_KEYS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Fly secrets present." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run Fly deployment
        if: needs.preflight.outputs.dry_run == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl version
          flyctl status --app clearglass-agent-service || true
          echo "Dry-run complete. No live deployment executed." >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure Fly app exists
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl status --app clearglass-agent-service >/dev/null 2>&1; then
            echo "Fly app exists."
          else
            flyctl apps create clearglass-agent-service --org personal
          fi

      - name: Set Fly runtime secrets
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLEARGLASS_AGENT_API_KEYS: ${{ secrets.CLEARGLASS_AGENT_API_KEYS }}
        run: |
          flyctl secrets set \
            CLEARGLASS_AGENT_API_KEYS="$CLEARGLASS_AGENT_API_KEYS" \
            CLEARGLASS_ALLOWED_ORGS="ClearGlassInc" \
            CLEARGLASS_ALLOWED_ORIGINS="https://clearglassinc.github.io" \
            CLEARGLASS_AGENT_VERSION="0.1.0" \
            --app clearglass-agent-service

      - name: Deploy Fly service
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config fly.toml --remote-only --app clearglass-agent-service

      - name: Smoke test Fly health endpoint
        if: needs.preflight.outputs.dry_run != 'true'
        run: |
          curl --fail --retry 12 --retry-delay 5 https://clearglass-agent-service.fly.dev/health

  deploy_render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy_render == 'true'
    timeout-minutes: 10
    environment:
      name: production-render
    steps:
      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Render deploy hook present." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run Render deployment
        if: needs.preflight.outputs.dry_run == 'true'
        run: |
          echo "Dry-run complete. No Render deploy hook called." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Render deploy hook
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deployment summary
        if: needs.preflight.outputs.dry_run != 'true'
        run: |
          echo "Render deploy hook triggered." >> "$GITHUB_STEP_SUMMARY"
