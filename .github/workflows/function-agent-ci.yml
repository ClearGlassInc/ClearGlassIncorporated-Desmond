name: Artemis Function Agent CI

on:
  pull_request:
    paths:
      - "artemis/function_agent/**"
      - "artemis/tests/test_function_agent_*.py"
      - "docs/artemis_function_agent.md"
      - "pyproject.toml"
      - ".github/workflows/function-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "artemis/function_agent/**"
      - "artemis/tests/test_function_agent_*.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Compile package
        run: python -m compileall -q artemis/function_agent

      - name: Lint package and focused tests
        run: ruff check artemis/function_agent artemis/tests/test_function_agent_*.py

      - name: Run focused test suite
        run: |
          pytest -q artemis/tests/test_function_agent_*.py \
            --cov=artemis.function_agent \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Build distribution
        run: python -m build
