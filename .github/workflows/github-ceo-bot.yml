name: GitHub CEO Bot

on:
  workflow_call:
    inputs:
      create_issue:
        description: Create a weekly issue with executive summary
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  security-events: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ceo-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect repository metrics
        id: metrics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const [repoData, issuesData, prsData, workflowsData, branchData] = await Promise.all([
              github.rest.repos.get({ owner, repo }),
              github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 }),
              github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 }),
              github.rest.actions.listRepoWorkflows({ owner, repo }),
              github.rest.repos.listBranches({ owner, repo, per_page: 100 }),
            ]);

            const issueCount = issuesData.data.filter(i => !i.pull_request).length;
            const prCount = prsData.data.length;
            const hasReadme = ['README.md', 'README.mdx', 'README.rst', 'README.txt']
              .some((p) => require('fs').existsSync(p));
            const hasDocs = require('fs').existsSync('docs');
            const workflowCount = workflowsData.data.total_count;
            const defaultBranch = repoData.data.default_branch;
            const staleBranches = branchData.data.filter(b => b.name !== defaultBranch).length;

            const summary = [
              `Repository: ${owner}/${repo}`,
              `Default branch: ${defaultBranch}`,
              `Open issues: ${issueCount}`,
              `Open PRs: ${prCount}`,
              `README present: ${hasReadme ? 'YES' : 'MISSING'}`,
              `Docs folder present: ${hasDocs ? 'YES' : 'MISSING'}`,
              `Workflow count: ${workflowCount}`,
              `Non-default branches: ${staleBranches}`,
            ].join('\n');

            core.setOutput('default_branch', defaultBranch);
            core.setOutput('issue_count', String(issueCount));
            core.setOutput('pr_count', String(prCount));
            core.setOutput('has_readme', hasReadme ? 'YES' : 'MISSING');
            core.setOutput('has_docs', hasDocs ? 'YES' : 'MISSING');
            core.setOutput('workflow_count', String(workflowCount));
            core.setOutput('stale_branches', String(staleBranches));
            core.setOutput('summary', summary);

      - name: Write run summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # Weekly GitHub CEO Bot Report

          ${{ steps.metrics.outputs.summary }}

          ## Next actions
          1. Resolve missing docs/readme if flagged.
          2. Triage stale issues and pull requests.
          3. Standardize reusable GitHub Actions workflows.
          EOF

      - name: Create weekly issue
        if: ${{ inputs.create_issue != false }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date().toISOString();
            const title = `Weekly GitHub CEO Bot Report - ${now.slice(0, 10)}`;

            const body = [
              `GitHub CEO Bot Report - ${owner}/${repo}`,
              `Generated at: ${now}`,
              '',
              '## Executive summary',
              'Automated repository health check across docs, issue posture, and automation readiness.',
              '',
              '## Repository health',
              `- Default branch: ${{ steps.metrics.outputs.default_branch }}`,
              `- Open issues: ${{ steps.metrics.outputs.issue_count }}`,
              `- Open PRs: ${{ steps.metrics.outputs.pr_count }}`,
              '',
              '## Docs & structure',
              `- README exists: ${{ steps.metrics.outputs.has_readme }}`,
              `- docs/ folder exists: ${{ steps.metrics.outputs.has_docs }}`,
              '',
              '## CI/CD & automation',
              `- Workflow count: ${{ steps.metrics.outputs.workflow_count }}`,
              `- Non-default branches: ${{ steps.metrics.outputs.stale_branches }}`,
              '',
              '## Recommended actions',
              '1. Fix missing documentation components.',
              '2. Close stale issues and PRs.',
              '3. Consolidate workflows into reusable templates.',
            ].join('\n');

            await github.rest.issues.create({ owner, repo, title, body });
