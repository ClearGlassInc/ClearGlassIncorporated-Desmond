name: High-Assurance Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Evidence + Security + Provenance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run high-assurance verifier
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 tools/high_assurance_verify.py

      - name: Publish assurance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: high-assurance-report-${{ github.run_id }}
          path: operations/security/high_assurance_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Write release decision to summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("operations/security/high_assurance_report.json").read_text())
          print("### ClearGlass High-Assurance Release Decision")
          print(f"- Decision: **{report['decision']}**")
          print(f"- Blocking findings: **{report['blocking_count']}**")
          print(f"- Total findings: **{len(report['findings'])}**")
          print(f"- Repository HEAD: `{report['repository_head']}`")
          PY
