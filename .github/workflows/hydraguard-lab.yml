name: HydraGuard Lab CI
on:
  pull_request:
    paths: ['hydraguard-lab/**']
  push:
    branches: [main]
    paths: ['hydraguard-lab/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hydraguard-lab } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hydraguard-lab/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Container build
        run: docker build -t hydraguard-lab-ci .
