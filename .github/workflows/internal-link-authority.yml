name: Internal Link Authority

on:
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap*.xml"
      - "robots.txt"
      - "nav.js"
      - "tools/internal_links.py"
      - "tools/authority_network.py"
      - "tests/test_authority_network.py"
      - "docs/**authority-network*.md"
      - "llms*.txt"
      - ".github/workflows/internal-link-authority.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap*.xml"
      - "robots.txt"
      - "nav.js"
      - "tools/internal_links.py"
      - "tools/authority_network.py"
      - "tests/test_authority_network.py"
      - "docs/**authority-network*.md"
      - "llms*.txt"
      - ".github/workflows/internal-link-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-link-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-authority-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify legacy generated blocks remain current
        run: python3 tools/internal_links.py --check

      - name: Verify self-evolving authority graph
        run: python3 tools/authority_network.py --check --report

      - name: Run focused authority-network tests
        run: python3 -m pytest -q tests/test_authority_network.py

      - name: Verify all registered sitemaps are advertised
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          robots = Path("robots.txt").read_text(encoding="utf-8")
          missing = [
              sitemap.name
              for sitemap in sorted(Path(".").glob("sitemap*.xml"))
              if f"Sitemap: https://www.clearglassinc.com/{sitemap.name}" not in robots
          ]
          if missing:
              raise SystemExit("Sitemaps missing from robots.txt: " + ", ".join(missing))
          print("robots.txt advertises every sitemap*.xml source.")
          PY
