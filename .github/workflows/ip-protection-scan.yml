name: IP Protection Scan

# Runs on every push to main and every PR targeting main, plus weekly.
# Purpose: detect IP leakage vectors before they reach production.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly Monday 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # for SARIF upload
  issues: write            # for filing leakage alerts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Copyright header check ──────────────────────────────────────────────
  copyright-headers:
    name: Copyright header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python files carry copyright header
        run: |
          missing=()
          while IFS= read -r -d '' f; do
            if ! grep -qE "Copyright \(c\).*ClearGlass" "$f"; then
              missing+=("$f")
            fi
          done < <(find . -name "*.py" -not -path './.git/*' -print0)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing copyright headers in the following files:"
            for f in "${missing[@]}"; do echo "  $f"; done
            exit 1
          fi
          echo "All Python files carry copyright headers."

  # ── 2. Secret / credential leakage scan ───────────────────────────────────
  secret-scan:
    name: Secret leakage scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for comprehensive scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Prompt / blueprint exposure audit ──────────────────────────────────
  prompt-exposure-audit:
    name: Prompt & blueprint exposure audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect sensitive patterns in public paths
        id: audit
        run: |
          findings=""

          # Patterns that should NEVER appear in public files
          declare -A patterns=(
            ["hardcoded-bearer"]="Bearer [A-Za-z0-9_\-\.]{20,}"
            ["hardcoded-aws-key"]="AKIA[0-9A-Z]{16}"
            ["hardcoded-openai-key"]="sk-[A-Za-z0-9]{32,}"
            ["hardcoded-anthropic-key"]="sk-ant-[A-Za-z0-9\-_]{32,}"
            ["hardcoded-gh-token"]="gh[pousr]_[A-Za-z0-9]{36,}"
            ["private-key-block"]="-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY"
          )

          for label in "${!patterns[@]}"; do
            pattern="${patterns[$label]}"
            matches=$(grep -rEn "$pattern" \
              --include="*.py" --include="*.js" --include="*.ts" \
              --include="*.html" --include="*.md" --include="*.yml" \
              --include="*.yaml" --include="*.json" \
              --exclude-dir=".git" --exclude-dir="node_modules" \
              . 2>/dev/null || true)
            if [ -n "$matches" ]; then
              findings+="### $label\n$matches\n\n"
              echo "::error::Potential credential exposure — pattern: $label"
              echo "$matches"
            fi
          done

          if [ -n "$findings" ]; then
            echo "FINDINGS<<EOF" >> "$GITHUB_OUTPUT"
            printf '%b' "$findings" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "No sensitive patterns detected."

      - name: Open IP-leakage issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[IP-ALERT] Credential/secret exposure detected — ${now}`,
              body: [
                '## Automated IP Protection Alert',
                '',
                'The IP Protection Scan workflow detected potential credential or secret exposure.',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### Immediate actions required',
                '1. Review the workflow run logs for the affected files.',
                '2. Rotate any exposed credentials immediately.',
                '3. Use `git filter-repo` or BFG Repo Cleaner to purge from git history.',
                '4. Contact security@clearglassinc.com.',
                '',
                '> This issue was auto-generated by the IP Protection Scan workflow.',
              ].join('\n'),
              labels: ['security', 'ip-protection'],
            });

  # ── 4. Supply-chain: pinned Actions audit ──────────────────────────────────
  actions-pin-audit:
    name: Actions SHA-pin audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect unpinned third-party Actions
        run: |
          unpinned=()
          while IFS= read -r -d '' wf; do
            # Find 'uses:' lines referencing actions NOT pinned to a full SHA
            while IFS= read -r line; do
              # Match: uses: owner/repo@ref  where ref is NOT a 40-char hex SHA
              if echo "$line" | grep -qE '^\s+uses:\s+[^.][^/]+/[^@]+@[^a-f0-9]{40}'; then
                # Also allow version tags — only flag mutable floating tags
                ref=$(echo "$line" | sed -E 's/.*@//')
                # Flag if ref looks like a branch name (main, master, v1, etc.)
                if echo "$ref" | grep -qE '^(main|master|HEAD|v[0-9]+)$'; then
                  unpinned+=("$wf: $line")
                fi
              fi
            done < "$wf"
          done < <(find .github/workflows \(-name "*.yml" -o -name "*.yaml" \) -print0 2>/dev/null)

          if [ "${#unpinned[@]}" -gt 0 ]; then
            echo "::warning::Workflows using mutable branch/tag refs (consider pinning to SHA):"
            for entry in "${unpinned[@]}"; do echo "  $entry"; done
          else
            echo "No mutable branch refs found in workflow Actions."
          fi

  # ── 5. License file presence check ────────────────────────────────────────
  license-check:
    name: LICENSE file presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure LICENSE exists and names ClearGlass Inc.
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::No LICENSE file found. All repositories must have an explicit licence."
            exit 1
          fi
          if ! grep -q "ClearGlass Inc." LICENSE; then
            echo "::error::LICENSE file does not mention ClearGlass Inc. — verify it is the correct file."
            exit 1
          fi
          echo "LICENSE file present and names ClearGlass Inc."
