name: ClearGlass Mail Production Validation

on:
  pull_request:
    paths:
      - "mail/**"
      - ".github/workflows/mail-production-validation.yml"
  push:
    branches:
      - main
      - "feat/clearglass-mail-**"
    paths:
      - "mail/**"
      - ".github/workflows/mail-production-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearglass-mail-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-validation:
    name: Mail parser validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8.2,<9"

      - name: Compile parser sources
        run: python -m compileall -q mail/parser

      - name: Run mail parser tests
        run: python -m pytest mail/parser/test_clearglass_incoming_parser.py -q

      - name: Verify no mail secrets are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z mail | grep -zEi '(^|/)(\.env|.*(secret|credential|private[-_]?key).*)$' >/dev/null; then
            echo "::error::Potential mail secret/credential file is tracked under mail/."
            exit 1
          fi
          echo "No filename-level mail secret indicators detected."
