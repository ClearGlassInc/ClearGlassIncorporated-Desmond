name: Marketing Content Engine

# ── Control plane for the ClearGlass daily content pipeline ──────────────────
# Stage 1 · generate  — select pillar, produce platform-specific copy
# Stage 2 · validate  — quality gate: limits, brand voice, weak-phrase check
# Stage 3 · route     — create labeled GitHub issue for review/scheduling
# Stage 4 · commit    — persist outputs and metrics log
# Stage 5 · summary   — write step summary; emit failure notice on bad runs
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      pillar:
        description: "Force content pillar (brand | artemis | guardian | founder)"
        required: false
        type: string
      dry_run:
        description: "Generate and validate without creating an issue or committing"
        required: false
        default: "false"
        type: string
  schedule:
    # 09:00 UTC daily — primary content generation window
    - cron: '0 9 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Stage 1: Generate ─────────────────────────────────────────────────────────
jobs:
  generate:
    name: "1 · Generate content"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pillar: ${{ steps.engine.outputs.pillar }}
      content_hash: ${{ steps.engine.outputs.content_hash }}
      iso_week: ${{ steps.engine.outputs.iso_week }}
      variant_index: ${{ steps.engine.outputs.variant_index }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi

      - name: Ensure output directory tree
        run: |
          mkdir -p \
            marketing/output/archive \
            marketing/output/platforms/linkedin \
            marketing/output/platforms/threads \
            marketing/output/platforms/x \
            marketing/output/platforms/email \
            marketing/output/platforms/website \
            marketing/output/metrics \
            marketing/output/reports

      - name: Run content engine
        id: engine
        env:
          FORCE_PILLAR: ${{ inputs.pillar || '' }}
        run: python bots/content_engine.py

  # ── Stage 2: Validate ───────────────────────────────────────────────────────
  validate:
    name: "2 · Validate quality"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate
    outputs:
      passed: ${{ steps.validator.outputs.passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi

      - name: Download generated outputs
        uses: actions/download-artifact@v4
        with:
          name: content-bundle
          path: marketing/output
        continue-on-error: true

      # Re-generate locally if artifact download missed (e.g. first run)
      - name: Regenerate if bundle missing
        env:
          FORCE_PILLAR: ${{ needs.generate.outputs.pillar }}
        run: |
          if [[ ! -f marketing/output/latest.json ]]; then
            mkdir -p marketing/output/archive marketing/output/metrics \
              marketing/output/platforms/linkedin marketing/output/platforms/threads \
              marketing/output/platforms/x marketing/output/platforms/email \
              marketing/output/platforms/website marketing/output/reports
            python bots/content_engine.py
          fi

      - name: Run content validator
        id: validator
        run: python bots/content_validator.py

      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: validated-bundle
          path: |
            marketing/output/latest.json
            marketing/output/latest.md
            marketing/output/platforms/
            marketing/output/validation_report.json
          retention-days: 7

  # ── Stage 3: Route — create GitHub issue ────────────────────────────────────
  route:
    name: "3 · Route to issue"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [generate, validate]
    if: >
      needs.validate.outputs.passed == 'true' &&
      inputs.dry_run != 'true'
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create_label() {
            local name="$1" color="$2" desc="$3"
            gh label create "$name" --color "$color" --description "$desc" 2>/dev/null || true
          }
          # Status stages
          create_label "status:idea"       "C5DEF5" "Content idea, not yet drafted"
          create_label "status:draft"      "FEF2C0" "Draft in progress"
          create_label "status:review"     "F9A825" "Awaiting editorial review"
          create_label "status:scheduled"  "0052CC" "Approved and scheduled for publish"
          create_label "status:published"  "0E8A16" "Published to all platforms"
          create_label "status:stale"      "E4E669" "No activity for 7+ days"
          # Pillar labels
          create_label "pillar:brand"      "BFD4F2" "Brand and authority pillar"
          create_label "pillar:artemis"    "D4C5F9" "Artemis platform pillar"
          create_label "pillar:guardian"   "C2E0C6" "Guardian platform pillar"
          create_label "pillar:founder"    "F9D0C4" "Founder thought leadership"
          # Platform labels
          create_label "platform:linkedin" "0A66C2" "LinkedIn post"
          create_label "platform:threads"  "000000" "Threads post"
          create_label "platform:x"        "1DA1F2" "X / Twitter post"
          create_label "platform:email"    "D93025" "Email newsletter"
          create_label "platform:website"  "34A853" "Website copy update"
          # Content type
          create_label "content:multi-platform" "FBCA04" "Multi-platform content bundle"
          create_label "type:report"       "BFD4F2" "Automated report"
          # Urgency
          create_label "urgency:high"      "E11D48" "High-urgency item"
          create_label "urgency:normal"    "E2E8F0" "Normal cadence"

      - name: Download validated bundle
        uses: actions/download-artifact@v4
        with:
          name: validated-bundle
          path: marketing/output
        continue-on-error: true

      - name: Rebuild bundle if missing
        env:
          FORCE_PILLAR: ${{ needs.generate.outputs.pillar }}
        run: |
          if [[ ! -f marketing/output/latest.md ]]; then
            mkdir -p marketing/output/archive marketing/output/metrics \
              marketing/output/platforms/linkedin marketing/output/platforms/threads \
              marketing/output/platforms/x marketing/output/platforms/email \
              marketing/output/platforms/website marketing/output/reports
            python bots/content_engine.py
          fi

      - name: Create content issue
        id: create_issue
        env:
          GH_TOKEN: ${{ github.token }}
          PILLAR: ${{ needs.generate.outputs.pillar }}
          HASH: ${{ needs.generate.outputs.content_hash }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          WEEK=$(date -u +W%V)
          TITLE="Content: ${PILLAR^} pillar · ${DATE} · ${HASH}"
          BODY=$(cat marketing/output/latest.md)

          NUMBER=$(gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "status:draft,pillar:${PILLAR},content:multi-platform,urgency:normal" \
            2>&1)

          # Extract issue number from the URL returned by gh
          ISSUE_NUM=$(echo "$NUMBER" | grep -oP '(?<=/issues/)\d+' || echo "0")
          echo "issue_number=${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
          echo "Created issue #${ISSUE_NUM}: $TITLE"

  # ── Stage 4: Commit outputs ──────────────────────────────────────────────────
  commit:
    name: "4 · Commit outputs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [generate, validate]
    if: >
      always() &&
      needs.validate.outputs.passed == 'true' &&
      inputs.dry_run != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate outputs for commit
        env:
          FORCE_PILLAR: ${{ needs.generate.outputs.pillar }}
        run: |
          mkdir -p \
            marketing/output/archive \
            marketing/output/platforms/linkedin \
            marketing/output/platforms/threads \
            marketing/output/platforms/x \
            marketing/output/platforms/email \
            marketing/output/platforms/website \
            marketing/output/metrics \
            marketing/output/reports
          python bots/content_engine.py

      - name: Commit generated content
        run: |
          if git status --porcelain -- marketing/output | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marketing/output
            git commit -m "Content engine: ${{ needs.generate.outputs.pillar }} pillar · ${{ needs.generate.outputs.content_hash }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No output changes to commit."
          fi

  # ── Stage 5: Summary ─────────────────────────────────────────────────────────
  summary:
    name: "5 · Run summary"
    runs-on: ubuntu-latest
    needs: [generate, validate, route, commit]
    if: always()

    steps:
      - name: Write job summary
        env:
          PILLAR: ${{ needs.generate.outputs.pillar }}
          HASH: ${{ needs.generate.outputs.content_hash }}
          WEEK: ${{ needs.generate.outputs.iso_week }}
          VALIDATION: ${{ needs.validate.outputs.passed }}
          ISSUE: ${{ needs.route.outputs.issue_number }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          ROUTE_RESULT: ${{ needs.route.result }}
          COMMIT_RESULT: ${{ needs.commit.result }}
        run: |
          echo "## ClearGlass Content Engine · Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pillar | \`${PILLAR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Content hash | \`${HASH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ISO week | ${WEEK} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | ${VALIDATION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Issue # | ${ISSUE:-skipped} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Generate | ${GENERATE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate | ${VALIDATE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Route | ${ROUTE_RESULT:-skipped} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${COMMIT_RESULT:-skipped} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Open triage issue on validation failure
        if: needs.validate.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PILLAR: ${{ needs.generate.outputs.pillar }}
          HASH: ${{ needs.generate.outputs.content_hash }}
        run: |
          gh issue create \
            --title "⚠ Content validation failed: ${PILLAR} pillar · ${HASH}" \
            --body "The content engine run on $(date -u +%Y-%m-%d) failed validation for pillar **${PILLAR}** (hash \`${HASH}\`).

          **Next steps:**
          1. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the validator output.
          2. Check \`marketing/output/validation_report.json\` for specific failure reasons.
          3. Re-run the workflow with \`dry_run: true\` to verify the fix." \
            --label "status:review,urgency:high" \
            2>/dev/null || true
