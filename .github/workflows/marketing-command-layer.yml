name: ClearGlassInc Marketing Command Layer

on:
  schedule:
    - cron: '20 12 * * *' # Daily mission cycle
    - cron: '30 12 * * 1' # Weekly recap Monday UTC
  workflow_dispatch:
    inputs:
      force_theme:
        description: 'Optional brand pillar override'
        required: false
        type: string
      dry_run:
        description: 'Run pipeline without publish-stage transitions'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: marketing-command-layer-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  STAGE_FLOW: idea,draft,review,scheduled,published

jobs:
  bootstrap-control-plane:
    name: Bootstrap Control Plane
    runs-on: ubuntu-latest
    outputs:
      run_mode: ${{ steps.mode.outputs.run_mode }}
      is_weekly: ${{ steps.mode.outputs.is_weekly }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set execution mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 12 * * 1" ]]; then
            echo "is_weekly=true" >> "$GITHUB_OUTPUT"
            echo "run_mode=weekly-recap" >> "$GITHUB_OUTPUT"
          else
            echo "is_weekly=false" >> "$GITHUB_OUTPUT"
            echo "run_mode=daily-content" >> "$GITHUB_OUTPUT"
          fi

  generate-theme-and-content:
    name: Generate Theme + Channel Content
    needs: bootstrap-control-plane
    if: needs.bootstrap-control-plane.outputs.run_mode == 'daily-content'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          [[ -f requirements.txt ]] && pip install -r requirements.txt || true
      - name: Create daily authority theme
        run: |
          python scripts/marketing_command_layer.py theme \
            --brand "ClearGlassInc" \
            --pillars "cybersecurity,ai infrastructure,digital authority" \
            --force-theme "${{ github.event.inputs.force_theme || '' }}"
      - name: Render platform variants
        run: |
          python scripts/marketing_command_layer.py render \
            --platforms "linkedin,threads,x,email,website"
      - name: Validate brand quality gates
        run: |
          python scripts/marketing_command_layer.py validate \
            --reject-generic \
            --reject-repetition \
            --reject-vague \
            --enforce-tone "executive,technical,premium"

  route-work-items:
    name: Route Work Through Stages
    needs: generate-theme-and-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create/update issue cards
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Marketing Content: ${{ github.run_id }}"
          content-filepath: marketing/output/latest.md
          labels: "content,stage:idea,platform:multi,campaign:daily"
      - name: Apply dynamic label policy
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Use project automation to move stage labels: idea -> draft -> review -> scheduled -> published.')

  weekly-recap-and-metrics:
    name: Weekly Recap + Metrics Ledger
    needs: bootstrap-control-plane
    if: needs.bootstrap-control-plane.outputs.is_weekly == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build weekly campaign summary
        run: |
          python scripts/marketing_command_layer.py recap --window weekly
      - name: Persist campaign metrics
        run: |
          python scripts/marketing_command_layer.py metrics --append

  hygiene-triage-cleanup:
    name: Hygiene, Triage, and Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Stale issue sweep
        uses: actions/stale@v9
        with:
          stale-issue-message: "Closing stale marketing work item after inactivity. Reopen with updated campaign intent."
          stale-pr-message: "Closing stale PR after inactivity. Reopen with updated marketing rationale."
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: stale
      - name: Notify triage channel
        uses: actions/github-script@v7
        with:
          script: |
            core.notice('Marketing cleanup completed. Review stale-labeled items for escalation.')

  persist-artifacts:
    name: Persist Outputs + Failure Report
    needs:
      - generate-theme-and-content
      - route-work-items
      - weekly-recap-and-metrics
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketing-command-layer-${{ github.run_id }}
          path: |
            marketing/output/
            marketing/reports/
      - name: Commit generated artifacts
        run: |
          if [[ -n "$(git status --porcelain -- marketing/output marketing/reports)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marketing/output marketing/reports
            git commit -m "Marketing command layer: refresh outputs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Halt if quality gates failed
        if: failure()
        run: |
          echo "Pipeline stopped: content quality or workflow safety checks failed."
          exit 1
