    uses: ClearGlassInc/ClearGlassInc.github.io/.github/workflows/marketing.yml@main
    secrets: inherit

  operations:
    uses: ClearGlassInc/ClearGlassInc.github.io/.github/workflows/operations.yml@main
    secrets: inherit

  self_hosted:
    uses: ClearGlassInc/ClearGlassInc.github.io/.github/workflows/self_hosted.yml@main
    secrets: inherit

  pages:
