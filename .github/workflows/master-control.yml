name: Master Control
# run-trigger: 2026-05-22T06:31Z

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/master-control.yml"
      - ".github/workflows/01-ci.yml"
      - ".github/workflows/03-dependency-scan.yml"
      - ".github/workflows/04-ip-protection-scan.yml"
      - ".github/workflows/05-pages-deploy.yml"
      - ".github/workflows/06-self-hosted-deploy.yml"
      - ".github/workflows/07-marketing-engine.yml"
      - ".github/workflows/08-operations-finance-bot.yml"
      - ".github/workflows/09-daily-ops-summary.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "tests/**"
      - "bots/**"
      - "artemis/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/master-control.yml"
      - ".github/workflows/01-ci.yml"
      - ".github/workflows/03-dependency-scan.yml"
      - ".github/workflows/04-ip-protection-scan.yml"
      - ".github/workflows/05-pages-deploy.yml"
      - ".github/workflows/06-self-hosted-deploy.yml"
      - ".github/workflows/07-marketing-engine.yml"
      - ".github/workflows/08-operations-finance-bot.yml"
      - ".github/workflows/09-daily-ops-summary.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "tests/**"
      - "bots/**"
      - "artemis/**"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: master-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control-plane validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm master control has runnable jobs
        run: |
          echo "Master Control started on ${GITHUB_REF}."
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Run ID: ${GITHUB_RUN_ID}"

  ci:
    name: CI validation
    needs: control-plane
    uses: ./.github/workflows/01-ci.yml
    permissions:
      contents: read
    secrets: inherit

  daily-summary:
    name: Daily operations summary
    needs: ci
    uses: ./.github/workflows/09-daily-ops-summary.yml
    permissions:
      contents: read
    secrets: inherit

  dependencies:
    name: Dependency scan
    needs: ci
    uses: ./.github/workflows/03-dependency-scan.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  ip-scan:
    name: IP protection scan
    needs: ci
    uses: ./.github/workflows/04-ip-protection-scan.yml
    permissions:
      contents: read
    secrets: inherit

  marketing:
    name: Marketing engine
    needs: ci
    uses: ./.github/workflows/07-marketing-engine.yml
    permissions:
      contents: read
    secrets: inherit

  operations:
    name: Operations finance bot
    needs: ci
    uses: ./.github/workflows/08-operations-finance-bot.yml
    permissions:
      contents: read
    secrets: inherit

  self-hosted:
    name: Self-hosted deploy check
    needs: ci
    uses: ./.github/workflows/06-self-hosted-deploy.yml
    permissions:
      contents: read
    secrets: inherit

  pages:
    name: GitHub Pages deploy
    needs:
      - ci
      - dependencies
      - ip-scan
    uses: ./.github/workflows/05-pages-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
