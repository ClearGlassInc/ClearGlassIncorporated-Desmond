name: Minerals Platform Maintenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/minerals-platform-maintenance.yml
  pull_request:
    branches: [main]
    paths:
      - minerals-platform.html
      - minerals-platform.css
      - minerals-platform.js
      - data/minerals/platform/**
      - scripts/wire_minerals_platform.py
      - tests/test_minerals_platform.py

permissions:
  contents: write

concurrency:
  group: minerals-platform-maintenance
  cancel-in-progress: false

jobs:
  wire-feature-branch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout minerals feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feature/minerals-intelligence-platform-20260810
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Wire platform into site registries
        run: python3 scripts/wire_minerals_platform.py

      - name: Run minerals platform regression suite
        run: python3 -m pytest tests/test_minerals_platform.py tests/test_minerals_pipeline.py -q

      - name: Commit validated wiring to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Feature branch already wired." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "ClearGlass Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json nav.js sitemap.xml tools/build_pages.py minerals.html store.html tools/internal_links.py
          git commit -m "feat(minerals): wire intelligence platform into product surfaces"
          git push origin HEAD:feature/minerals-intelligence-platform-20260810
          echo "Validated product wiring pushed to feature branch." >> "$GITHUB_STEP_SUMMARY"
