name: Minerals Platform Wiring

on:
  workflow_dispatch:
  push:
    branches:
      - feature/minerals-intelligence-platform-20260810
    paths:
      - .github/workflows/minerals-platform-wire.yml

permissions:
  contents: write

concurrency:
  group: minerals-platform-wire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Wire product, navigation, sitemap and Pages allowlist
        run: python3 scripts/wire_minerals_platform.py

      - name: Validate platform regression tests
        run: python3 -m pytest tests/test_minerals_platform.py -q

      - name: Validate minerals data pipeline
        run: python3 -m pytest tests/test_minerals_pipeline.py -q

      - name: Compile wiring script
        run: python3 -m py_compile scripts/wire_minerals_platform.py

      - name: Commit deterministic wiring changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No wiring changes required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "ClearGlass Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json nav.js sitemap.xml tools/build_pages.py minerals.html store.html tools/internal_links.py
          git commit -m "feat(minerals): wire intelligence platform into product surfaces"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Minerals platform product wiring committed to ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
