name: Minerals Search Assets Sync

on:
  push:
    branches:
      - fix/minerals-production-hardening-20260809
    paths:
      - minerals.html
      - .github/workflows/minerals-search-assets-sync.yml

permissions:
  contents: write

concurrency:
  group: minerals-search-assets-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate canonical search assets
        run: python3 tools/generate_search_assets.py

      - name: Commit generated discovery assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- sitemap.xml feed.xml data/seo/page-intents.json; then
            echo "No generated search-asset changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml data/seo/page-intents.json
          git commit -m "chore(minerals): refresh generated search assets [skip ci]"
          git push
