name: NEXUS Gateway CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/nexus-gateway/**'
      - '.github/workflows/nexus-gateway-ci.yml'
  pull_request:
    paths:
      - 'projects/nexus-gateway/**'
      - '.github/workflows/nexus-gateway-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexus-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nexus-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/nexus-gateway/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
