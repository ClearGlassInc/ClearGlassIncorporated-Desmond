name: NEXUS Gateway CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/nexus-gateway/**'
      - '.github/workflows/nexus-gateway-ci.yml'
  pull_request:
    paths:
      - 'projects/nexus-gateway/**'
      - '.github/workflows/nexus-gateway-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexus-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/nexus-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/nexus-gateway/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
