name: Operations Finance Bot

on:
  workflow_dispatch:
    inputs:
      product_type:
        description: "Product or service type"
        required: false
        type: string
      units_sold_per_month:
        description: "Units sold each month"
        required: false
        type: string
      target_profit_margin:
        description: "Target margin decimal (e.g., 0.35)"
        required: false
        type: string
  schedule:
    - cron: '20 14 * * 1'

permissions:
  contents: write

jobs:
  operations-finance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure output path exists
        run: mkdir -p operations/output operations/output/archive

      - name: Run operations finance bot
        env:
          PRODUCT_TYPE: ${{ github.event.inputs.product_type || '' }}
          UNITS_SOLD_PER_MONTH: ${{ github.event.inputs.units_sold_per_month || '' }}
          TARGET_PROFIT_MARGIN: ${{ github.event.inputs.target_profit_margin || '' }}
        run: python bots/operations_finance_bot.py

      - name: Commit generated operations output
        run: |
          if [[ -n "$(git status --porcelain -- operations/output)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add operations/output
            git commit -m "Operations bot: update generated finance model"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No operations output changes to commit."
          fi
