name: Operations Finance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  ops-finance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run operations finance report
        id: ops_report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from datetime import datetime

          today = datetime.utcnow()
          week = today.strftime('%Y-W%U')

          report = f"""
          == ClearGlass Operations Finance Report ==
          Generated : {today.strftime('%Y-%m-%d %H:%M UTC')}
          Period    : Week {week}

          Checklist:
          [ ] Review outstanding invoices
          [ ] Confirm contractor hours logged
          [ ] Update ClearGlass runway projection
          [ ] Verify GitHub Actions usage spend
          [ ] Reconcile crypto wallet activity

          Status: Automated report complete.
          """

          print(report)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('status<<EOF\n')
              f.write('ops-finance complete\n')
              f.write('EOF\n')
          EOF

      - name: Create ops summary issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ops Finance Report — ${today}`,
              body: `## ClearGlass Weekly Operations\n\n- [ ] Invoice review\n- [ ] Contractor hours\n- [ ] Runway projection update\n- [ ] Actions spend check\n- [ ] Crypto reconciliation\n\n*Auto-generated by Master Control*`,
              labels: ['operations', 'finance']
            });
