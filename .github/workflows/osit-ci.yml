name: OSIT CI

on:
  pull_request:
    paths:
      - "osit/**"
      - ".github/workflows/osit-ci.yml"
  push:
    branches:
      - main
    paths:
      - "osit/**"
      - ".github/workflows/osit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: osit
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: osit/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests --output-format=github
      - name: Unit and export tests
        run: pytest --cov=osit --cov-report=term-missing
