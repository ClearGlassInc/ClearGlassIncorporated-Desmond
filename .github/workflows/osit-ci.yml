name: OSIT CI

on:
  pull_request:
    paths:
      - "osit/**"
      - ".github/workflows/osit-ci.yml"
  push:
    branches:
      - main
    paths:
      - "osit/**"
      - ".github/workflows/osit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: osit
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: osit/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests --output-format=github
      - name: Unit and export tests
        run: pytest --cov=osit --cov-report=term-missing
