name: ClearGlass GitHub Pages Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege: this workflow only reads the repo to validate the static
# site and upload it as an artifact. It never writes back, so contents: read
# is sufficient.
permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify required files
        run: |
          python3 scripts/verify_site.py
          python3 tools/build_pages.py dist
          test -s dist/index.html
          test -f dist/.nojekyll
          test -f dist/CNAME
          echo "✓ sanitized Pages artifact is ready"

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearglass-site
          path: dist
          if-no-files-found: error
          retention-days: 7
