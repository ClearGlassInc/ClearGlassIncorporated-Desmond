name: ClearGlass GitHub Pages Check

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.css"
      - "*.gif"
      - "*.ico"
      - "*.js"
      - "*.jpeg"
      - "*.jpg"
      - "*.json"
      - "*.mp4"
      - "*.pdf"
      - "*.png"
      - "*.svg"
      - "*.xml"
      - "*.txt"
      - "*.webm"
      - "*.webmanifest"
      - "*.webp"
      - ".nojekyll"
      - ".well-known/**"
      - "assets/**"
      - "apps/command-center/**"
      - "artemis-fawl/**"
      - "blog/**"
      - "checkout/**"
      - "content/**"
      - "data/control-surface/**"
      - "data/minerals/**"
      - "data/Ontario-osint/**"
      - "data/platform/registry.json"
      - "data/seo/**"
      - "data/store/catalog.json"
      - "data/xenolith/lattice.json"
      - "feeds/**"
      - "four_d_dominance/**"
      - "investors/**"
      - "legal/**"
      - "offers/**"
      - "opal/**"
      - "provenance/**"
      - "security/**"
      - "vendor/**"
      - "scripts/verify_site.py"
      - "tools/build_pages.py"
      - "SECURITY.md"
      - ".github/workflows/pages-check.yml"
  workflow_dispatch:

# Least-privilege: this workflow only reads the repo to validate the static
# site and upload it as an artifact. It never writes back, so contents: read
# is sufficient.
permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build sanitized production artifact
        run: |
          set -euo pipefail
          python3 tools/build_pages.py dist
          test -s dist/index.html
          test -f dist/.nojekyll
          test -f dist/CNAME
          echo "✓ sanitized Pages artifact built"

      - name: Verify the exact production artifact
        run: |
          set -euo pipefail
          mkdir -p operations/reports
          python3 scripts/verify_site.py \
            --root dist \
            --report "$GITHUB_WORKSPACE/operations/reports/pages-integrity.json"
          echo "✓ production artifact integrity verified"

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ClearGlass GitHub Pages Check"
            echo ""
            echo "- Validation scope: exact sanitized \`dist\` artifact"
            echo "- Internal/non-published repository trees: excluded by the production builder"
            if [[ -f operations/reports/pages-integrity.json ]]; then
              echo "- Integrity report: generated"
            else
              echo "- Integrity report: unavailable because build failed before validation"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integrity diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-integrity-report
          path: operations/reports/pages-integrity.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload site artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearglass-site
          path: dist
          if-no-files-found: error
          retention-days: 7
