name: Deploy GitHub Pages

# Authoritative GitHub Pages deployment workflow.
# Repo Pages source MUST be set to "GitHub Actions" (Settings → Pages) so the
# legacy "pages-build-deployment" classic workflow does NOT also run.
on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.xml"
      - "**/*.txt"
      - "assets/**"
      - "images/**"
      - "scripts/**"
      - "_config.yml"
      - "_config.yaml"
      - ".github/workflows/pages-deploy.yml"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "scripts/**"
      - "bots/**"
      - "tests/**"
      - "investors/**"
      - "marketing/**"
      - "operations/**"
      - "prompts/**"
      - "infra/**"
      - "runner/**"
      - ".github/**"
      - ".gitignore"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'scripts' \
            --exclude 'bots' \
            --exclude 'tests' \
            --exclude 'investors' \
            --exclude 'marketing' \
            --exclude 'operations' \
            --exclude 'prompts' \
            --exclude 'infra' \
            --exclude 'runner' \
            --exclude '_site' \
            --exclude 'node_modules' \
            ./ _site/
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
