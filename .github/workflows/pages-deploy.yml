name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.xml"
      - "**/*.txt"
      - "assets/**"
      - "images/**"
      - "scripts/**"
      - "_config.yml"
      - "_config.yaml"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -av --delete             --exclude '.git'             --exclude '.github'             --exclude 'docs'             --exclude 'scripts'             --exclude 'bots'             --exclude 'tests'             --exclude 'investors'             --exclude 'marketing'             --exclude 'operations'             --exclude 'prompts'             ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
