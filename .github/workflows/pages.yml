name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          rm -rf dist
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build
          elif [ -d build ]; then
            cp -a build dist
          elif [ -d public ]; then
            cp -a public dist
          else
            mkdir -p dist
            rsync -a ./ dist/ \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude dist/
          fi
          touch dist/.nojekyll
      - name: Fix permissions
        run: chmod -R +rX dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
