name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes to the github-pages environment so overlapping runs
# can't race each other's artifacts. Never cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # Force the Pages publishing source to "GitHub Actions" (build_type:
      # workflow). configure-pages alone has not reliably persisted this, so
      # the legacy branch-based "pages-build-deployment" pipeline keeps being
      # triggered and fails its deploy step with
      #   "No artifacts named github-pages were found for this workflow run"
      # (under the workflow build type its build job produces no artifact).
      # This explicit PUT is idempotent and non-fatal: once the source is
      # already GitHub Actions it is a harmless no-op, and a permissions
      # failure never blocks the real deploy below.
      - name: Pin Pages source to GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}') || true
          echo "Set Pages build_type=workflow -> HTTP ${code}"
          cat /tmp/pages.json 2>/dev/null || true
      # enablement: true ensures Pages is enabled and exposes build outputs.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5

