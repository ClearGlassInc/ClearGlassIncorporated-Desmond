name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist

          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build
          elif [ -d build ]; then
            cp -a build dist
          elif [ -d public ]; then
            cp -a public dist
          else
            mkdir -p dist
            rsync -a ./ dist/ \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude dist/
          fi

          if [ ! -s dist/index.html ]; then
            echo "::error file=dist/index.html::GitHub Pages artifact is missing a non-empty index.html"
            exit 1
          fi

          touch dist/.nojekyll
          chmod -R +rX dist

          echo "Pages artifact validated:"
          du -sh dist
          find dist -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment URL
        run: echo "Published ${{ steps.deployment.outputs.page_url }}"
