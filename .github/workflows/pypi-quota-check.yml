name: PyPI Quota Check

on:
  pull_request:
    paths:
      - "clearglassinc_sdk/**"
      - "scripts/check_pypi_quota.py"
      - "tests/test_check_pypi_quota.py"
      - ".github/workflows/pypi-quota-check.yml"
  push:
    branches: [main]
    paths:
      - "clearglassinc_sdk/**"
      - "scripts/check_pypi_quota.py"
      - "tests/test_check_pypi_quota.py"
      - ".github/workflows/pypi-quota-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-quota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install isolated build tooling
        run: python -m pip install --disable-pip-version-check "build==1.3.0"

      - name: Build SDK distributions
        run: python -m build --outdir "$RUNNER_TEMP/dist" clearglassinc_sdk

      - name: Check current and candidate quota usage
        run: >-
          python scripts/check_pypi_quota.py
          --package clearglassinc-sdk
          --dist-dir "$RUNNER_TEMP/dist"
