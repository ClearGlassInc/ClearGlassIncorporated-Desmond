name: Release Supply Chain

# Reusable cryptographic supply-chain pipeline (SLSA L3). Build -> SBOM ->
# keyless signature (Sigstore, no long-lived keys) -> build-provenance
# attestation. Call from a tag-triggered caller workflow in any service repo:
#
#   jobs:
#     release:
#       uses: ClearGlassInc/.github/.github/workflows/release-supply-chain.yml@<sha>
#       with:
#         image: ghcr.io/clearglassinc/artemis
#       permissions:
#         contents: read
#         id-token: write
#         packages: write
#         attestations: write

on:
  workflow_call:
    inputs:
      image:
        description: "Fully-qualified image name (no tag)."
        required: true
        type: string
      context:
        description: "Docker build context."
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for keyless signing + provenance
      packages: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (by digest)
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcd730101868d # v6.9.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ inputs.image }}:${{ github.ref_name }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Keyless sign
        run: cosign sign --yes "${{ inputs.image }}@${{ steps.build.outputs.digest }}"
