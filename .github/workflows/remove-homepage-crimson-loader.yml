name: Remove homepage crimson loader

on:
  push:
    paths:
      - .github/workflows/remove-homepage-crimson-loader.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove crimson homepage redirect gate only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          target = """<script>
/* ClearGlass loader gate — show cinematic loader once per session.
   Opt out: ?noloader=1, prior session, reduced-motion, hash, or crawler.
   SEO: never redirect search/AI crawlers — they must index the real page. */
(function(){
  try{
    var ua = navigator.userAgent || '';
    if (/bot|crawl|spider|slurp|bingpreview|google|bing|duckduck|baidu|yandex|sogou|exabot|facebot|ia_archiver|lighthouse|gptbot|oai-searchbot|chatgpt|claudebot|claude-web|anthropic|perplexity|amazonbot|applebot|ccbot|cohere|google-extended/i.test(ua)) return;
    var q = window.location.search || '';
    var h = window.location.hash || '';
    if (/noloader|skip/i.test(q+h)) return;
    if (sessionStorage.getItem('clearglass.loader.seen')) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (document.referrer && /clearglassinc\.github\.io/.test(document.referrer)) return;
    sessionStorage.setItem('clearglass.loader.seen','1');
    window.location.replace('cg-loader.html?next=index.html');
  }catch(e){}
})();
</script>
"""
          if target not in text:
              raise SystemExit('Crimson homepage redirect gate not found; no change applied.')
          updated = text.replace(target, '', 1)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify primary loader remains and crimson redirect removed
        run: |
          test "$(grep -c "window.location.replace('cg-loader.html?next=index.html')" index.html || true)" = "0"
          grep -q 'id="cg-loader"' index.html
          grep -q 'CLEARGLASS PREMIUM LOADER' index.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove crimson homepage loader gate"
          git push
