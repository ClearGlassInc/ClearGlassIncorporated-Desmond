name: Repo Assistant Bot Rollout

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  sync-workflow-to-all-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync workflow into all org repositories
        env:
          ORG_NAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          import urllib.error

          org = os.environ["ORG_NAME"]
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("Missing required secret: ORG_ADMIN_TOKEN")

          target_path = ".github/workflows/repo-assistant-bot.yml"
          with open(target_path, "r", encoding="utf-8") as f:
              desired = f.read()

          api = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "repo-assistant-rollout"
          }

          def request(url, method="GET", payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method)
              for k, v in headers.items():
                  req.add_header(k, v)
              req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode("utf-8")) if resp.readable() else {}

          repos = []
          page = 1
          while True:
              url = f"{api}/orgs/{org}/repos?per_page=100&page={page}&type=all"
              batch = request(url)
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          for repo in repos:
              name = repo["name"]
              full = repo["full_name"]
              if repo.get("archived"):
                  print(f"SKIP archived {full}")
                  continue

              file_url = f"{api}/repos/{full}/contents/{target_path}"
              sha = None
              current = None
              try:
                  data = request(file_url)
                  sha = data.get("sha")
                  current = base64.b64decode(data["content"]).decode("utf-8")
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      print(f"WARN unable to read {full}: {e}")
                      continue

              if current == desired:
                  print(f"OK {full} already up-to-date")
                  continue

              payload = {
                  "message": "chore(actions): enforce repo assistant bot workflow",
                  "content": base64.b64encode(desired.encode("utf-8")).decode("ascii"),
                  "branch": repo.get("default_branch", "main")
              }
              if sha:
                  payload["sha"] = sha

              try:
                  request(file_url, method="PUT", payload=payload)
                  print(f"SYNCED {full}")
              except urllib.error.HTTPError as e:
                  print(f"WARN unable to write {full}: {e}")
          PY
