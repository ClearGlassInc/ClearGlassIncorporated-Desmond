name: Repo Audit

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      owner:
        description: "Org/user to audit (blank = self-audit this repo only)"
        required: false
        default: "ClearGlassInc"

permissions:
  contents: read

concurrency:
  group: repo-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Portfolio Repo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # discovery + per-repo reads only; never writes
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.event.inputs.owner || '' }}
        run: |
          if [ -n "$OWNER" ]; then
            python scripts/repo_audit.py --org "$OWNER" --out audit-reports
          else
            python scripts/repo_audit.py --self --out audit-reports
          fi
          echo "### Repo audit summary" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("audit-reports/repo_audit.json"))["summary"]
          for k, v in s.items():
              print(f"- **{k}**: {v}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: repo-audit-reports
          path: audit-reports/
          retention-days: 30
