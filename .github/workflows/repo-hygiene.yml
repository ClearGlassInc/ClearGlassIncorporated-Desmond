name: Repo Hygiene

# ── Nightly repository cleanup for the ClearGlass content pipeline ────────────
# Job 1 · stale     — auto-label and close abandoned content draft issues
# Job 2 · triage    — catch any unlabeled issues and apply baseline labels
# Job 3 · notify    — write a hygiene summary to the Actions step summary
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC nightly — after all content jobs have completed
    - cron: '0 23 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Mark and close stale draft content ──────────────────────────────
  stale:
    name: "Handle stale content items"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ensure stale labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "status:stale" \
            --color "E4E669" \
            --description "No activity for 7+ days" \
            --repo "${{ github.repository }}" \
            2>/dev/null || true

      - name: Mark stale draft issues (7-day inactivity)
        uses: actions/stale@v9
        with:
          repo-token: ${{ github.token }}
          # Only touch issues carrying the draft label
          only-labels: "status:draft"
          # Leave scheduled/review/published/reports completely alone
          exempt-issue-labels: >
            status:review,
            status:scheduled,
            status:published,
            type:report,
            urgency:high
          days-before-stale: 7
          days-before-close: 30
          stale-issue-label: "status:stale"
          close-issue-label: "status:stale"
          stale-issue-message: |
            This content draft has had no activity for **7 days** and has been marked stale.

            **To keep it active**, update the status label to `status:review` or `status:scheduled`.

            It will be closed automatically in **23 days** unless action is taken.
            Closed items can be repurposed in a future campaign cycle.
          close-issue-message: |
            Closing this content item after **30 days** of inactivity.

            Archive the copy from `marketing/output/archive/` if you want to repurpose it.
            Re-open the issue and relabel as `status:draft` to restart the pipeline.
          # Do not touch PRs
          operations-per-run: 50

  # ── Job 2: Triage unlabeled content issues ─────────────────────────────────
  triage:
    name: "Triage unlabeled issues"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: stale

    steps:
      - name: Ensure triage label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "needs-triage" \
            --color "F9A825" \
            --description "Requires manual label assignment" \
            --repo "${{ github.repository }}" \
            2>/dev/null || true

      - name: Apply needs-triage to unlabeled open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELED=0
          gh issue list \
            --state open \
            --json number,labels,title \
            --jq '.[] | select(.labels | length == 0) | "\(.number) \(.title)"' \
          | while IFS=' ' read -r num title_rest; do
              # Only touch issues that look like content pipeline output
              if echo "$title_rest" | grep -qiE '^(Content:|Campaign)'; then
                gh issue edit "$num" \
                  --add-label "needs-triage,status:draft" \
                  --repo "${{ github.repository }}" \
                  2>/dev/null && LABELED=$((LABELED + 1)) || true
              fi
            done
          echo "Triage pass complete."

  # ── Job 3: Hygiene summary ─────────────────────────────────────────────────
  notify:
    name: "Write hygiene summary"
    runs-on: ubuntu-latest
    needs: [stale, triage]
    if: always()

    steps:
      - name: Gather open issue counts by label
        id: counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count_label() {
            gh issue list --state open --label "$1" --json number \
              --jq 'length' 2>/dev/null || echo 0
          }

          DRAFT=$(count_label "status:draft")
          REVIEW=$(count_label "status:review")
          SCHEDULED=$(count_label "status:scheduled")
          STALE=$(count_label "status:stale")
          TRIAGE=$(count_label "needs-triage")

          echo "draft=${DRAFT}"     >> "$GITHUB_OUTPUT"
          echo "review=${REVIEW}"   >> "$GITHUB_OUTPUT"
          echo "scheduled=${SCHEDULED}" >> "$GITHUB_OUTPUT"
          echo "stale_count=${STALE}"   >> "$GITHUB_OUTPUT"
          echo "triage=${TRIAGE}"   >> "$GITHUB_OUTPUT"

      - name: Write step summary
        env:
          DRAFT: ${{ steps.counts.outputs.draft }}
          REVIEW: ${{ steps.counts.outputs.review }}
          SCHEDULED: ${{ steps.counts.outputs.scheduled }}
          STALE: ${{ steps.counts.outputs.stale_count }}
          TRIAGE: ${{ steps.counts.outputs.triage }}
          STALE_RESULT: ${{ needs.stale.result }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
        run: |
          echo "## Repo Hygiene · $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Content Pipeline Issue Queue" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Label | Open Issues |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| status:draft | ${DRAFT:-?} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| status:review | ${REVIEW:-?} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| status:scheduled | ${SCHEDULED:-?} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| status:stale | ${STALE:-?} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| needs-triage | ${TRIAGE:-?} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Job Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stale handler | ${STALE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triage | ${TRIAGE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
