name: Repository Health

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Validate critical repository prerequisites
        run: python3 scripts/repository_health.py --summary "$GITHUB_STEP_SUMMARY"
