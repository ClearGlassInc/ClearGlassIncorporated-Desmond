name: Repository Health

on:
  pull_request:
    paths:
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/**"
      - "tools/**"
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/**"
      - "tools/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install diagnostic dependencies
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate critical repository structure
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            AGENTS.md CLAUDE.md index.html CNAME .nojekyll
            package.json package-lock.json pyproject.toml
            scripts/verify_site.py scripts/workflow_doctor.py
            scripts/audit_github_actions.py tools/build_pages.py
          )
          missing=0
          {
            echo "### Repository structure"
            echo
            for path in "${critical[@]}"; do
              if [ -s "$path" ]; then
                echo "- ✅ \`$path\`"
              else
                echo "- ❌ \`$path\` is missing or empty"
                echo "::error file=${path}::Critical repository file is missing or empty"
                missing=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$missing"

      - name: Validate workflow syntax and safety invariants
        run: |
          set -euo pipefail
          python scripts/workflow_doctor.py
          python scripts/audit_github_actions.py

      - name: Validate Pages prerequisites and artifact boundary
        run: |
          set -euo pipefail
          python scripts/verify_site.py
          python tools/build_pages.py dist
          test -s dist/index.html
          test -s dist/CNAME
          test -f dist/.nojekyll
          {
            echo
            echo "### GitHub Pages prerequisites"
            echo
            echo "- ✅ Canonical static artifact built successfully."
            echo "- ✅ Custom domain and \`.nojekyll\` are present."
            echo "- Artifact size: \`$(du -sh dist | cut -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report advisory configuration
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Advisory checks"
            echo
            echo "- Repository secrets, environment reviewers, branch rulesets, and Pages source settings require administrator verification; they cannot be proven from a checkout."
            echo "- Hosted action availability and production URL health are intentionally verified by their owning workflows rather than inferred here."
          } >> "$GITHUB_STEP_SUMMARY"
