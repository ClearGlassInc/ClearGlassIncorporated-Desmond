name: Runner Canary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/runner-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: GitHub-hosted runner canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "arch=${RUNNER_ARCH:-unknown}"
          echo "sha=${GITHUB_SHA}"
          echo "Runner execution reached the shell." >> "$GITHUB_STEP_SUMMARY"
