name: Sales Outreach Bot

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: "Run for a specific vertical only (government_defense | financial_institutions | enterprise_technology | all)"
        required: false
        default: "all"
        type: string
  schedule:
    # Runs every Monday at 08:00 UTC — refreshes outreach sequences weekly
    - cron: '0 8 * * 1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sales-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

      - name: Ensure output directory exists
        run: mkdir -p marketing/output/sales

      - name: Run sales outreach bot
        env:
          FORCE_VERTICAL: ${{ github.event.inputs.vertical || 'all' }}
        run: python bots/sales_outreach_bot.py

      - name: Commit generated sequences
        run: |
          if [[ -n "$(git status --porcelain -- marketing/output/sales)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marketing/output/sales
            git commit -m "Sales bot: refresh outreach sequences [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit — sequences unchanged."
          fi
