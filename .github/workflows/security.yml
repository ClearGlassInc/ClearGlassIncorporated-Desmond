name: Security

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC — weekly scan

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Dependency Graph is a required repository control, but the action hard
      # errors ("Dependency review is not supported on this repository") when it
      # is switched off, which turns every PR red without producing a finding.
      # Probe for it first: when the graph is on, the review below still runs
      # and still fails closed; when it is off, the job reports a loud warning
      # instead of a failure that carries no dependency signal.
      - name: Probe Dependency Graph availability
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Probe the comparison endpoint the action itself calls. The SBOM
          # endpoint is not a valid proxy for availability: it answers 200 on
          # this repository while the comparison API still rejects the request.
          code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency Review skipped::Dependency graph comparison returned HTTP ${code}; dependency review cannot run. Enable Dependency graph under Settings → Code security and analysis."
          fi
      - if: steps.depgraph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect hardcoded secrets
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path

          PATTERNS = {
            "AWS access key":        r"AKIA[0-9A-Z]{16}",
            "GitHub PAT (ghp_)":     r"ghp_[A-Za-z0-9]{36}",
            "GitHub PAT (ghs_)":     r"ghs_[A-Za-z0-9]{36}",
            "GitLab PAT":            r"glpat-[A-Za-z0-9_-]{20}",
            "Generic API key":       r"(?i)api[_-]?key\s*[:=]\s*['\"][A-Za-z0-9/+]{20,}['\"]",
            "Private key header":    r"-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----",
          }

          EXTENSIONS = {
            ".py", ".js", ".mjs", ".cjs", ".ts", ".tsx",
            ".env", ".json", ".yaml", ".yml", ".sh",
          }

          findings = []
          root = Path(".")
          for path in root.rglob("*"):
            if not path.is_file():
              continue
            if path.suffix not in EXTENSIONS:
              continue
            rel = str(path)
            if ".git/" in rel or "node_modules/" in rel:
              continue
            try:
              text = path.read_text(encoding="utf-8", errors="ignore")
            except OSError:
              continue
            for label, pattern in PATTERNS.items():
              if re.search(pattern, text):
                findings.append(f"{rel}: {label}")

          if findings:
            for f in findings:
              print(f"::error::{f}")
            sys.exit(1)
          print("No hardcoded secrets detected.")
          PYEOF

  workflow-lint:
    name: Workflow YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - name: Validate workflow YAML
        run: |
          python3 - <<'PYEOF'
          import sys, yaml
          from pathlib import Path

          errors = []
          for wf in sorted(Path(".github/workflows").glob("*.y*ml")):
            try:
              data = yaml.safe_load(wf.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                errors.append(f"{wf}: root is not a mapping")
            except yaml.YAMLError as exc:
              errors.append(f"{wf}: {exc}")

          if errors:
            for e in errors:
              print(f"::error::{e}")
            sys.exit(1)
          print(f"All {len(list(Path('.github/workflows').glob('*.y*ml')))} workflow files are valid YAML.")
          PYEOF
      - name: Enforce workflow security invariants
        run: |
          python3 - <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          import yaml

          action_ref = re.compile(r"^[^@\s]+@[0-9a-f]{40}$")
          action_use = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)", re.MULTILINE)
          secret_expression = re.compile(re.escape("$" + "{{") + r"\s*secrets\.")
          failures = []

          def walk(value):
            if isinstance(value, dict):
              for child in value.values():
                yield from walk(child)
            elif isinstance(value, list):
              for child in value:
                yield from walk(child)
            elif isinstance(value, str):
              yield value

          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
            text = workflow.read_text(encoding="utf-8")
            data = yaml.safe_load(text)
            trigger = data.get(True, data.get("on"))
            permissions = data.get("permissions")

            if not isinstance(permissions, dict):
              failures.append(f"{workflow}: explicit top-level permissions mapping is required")
            if isinstance(trigger, dict) and "pull_request_target" in trigger:
              failures.append(f"{workflow}: pull_request_target is prohibited")

            for ref in action_use.findall(text):
              if ref.startswith("./") or ref.startswith("docker://"):
                continue
              if not action_ref.fullmatch(ref):
                failures.append(f"{workflow}: external action must use a full commit SHA: {ref}")

            for job_name, job in (data.get("jobs") or {}).items():
              if not isinstance(job, dict):
                failures.append(f"{workflow}: job {job_name} is not a mapping")
                continue
              if "uses" not in job and "timeout-minutes" not in job:
                failures.append(f"{workflow}: job {job_name} requires timeout-minutes")
              for step in job.get("steps", []):
                if not isinstance(step, dict):
                  continue
                run = step.get("run")
                if isinstance(run, str) and secret_expression.search(run):
                  failures.append(
                    f"{workflow}: job {job_name} interpolates a secret directly into run; pass it through env"
                  )

            # Scan all scalar values for credential literals while allowing
            # GitHub's secrets context references and documentation labels.
            for scalar in walk(data):
              if ("$" + "{{ secrets.") in scalar:
                continue
              if re.search(r"-----BEGIN (?:RSA|EC|DSA|OPENSSH) PRIVATE KEY-----", scalar):
                failures.append(f"{workflow}: embedded private key material detected")

          if failures:
            for failure in failures:
              print(f"::error::{failure}")
            sys.exit(1)
          print("Workflow security invariants satisfied.")
          PYEOF
