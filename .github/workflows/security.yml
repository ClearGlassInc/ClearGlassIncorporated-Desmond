name: Security

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC — weekly scan

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect hardcoded secrets
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path

          PATTERNS = {
            "AWS access key":        r"AKIA[0-9A-Z]{16}",
            "GitHub PAT (ghp_)":     r"ghp_[A-Za-z0-9]{36}",
            "GitHub PAT (ghs_)":     r"ghs_[A-Za-z0-9]{36}",
            "GitLab PAT":            r"glpat-[A-Za-z0-9_-]{20}",
            "Generic API key":       r"(?i)api[_-]?key\s*[:=]\s*['\"][A-Za-z0-9/+]{20,}['\"]",
            "Private key header":    r"-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----",
          }

          EXTENSIONS = {
            ".py", ".js", ".mjs", ".cjs", ".ts", ".tsx",
            ".env", ".json", ".yaml", ".yml", ".sh",
          }

          findings = []
          root = Path(".")
          for path in root.rglob("*"):
            if not path.is_file():
              continue
            if path.suffix not in EXTENSIONS:
              continue
            rel = str(path)
            if ".git/" in rel or "node_modules/" in rel:
              continue
            try:
              text = path.read_text(encoding="utf-8", errors="ignore")
            except OSError:
              continue
            for label, pattern in PATTERNS.items():
              if re.search(pattern, text):
                findings.append(f"{rel}: {label}")

          if findings:
            for f in findings:
              print(f"::error::{f}")
            sys.exit(1)
          print("No hardcoded secrets detected.")
          PYEOF

  workflow-lint:
    name: Workflow YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - name: Validate workflow YAML
        run: |
          python3 - <<'PYEOF'
          import sys, yaml
          from pathlib import Path

          errors = []
          for wf in sorted(Path(".github/workflows").glob("*.y*ml")):
            try:
              data = yaml.safe_load(wf.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                errors.append(f"{wf}: root is not a mapping")
            except yaml.YAMLError as exc:
              errors.append(f"{wf}: {exc}")

          if errors:
            for e in errors:
              print(f"::error::{e}")
            sys.exit(1)
          print(f"All {len(list(Path('.github/workflows').glob('*.y*ml')))} workflow files are valid YAML.")
          PYEOF
