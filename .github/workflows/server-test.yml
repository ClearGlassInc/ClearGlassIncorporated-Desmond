name: Self-Hosted Runner — Validate Site

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/server-test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: [self-hosted, linux, clearglass]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validators
        run: npm install -g htmlhint stylelint stylelint-config-standard 2>/dev/null || true

      - name: Lint HTML
        run: htmlhint "**/*.html" --ignore "node_modules/**,_site/**" || true

      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py && echo "Python OK"

      - name: Secret pattern scan
        run: |
          echo "Checking for obvious secrets in committed files..."
          if grep -rn --include="*.html" --include="*.js" --include="*.yml" \
            -E "(secret|password|api_key)\s*[:=]\s*['\"][^'\"]{8,}" . \
            --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null; then
            echo "WARNING: Possible hardcoded secrets found — review above"
          else
            echo "No hardcoded secrets detected"
          fi

  docker-smoke:
    name: Docker smoke test
    runs-on: [self-hosted, linux, clearglass]
    timeout-minutes: 10
    steps:
      - name: Docker version
        run: docker version

      - name: Run nginx in Docker (smoke test)
        run: |
          set -euo pipefail
          docker run --rm -d -p 8080:80 --name site-test nginx:alpine
          sleep 2
          curl -f http://localhost:8080 && echo "Docker nginx OK"
          docker stop site-test
