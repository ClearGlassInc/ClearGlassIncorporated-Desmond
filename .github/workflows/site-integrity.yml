name: Site Integrity

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/site_integrity.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - ".github/workflows/site-integrity.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/site_integrity.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - ".github/workflows/site-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run site integrity audit
        run: python scripts/site_integrity.py
