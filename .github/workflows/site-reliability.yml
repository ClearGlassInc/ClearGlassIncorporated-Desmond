name: Site Reliability Audit

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/site_reliability_audit.py"
      - ".github/workflows/site-reliability.yml"
      - "infra/**"
      - "runner/**"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/site_reliability_audit.py"
      - ".github/workflows/site-reliability.yml"
      - "infra/**"
      - "runner/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository reliability audit
        run: python scripts/site_reliability_audit.py
