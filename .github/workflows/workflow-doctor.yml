name: Workflow Doctor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "scripts/workflow_doctor.py"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "scripts/workflow_doctor.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-workflows:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run workflow doctor repair
        run: python scripts/workflow_doctor.py --fix

      - name: Commit workflow doctor repairs
        if: github.event_name != 'pull_request'
        run: |
          if git status --porcelain -- .github/workflows scripts/workflow_doctor.py | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows scripts/workflow_doctor.py
            git commit -m "Workflow doctor: apply automatic repairs [skip ci]"
            git push
          else
            echo "No workflow repairs needed."
          fi

      - name: Verify clean workflow audit
        run: python scripts/workflow_doctor.py
