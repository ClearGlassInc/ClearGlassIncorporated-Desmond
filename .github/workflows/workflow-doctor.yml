name: Workflow Doctor

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC — weekly audit + auto-repair
  push:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Audit (every trigger) ────────────────────────────────────────────────────
  audit:
    name: Audit Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - name: Dry-run workflow doctor
        run: python scripts/workflow_doctor.py

  # ── Auto-repair (schedule and manual dispatch only) ──────────────────────────
  repair:
    name: Auto-repair Workflows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pyyaml

      - name: Apply workflow repairs
        id: doctor
        run: |
          python scripts/workflow_doctor.py --fix
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push repair branch
        if: steps.doctor.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/workflow-doctor-repair
          git add .github/workflows/
          git commit -m "fix(ci): repair GitHub Actions workflows [auto]"
          git push -f origin bot/workflow-doctor-repair

      - name: Open repair PR
        if: steps.doctor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]

          payload = json.dumps({
            "title": "fix(ci): auto-repair GitHub Actions workflows",
            "head":  "bot/workflow-doctor-repair",
            "base":  "main",
            "body": (
              "Automated workflow repair by the Workflow Doctor bot.\n\n"
              "### What changed\n"
              "Run `git diff main...bot/workflow-doctor-repair` to inspect exact changes.\n\n"
              "### Rollback\n"
              "Close this PR without merging to reject all repairs."
            ),
          }).encode()

          req = urllib.request.Request(
            f"https://api.github.com/repos/{repo}/pulls",
            data=payload,
            headers={
              "Authorization":       f"Bearer {token}",
              "Accept":              "application/vnd.github+json",
              "Content-Type":        "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
            method="POST",
          )
          try:
            with urllib.request.urlopen(req) as resp:
              pr = json.loads(resp.read())
            print(f"PR created: {pr['html_url']}")
          except urllib.error.HTTPError as exc:
            body = exc.read().decode()
            if "already exists" in body or "A pull request already exists" in body:
              print("Repair PR already open — skipping creation")
            else:
              raise
          PYEOF
