name: Workflow Repair Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "actions/**"
      - "tools/workflow_repair_agent.py"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect workflow automation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Run workflow repair agent
        run: python tools/workflow_repair_agent.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: workflow-repair-agent-report
          path: |
            workflow-repair-report.md
            workflow-repair-report.json
          if-no-files-found: ignore
