<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearGlass Inc. · Redirecting</title>
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="3; url=https://clearglassinc.github.io/" />
  <link rel="canonical" href="https://clearglassinc.github.io/" />
  <style>
    :root{--bg:#0a0c10;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f5f7fb;--muted:rgba(245,247,251,.68);--accent:#38bdf8;--serif:Georgia,serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,rgba(56,189,248,.12),transparent 35%),var(--bg);color:var(--text);font-family:var(--sans);padding:24px}
    .card{max-width:720px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:40px 32px;backdrop-filter:blur(18px);text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.22)}
    .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
    h1{font-family:var(--serif);font-size:clamp(2.4rem,7vw,4.4rem);font-weight:500;line-height:1.02;letter-spacing:-.03em}
    p{margin-top:18px;color:var(--muted);font-size:1rem;line-height:1.8}
    a{display:inline-block;margin-top:26px;padding:14px 24px;border-radius:999px;background:#fff;color:#081018;text-decoration:none;font-weight:700}
    .small{margin-top:14px;font-size:.92rem}
  </style>
<link rel="stylesheet" href="/assets/css/glass.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">ClearGlass Inc. · Stable Route Recovery</div>
    <h1>That path is not live.</h1>
    <p>You are being returned to the ClearGlass GitHub Pages home at <strong>clearglassinc.github.io</strong>.</p>
    <a href="https://clearglassinc.github.io/">Return to Home</a>
    <p class="small">Automatic redirect in 3 seconds.</p>
  </main>
  <script>setTimeout(function(){window.location.replace('https://clearglassinc.github.io/');},3000);</script>
</body>
</html>
