openapi: 3.1.0
info:
  title: ClearGlass Minerals Intelligence Platform API
  version: 1.0.0
  description: >-
    Versioned, organization-aware API for critical-minerals intelligence.
    Observed, delayed, estimated, analyst-entered, and demo data must remain distinguishable.
servers:
  - url: /api/v1
security:
  - trustedIdentityGateway: []
paths:
  /health:
    get:
      security: []
      summary: Service and database health
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /search:
    get:
      summary: Universal entity search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200': { description: Search results }
  /minerals:
    get:
      summary: Mineral taxonomy and profiles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: q, in: query, schema: { type: string } }
        - { name: group, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated mineral profiles }
  /projects:
    get:
      summary: Mines and project registry
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: q, in: query, schema: { type: string } }
        - { name: mineralId, in: query, schema: { type: string, format: uuid } }
        - { name: countryId, in: query, schema: { type: string, format: uuid } }
        - { name: stage, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated project profiles }
  /map/features:
    get:
      summary: GeoJSON map features
      parameters:
        - { name: west, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: south, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: east, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: north, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: type, in: query, schema: { type: string, enum: [project, mine, facility, logistics, all] } }
      responses:
        '200': { description: GeoJSON FeatureCollection }
  /markets:
    get:
      summary: Mineral market price series
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: mineralId, in: query, schema: { type: string, format: uuid } }
        - { name: benchmark, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated market observations }
  /trade:
    get:
      summary: Import/export intelligence
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: mineralId, in: query, schema: { type: string, format: uuid } }
        - { name: originCountryId, in: query, schema: { type: string, format: uuid } }
        - { name: destinationCountryId, in: query, schema: { type: string, format: uuid } }
        - { name: hsCode, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated trade records }
  /risk:
    get:
      summary: Risk assessment history
      responses:
        '200': { description: Assessments }
    post:
      summary: Calculate or persist a transparent risk assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                mineId: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                persist: { type: boolean, default: false }
                analystOverride: { type: boolean, default: false }
                components:
                  type: array
                  items:
                    type: object
                    required: [key, score, weight]
                    properties:
                      key: { type: string }
                      score: { type: [number, 'null'], minimum: 0, maximum: 100 }
                      weight: { type: number, minimum: 0, maximum: 1 }
                      confidence: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200': { description: Calculated result }
        '201': { description: Persisted assessment }
  /alerts:
    get:
      summary: Organization alerts
      responses:
        '200': { description: Alerts }
    post:
      summary: Create a deduplicated alert
      responses:
        '201': { description: Alert created }
  /alerts/{id}:
    get:
      summary: Alert detail and comments
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Alert }
    patch:
      summary: Acknowledge, assign, resolve, suppress, or comment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Updated workflow state }
  /watchlists:
    get:
      summary: Organization watchlists
      responses:
        '200': { description: Watchlists }
    post:
      summary: Create watchlist
      responses:
        '201': { description: Watchlist created }
  /watchlists/{id}:
    patch:
      summary: Add/remove items or rename a watchlist
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Updated watchlist }
  /reports:
    get:
      summary: Organization reports
      responses:
        '200': { description: Reports }
    post:
      summary: Create analyst or AI-assisted draft report
      responses:
        '201': { description: Draft report }
  /reports/{id}:
    patch:
      summary: Review, publish, or archive a report
      description: AI-generated reports cannot be published before human review.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Updated report }
        '409': { description: Human review required }
  /sources:
    get:
      summary: Data-source health and latest ingestion run
      responses:
        '200': { description: Source registry }
  /ingestion:
    get:
      summary: Recent ingestion runs
      responses:
        '200': { description: Ingestion runs }
    post:
      summary: Queue a source refresh subject to source TTL
      responses:
        '202': { description: Refresh queued }
        '429': { description: Source still inside TTL }
  /exports:
    get:
      summary: Permissioned CSV or JSON export
      parameters:
        - { name: entity, in: query, required: true, schema: { type: string, enum: [projects, mines, trade] } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: limit, in: query, schema: { type: integer, maximum: 5000, default: 1000 } }
      responses:
        '200': { description: Export file }
components:
  securitySchemes:
    trustedIdentityGateway:
      type: apiKey
      in: header
      name: x-cg-user-id
      description: >-
        Production identity headers must be injected only by a trusted OIDC/SAML-capable ingress.
        Direct client injection must be stripped at the edge.
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 250, default: 50 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
