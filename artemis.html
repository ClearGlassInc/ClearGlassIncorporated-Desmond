<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearGlassInc | System Start</title>
  <style>
    :root {
      --bg-0: #ffffff;
      --bg-1: #f8fbff;
      --bg-2: #f2f7ff;
      --ink-0: #0f172a;
      --ink-1: #1e293b;
      --muted: #475569;
      --accent: #58b8ff;
      --accent-soft: rgba(88, 184, 255, 0.2);
      --panel: rgba(255, 255, 255, 0.72);
      --panel-fallback: #ffffff;
      --border: rgba(88, 184, 255, 0.28);
      --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--ink-0);
      background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      z-index: 9999;
      transition: opacity 350ms ease, visibility 350ms ease;
    }

    .loader-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panel {
      width: min(92vw, 460px);
      border-radius: 20px;
      background: var(--panel-fallback);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: var(--shadow), 0 0 0 1px var(--border);
      padding: 1.5rem 1.2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    @supports ((-webkit-backdrop-filter: blur(8px)) or (backdrop-filter: blur(8px))) {
      .panel {
        background: var(--panel);
        -webkit-backdrop-filter: blur(8px) saturate(1.1);
        backdrop-filter: blur(8px) saturate(1.1);
      }
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(88,184,255,0.08) 50%, transparent 80%);
      pointer-events: none;
    }

    .wordmark {
      letter-spacing: 0.2rem;
      font-weight: 800;
      color: var(--ink-1);
      text-transform: uppercase;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
    }

    .tagline {
      margin-top: 0.5rem;
      color: var(--ink-0);
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
    }

    .pulse-ring {
      width: 64px;
      height: 64px;
      margin: 1.2rem auto;
      border-radius: 999px;
      border: 1.5px solid var(--accent-soft);
      display: grid;
      place-items: center;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .pulse-ring::after {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(88,184,255,0.95), rgba(88,184,255,0.28));
      box-shadow: 0 0 18px rgba(88,184,255,0.35);
    }

    .track {
      height: 4px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
      margin: 0.7rem auto 0.85rem;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #89d2ff 0%, #58b8ff 100%);
      transition: width 260ms linear;
      box-shadow: 0 0 12px rgba(88,184,255,0.4);
    }

    .status {
      margin-top: 0.55rem;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.2rem;
    }

    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 350ms ease;
      padding: 2rem;
    }

    main.is-visible { opacity: 1; }

    .hero {
      max-width: 720px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-overlay, .fill, main { transition: none; }
      .pulse-ring { animation: none; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.92; }
    }
  </style>
</head>
<body>
  <div id="loader" class="loader-overlay" role="status" aria-busy="true" aria-live="polite" aria-atomic="true">
    <section class="panel" aria-label="ClearGlassInc secure initialization panel">
      <div class="wordmark">ClearGlassInc</div>
      <div class="tagline">Clarity Is Power</div>
      <div class="pulse-ring" aria-hidden="true"></div>

      <div class="track" aria-hidden="true">
        <div id="fill" class="fill"></div>
      </div>
      <p id="status" class="status">Initializing interface…</p>
    </section>
  </div>

  <main id="content" aria-hidden="true">
    <section class="hero">
      <h1>ClearGlassInc Artemis</h1>
      <p>Homepage content loads here. Replace this with your real landing content.</p>
    </section>
  </main>

  <script>
    (() => {
      const statusLines = [
        'Initializing interface…',
        'Loading secure modules…',
        'Calibrating visual system…',
        'Entering ClearGlass…'
      ];

      const loader = document.getElementById('loader');
      const fill = document.getElementById('fill');
      const status = document.getElementById('status');
      const content = document.getElementById('content');

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const totalDuration = reducedMotion ? 750 : 1550;
      const start = performance.now();
      let index = 0;

      function tick(now) {
        const elapsed = now - start;
        const p = Math.min(1, elapsed / totalDuration);
        fill.style.width = `${Math.round(p * 100)}%`;

        const nextIndex = Math.min(statusLines.length - 1, Math.floor(p * statusLines.length));
        if (nextIndex !== index) {
          index = nextIndex;
          status.textContent = statusLines[index];
        }

        if (p < 1) return requestAnimationFrame(tick);

        loader.setAttribute('aria-busy', 'false');
        content.setAttribute('aria-hidden', 'false');
        content.classList.add('is-visible');
        loader.classList.add('is-hidden');
      }

      const fallbackTimeout = setTimeout(() => requestAnimationFrame(tick), 120);
      window.addEventListener('load', () => {
        clearTimeout(fallbackTimeout);
        requestAnimationFrame(tick);
      }, { once: true });
    })();
  </script>

  <!--
  Integration notes:
  1) Inline overlay mode (recommended): copy only .loader-overlay markup into index.html, keep your existing <main> content.
  2) Standalone mode: keep this file as loader.html and redirect to index.html after load in JS if desired.
  3) For GitHub Pages, this file is static and requires no build tooling.
  -->
</body>
</html>
