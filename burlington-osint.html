<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>ClearGlass · Burlington OSINT Control Deck</title>
<meta name="description" content="Burlington / Halton crime & governance OSINT control deck — live status stream, investigation task queue with optimistic updates, and a cited crime-intel feed sourced from public records. Lawful public-source intelligence only."/>
<link rel="canonical" href="https://clearglassinc.github.io/burlington-osint.html"/>
<meta name="theme-color" content="#070b10"/>
<meta name="robots" content="noindex"/>
<meta property="og:title" content="ClearGlass · Burlington OSINT Control Deck"/>
<meta property="og:description" content="Operator workstation for Burlington/Halton public-source intelligence: live status, investigation tasks, and a cited crime-intel feed."/>
<meta property="og:type" content="website"/>
<link rel="icon" href="icon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070b10; --bg-2:#0b1119; --panel:#0e1622; --panel-2:#111c2b;
  --line:rgba(120,170,210,0.14); --line-2:rgba(120,170,210,0.25);
  --text:#dbe7f2; --text-2:#8aa2b8; --text-3:#5d7488;
  --cyan:#22d3ee; --cyan-dim:#0e7490; --green:#34d399; --amber:#fbbf24; --red:#f87171; --violet:#a78bfa;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
  --sidebar-w:248px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 50% 40% at 15% 0%, rgba(34,211,238,0.07), transparent 60%),
    radial-gradient(ellipse 45% 40% at 90% 100%, rgba(167,139,250,0.06), transparent 60%),
    var(--bg);
  color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  border-right:1px solid var(--line); padding:18px 14px; position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.brand .t1{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em}
.brand .t2{font-size:10px;color:var(--text-2);letter-spacing:.05em}
.navlink{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text-2);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid transparent;text-align:left;width:100%;background:none;
}
.navlink:hover{background:var(--panel);color:var(--text)}
.navlink.active{background:var(--panel-2);color:var(--cyan);border-color:var(--line-2)}
.navlink .ic{width:16px;text-align:center}
.navlink .badge{margin-left:auto;font-size:10px;background:var(--cyan-dim);color:#031018;border-radius:10px;padding:1px 7px;font-weight:700}
.sidebar .foot{margin-top:auto;font-size:10px;color:var(--text-3);line-height:1.6;padding:10px 8px;border-top:1px solid var(--line)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:rgba(7,11,16,0.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.topbar h1{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.06em}
.topbar .sub{font-size:11px;color:var(--text-2)}
.topbar .spacer{flex:1}
.pill{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);color:var(--text-2);display:flex;align-items:center;gap:7px}
.pill .lv{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.off .lv{background:var(--text-3);box-shadow:none}
.clock{font-family:var(--mono);font-size:11px;color:var(--text-2)}
.content{padding:22px;max-width:1180px;width:100%}

/* ---------- Generic ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px;font-weight:600}
.btn{background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12px;font-family:var(--mono);letter-spacing:.03em}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#04141a;border-color:var(--cyan);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:#04141a}
.btn.sm{padding:5px 10px;font-size:11px}
select,input,textarea{
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:12px;width:100%;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
.muted{color:var(--text-2)}
.tiny{font-size:10px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);color:var(--text-2);margin:2px 4px 2px 0}
.sev{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:.05em}
.sev.high{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.4)}
.sev.med{background:rgba(251,191,36,0.12);color:var(--amber);border:1px solid rgba(251,191,36,0.35)}
.sev.low{background:rgba(52,211,153,0.12);color:var(--green);border:1px solid rgba(52,211,153,0.32)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:6px}
.stat .d{font-size:11px;color:var(--text-2);margin-top:4px}
.up{color:var(--green)} .down{color:var(--cyan)} .warn{color:var(--amber)}

/* stream */
.stream{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);align-items:start;animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ev .ts{font-family:var(--mono);font-size:10px;color:var(--text-3);padding-top:2px}
.ev .ti{font-weight:600;font-size:13px}
.ev .de{font-size:12px;color:var(--text-2);margin-top:2px}
.ev .meta{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:5px}

/* tasks */
.taskcol{margin-bottom:18px}
.taskcol h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.taskcol h4 .ct{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:10px}
.task{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:border-color .15s}
.task:hover{border-color:var(--line-2)}
.task.pending{opacity:.55;border-style:dashed}
.task .ti{font-weight:600;font-size:13px}
.task .de{font-size:12px;color:var(--text-2);margin-top:3px}
.task .ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:148px}
.prio{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px}
.prio.high{color:var(--red)} .prio.med{color:var(--amber)} .prio.low{color:var(--text-2)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,10,0.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:22px;width:100%;max-width:520px}
.modal h3{font-family:var(--mono);font-size:13px;margin-bottom:16px;color:var(--cyan)}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:6px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* toasts */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80;max-width:340px}
.toast{background:var(--panel-2);border:1px solid var(--line-2);border-left-width:3px;border-radius:9px;padding:12px 14px;font-size:12px;animation:slidein .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--cyan)}
.toast .tt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:3px}

/* intel feed */
.src{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.src .ty{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.notice{background:rgba(34,211,238,0.06);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--text-2);margin-bottom:16px}
.errband{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.4);border-radius:10px;padding:16px;color:var(--text)}

.hide{display:none}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow-x:auto}
  .sidebar .brand,.sidebar .foot{width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   ClearGlass · Burlington OSINT Control Deck
   Self-contained, dependency-free. Deploys directly on GitHub Pages.
   - Live status stream  : mock realtime via EventTarget (~8.5s)
   - Investigation tasks : optimistic CRUD + rollback + toasts + localStorage
   - Crime intel feed    : cited public-source summary (data/burlington-osint/intel.json)
   - Config / sources    : source registry + stream controls
   All data = lawful public sources only.
   ============================================================ */
(function(){
"use strict";

/* ---------- tiny DOM helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,attrs={},...kids)=>{
  const n=document.createElement(tag);
  for(const k in attrs){
    if(k==="class")n.className=attrs[k];
    else if(k==="html")n.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function")n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null)n.setAttribute(k,attrs[k]);
  }
  for(const c of kids.flat()){if(c==null)continue;n.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return n;
};
const fmtTime = d => new Date(d).toLocaleTimeString("en-CA",{hour12:false});
const uid = () => "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);

/* ---------- toast system ---------- */
const Toast = {
  push(kind,title,msg,ttl=4200){
    const node = el("div",{class:"toast "+kind},
      el("div",{class:"tt"},title),
      el("div",{},msg));
    $("#toasts").appendChild(node);
    setTimeout(()=>{node.style.opacity="0";node.style.transition="opacity .3s";setTimeout(()=>node.remove(),300);},ttl);
  },
  success:(t,m)=>Toast.push("success",t,m),
  error:(t,m)=>Toast.push("error",t,m),
  info:(t,m)=>Toast.push("info",t,m),
};

/* ---------- store (Zustand-lite) ---------- */
function createStore(initial){
  let state = initial; const subs = new Set();
  return {
    get:()=>state,
    set:(patch)=>{state={...state,...(typeof patch==="function"?patch(state):patch)};subs.forEach(f=>f(state));},
    subscribe:(f)=>{subs.add(f);return ()=>subs.delete(f);}
  };
}

/* ---------- mock async "API" (simulates network + failures) ---------- */
const Api = {
  // fail rate lets us demonstrate optimistic rollback
  failRate: 0,
  delay:(ms=420)=>new Promise(r=>setTimeout(r,ms)),
  async mutate(label){
    await Api.delay(360+Math.random()*380);
    if(Math.random()<Api.failRate) throw new Error(label+" rejected by upstream (simulated).");
    return true;
  }
};

/* ---------- mock realtime stream via EventTarget ---------- */
class StatusStream extends EventTarget{
  constructor(){
    super(); this.timer=null; this.running=false; this.interval=8500;
    this.pool=[
      {sev:"high",ti:"Firearms recovery — traffic stop",de:"HRPS recovered a loaded handgun during a vehicle stop near Guelph Line & Dundas St. One adult charged.",cat:"FIREARMS",src:"HRPS media release"},
      {sev:"med",ti:"Auto-theft enforcement action",de:"Targeted operation disrupted a vehicle re-VIN ring; two vehicles recovered in the Burlington/Oakville corridor.",cat:"AUTO-THEFT",src:"HRPS media release"},
      {sev:"low",ti:"Missing person located safe",de:"Previously reported missing adult located and confirmed safe. File closed.",cat:"MISSING",src:"HRPS media release"},
      {sev:"med",ti:"Residential B&E series advisory",de:"Public advisory regarding daytime break-and-enters; residents asked to report suspicious activity.",cat:"PROPERTY",src:"HRPS community alert"},
      {sev:"low",ti:"Crime Severity Index update",de:"Quarterly CSI snapshot consistent with Halton's lowest-in-province trend; no anomalies detected.",cat:"STATS",src:"StatsCan / HRPS"},
      {sev:"high",ti:"Impaired driving checkpoint — incident",de:"RIDE program checkpoint flagged an impaired operator; vehicle impounded, charges laid.",cat:"TRAFFIC",src:"HRPS media release"},
      {sev:"low",ti:"Council closed-meeting report posted",de:"City of Burlington posted a closed-session summary to the public record. Queued for governance audit.",cat:"GOVERNANCE",src:"City of Burlington minutes"},
      {sev:"med",ti:"OLT filing — land-use appeal",de:"New Ontario Land Tribunal filing logged for a Burlington development; cross-reference with procurement watchlist.",cat:"GOVERNANCE",src:"OLT case search"},
      {sev:"low",ti:"Fraud awareness bulletin",de:"Regional bulletin on grandparent/CRA telephone scams; no local cluster identified.",cat:"FRAUD",src:"HRPS bulletin"},
    ];
  }
  _emit(){
    const t=this.pool[Math.floor(Math.random()*this.pool.length)];
    const ev={...t,id:uid(),ts:Date.now()};
    this.dispatchEvent(new CustomEvent("incident",{detail:ev}));
  }
  start(){ if(this.running)return; this.running=true; this.timer=setInterval(()=>this._emit(),this.interval); }
  stop(){ this.running=false; clearInterval(this.timer); this.timer=null; }
  pulse(){ this._emit(); }
}
const stream = new StatusStream();

/* ---------- persistence ---------- */
const LS_KEY="cg.burlington.osint.tasks.v1";
function loadTasks(){
  try{const r=localStorage.getItem(LS_KEY);if(r)return JSON.parse(r);}catch(e){}
  return SEED_TASKS();
}
function saveTasks(tasks){ try{localStorage.setItem(LS_KEY,JSON.stringify(tasks));}catch(e){} }

function SEED_TASKS(){
  const now=Date.now();
  return [
    {id:uid(),title:"Millcroft Greens — OLT / procurement cross-check",desc:"Reconcile Ontario Land Tribunal filings against council procurement records for the Millcroft development.",status:"in_progress",priority:"high",tags:["land-use","procurement","OLT"],created:now-86400000*3},
    {id:uid(),title:"HRPS crime-map monitoring (weekly)",desc:"Pull weekly deltas from the Halton Regional Police ArcGIS crime map; log anomalies by ward.",status:"open",priority:"med",tags:["HRPS","crime-map","recurring"],created:now-86400000*2},
    {id:uid(),title:"Closed-meeting report audit (2025–2026)",desc:"Index every closed-session summary published by the City of Burlington and flag procurement/land items.",status:"open",priority:"med",tags:["governance","FOI","council"],created:now-86400000},
    {id:uid(),title:"FOI request — 2025 vendor performance reports",desc:"Draft and file a freedom-of-information request for 2025 municipal vendor performance evaluations.",status:"blocked",priority:"high",tags:["FOI","vendors"],created:now-3600000*8},
    {id:uid(),title:"Baseline CSI dossier (2008–2024)",desc:"Compile the 17-year Crime Severity Index baseline for Halton from StatsCan tables.",status:"completed",priority:"low",tags:["stats","baseline"],created:now-86400000*6},
  ];
}

/* ============================================================ */
const store = createStore({
  route:"status",
  events: seedEvents(),
  tasks: loadTasks(),
  streamOn:true,
  intel:null,
  intelError:false,
});

function seedEvents(){
  const base=Date.now();
  return [
    {id:uid(),sev:"low",ti:"Deck initialized",de:"Burlington OSINT control deck online. Public-source feeds armed.",cat:"SYSTEM",src:"ClearGlass",ts:base-1000},
    {id:uid(),sev:"med",ti:"Auto-theft enforcement action",de:"Targeted operation disrupted a re-VIN ring; vehicles recovered in the Burlington/Oakville corridor.",cat:"AUTO-THEFT",src:"HRPS media release",ts:base-42000},
    {id:uid(),sev:"low",ti:"Crime Severity Index update",de:"Quarterly CSI snapshot consistent with Halton's lowest-in-province trend.",cat:"STATS",src:"StatsCan / HRPS",ts:base-90000},
  ];
}

/* ---------- intel feed loader (with embedded fallback) ---------- */
const INTEL_FALLBACK = {
  updated:"2026-06-15",
  region:"Halton Region (Burlington, Oakville, Milton, Halton Hills)",
  summary:"Burlington remains one of the safest large municipalities in Canada. Public records show no red-flag pattern of coordinated municipal corruption driving street-level crime. Procurement and land-use governance concerns are tracked separately from crime statistics.",
  metrics:[
    {label:"Crime Severity Index rank",value:"Lowest of Ontario's \"Big 12\"",trend:"down",note:"17 consecutive years (2008–2024).",source:"StatsCan CSI / HRPS annual reports"},
    {label:"Overall crime per 100k (H1 2025)",value:"-11.7% YoY",trend:"down",note:"H1 2025 vs H1 2024, rate per 100,000.",source:"HRPS H1 2025 statistics"},
    {label:"Property crime (B&E + auto theft)",value:"-15.9% YoY",trend:"down",note:"Targeted auto-theft enforcement.",source:"HRPS H1 2025 statistics"},
    {label:"Violent crime rate",value:"Lowest regional rate in province",trend:"flat",note:"Stable year over year.",source:"StatsCan / HRPS"},
  ],
  sources:[
    {name:"Halton Regional Police — Crime Map (ArcGIS)",url:"https://www.haltonpolice.ca/en/about-us/crime-map.aspx",type:"Live map"},
    {name:"Halton Regional Police — Media Releases",url:"https://www.haltonpolice.ca/en/news/",type:"Press releases"},
    {name:"Statistics Canada — Crime Severity Index",url:"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3510002601",type:"Open data"},
    {name:"City of Burlington — Council Meetings / Minutes",url:"https://www.burlington.ca/en/city-hall/council-and-committee-meetings.aspx",type:"Public records"},
    {name:"Ontario Land Tribunal — Case Search",url:"https://olt.gov.on.ca/",type:"Public records"},
  ],
  notes:[
    "All entries reference 100% lawful, publicly available sources.",
    "Recent public activity: targeted auto-theft enforcement, firearms recoveries, routine missing-persons cases.",
    "Verify against linked primary sources before publication or filing.",
  ],
};
async function loadIntel(){
  try{
    const res=await fetch("data/burlington-osint/intel.json",{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    store.set({intel:data,intelError:false});
  }catch(e){
    store.set({intel:INTEL_FALLBACK,intelError:false});
  }
}

/* ============================================================
   TASK ACTIONS — optimistic with rollback
   ============================================================ */
async function addTask(input){
  const tasks=store.get().tasks;
  const optimistic={...input,id:uid(),created:Date.now(),_pending:true};
  store.set({tasks:[optimistic,...tasks]}); // optimistic insert
  try{
    await Api.mutate("Create task");
    store.set(s=>({tasks:s.tasks.map(t=>t.id===optimistic.id?{...t,_pending:false}:t)}));
    saveTasks(store.get().tasks);
    Toast.success("Task created",input.title);
  }catch(err){
    store.set({tasks}); // rollback
    Toast.error("Create failed — rolled back",err.message);
  }
}
async function updateTaskStatus(id,status){
  const prev=store.get().tasks;
  store.set(s=>({tasks:s.tasks.map(t=>t.id===id?{...t,status,_pending:true}:t)}));
  try{
    await Api.mutate("Status change");
    store.set(s=>({tasks:s.tasks.map(t=>t.id===id?{...t,_pending:false}:t)}));
    saveTasks(store.get().tasks);
    Toast.success("Status updated","Moved to "+status.replace("_"," "));
  }catch(err){
    store.set({tasks:prev}); // rollback
    Toast.error("Update failed — rolled back",err.message);
  }
}
async function deleteTask(id){
  const prev=store.get().tasks;
  const t=prev.find(x=>x.id===id);
  store.set(s=>({tasks:s.tasks.filter(x=>x.id!==id)})); // optimistic remove
  try{
    await Api.mutate("Delete task");
    saveTasks(store.get().tasks);
    Toast.info("Task removed",t?t.title:id);
  }catch(err){
    store.set({tasks:prev}); // rollback
    Toast.error("Delete failed — rolled back",err.message);
  }
}

/* ============================================================
   VIEWS
   ============================================================ */
const SEV_LABEL={high:"HIGH",med:"MED",low:"LOW"};
const STATUSES=[["open","Open"],["in_progress","In progress"],["completed","Completed"],["blocked","Blocked"]];

function ViewStatus(s){
  const wrap=el("div",{});
  const high=s.events.filter(e=>e.sev==="high").length;
  wrap.appendChild(el("div",{class:"stats"},
    statTile("Stream","LIVE",s.streamOn?"up":"warn",s.streamOn?"EventTarget · ~8.5s":"paused"),
    statTile("Events buffered",String(s.events.length),"down","since session start"),
    statTile("High-severity",String(high),high?"warn":"up",high?"review queue":"all clear"),
    statTile("Region","HALTON","down","Burlington + 3"),
  ));
  const ctl=el("div",{class:"row",style:"margin-bottom:16px;align-items:center"},
    el("button",{class:"btn primary sm",onclick:()=>stream.pulse()},"⊕ Inject test event"),
    el("button",{class:"btn sm",onclick:()=>toggleStream()},s.streamOn?"⏸ Pause stream":"▶ Resume stream"),
    el("span",{class:"muted tiny mono"},"High-severity incidents auto-raise an alert toast."),
  );
  wrap.appendChild(ctl);
  const card=el("div",{class:"card"},el("h3",{},"Live status stream"));
  const list=el("div",{class:"stream"});
  s.events.slice().sort((a,b)=>b.ts-a.ts).forEach(ev=>list.appendChild(eventRow(ev)));
  card.appendChild(list);
  wrap.appendChild(card);
  return wrap;
}
function eventRow(ev){
  return el("div",{class:"ev"},
    el("div",{class:"ts mono"},fmtTime(ev.ts)),
    el("div",{},
      el("div",{class:"ti"},ev.ti),
      el("div",{class:"de"},ev.de),
      el("div",{class:"meta"},ev.cat+" · src: "+ev.src),
    ),
    el("span",{class:"sev "+ev.sev},SEV_LABEL[ev.sev]||ev.sev),
  );
}
function statTile(k,v,cls,d){
  return el("div",{class:"stat"},
    el("div",{class:"k"},k),
    el("div",{class:"v "+(cls||"")},v),
    el("div",{class:"d"},d||""));
}

function ViewTasks(s){
  const wrap=el("div",{});
  wrap.appendChild(el("div",{class:"row",style:"justify-content:space-between;align-items:center;margin-bottom:16px"},
    el("div",{class:"muted tiny mono"},"Optimistic CRUD · automatic rollback on failure · persisted to localStorage"),
    el("button",{class:"btn primary",onclick:()=>openTaskModal()},"+ New investigation task"),
  ));
  const order=["open","in_progress","blocked","completed"];
  order.forEach(st=>{
    const items=s.tasks.filter(t=>t.status===st);
    const col=el("div",{class:"taskcol"},
      el("h4",{},st.replace("_"," ").toUpperCase(),el("span",{class:"ct"},String(items.length))));
    if(!items.length)col.appendChild(el("div",{class:"muted tiny",style:"padding:2px 2px 6px"},"— none —"));
    items.forEach(t=>col.appendChild(taskRow(t)));
    wrap.appendChild(col);
  });
  return wrap;
}
function taskRow(t){
  const sel=el("select",{onchange:e=>updateTaskStatus(t.id,e.target.value)});
  STATUSES.forEach(([v,l])=>{const o=el("option",{value:v},l);if(v===t.status)o.selected=true;sel.appendChild(o);});
  return el("div",{class:"task"+(t._pending?" pending":"")},
    el("div",{},
      el("div",{class:"ti"},t.title," ",el("span",{class:"prio "+t.priority},"["+t.priority.toUpperCase()+"]")),
      t.desc?el("div",{class:"de"},t.desc):null,
      el("div",{style:"margin-top:6px"},...(t.tags||[]).map(tg=>el("span",{class:"tag"},"#"+tg))),
    ),
    el("div",{class:"ctl"},
      sel,
      el("button",{class:"btn sm",onclick:()=>deleteTask(t.id),title:"Delete"},"✕ remove"),
      t._pending?el("span",{class:"tiny warn mono"},"syncing…"):null,
    ),
  );
}

function openTaskModal(){
  const overlay=el("div",{class:"overlay",onclick:e=>{if(e.target===overlay)overlay.remove();}});
  const titleI=el("input",{placeholder:"e.g. FOI request — 2025 vendor performance reports"});
  const descI=el("textarea",{rows:"3",placeholder:"Scope / objective…"});
  const prioI=el("select",{}); [["high","High"],["med","Medium"],["low","Low"]].forEach(([v,l])=>{const o=el("option",{value:v},l);if(v==="med")o.selected=true;prioI.appendChild(o);});
  const statI=el("select",{}); STATUSES.forEach(([v,l])=>prioStat(statI,v,l));
  const tagsI=el("input",{placeholder:"comma,separated,tags"});
  const modal=el("div",{class:"modal"},
    el("h3",{},"▦ New investigation task"),
    field("Title",titleI),
    field("Description",descI),
    el("div",{class:"row"},
      el("div",{style:"flex:1;min-width:140px"},field("Priority",prioI)),
      el("div",{style:"flex:1;min-width:140px"},field("Status",statI)),
    ),
    field("Tags",tagsI),
    el("div",{class:"actions"},
      el("button",{class:"btn",onclick:()=>overlay.remove()},"Cancel"),
      el("button",{class:"btn primary",onclick:()=>{
        const title=titleI.value.trim();
        if(!title){Toast.error("Missing title","A task needs a title.");titleI.focus();return;}
        const tags=tagsI.value.split(",").map(x=>x.trim()).filter(Boolean);
        addTask({title,desc:descI.value.trim(),priority:prioI.value,status:statI.value,tags});
        overlay.remove();
      }},"Create task"),
    ),
  );
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  titleI.focus();
}
function prioStat(sel,v,l){const o=el("option",{value:v},l);if(v==="open")o.selected=true;sel.appendChild(o);}
function field(label,input){return el("div",{class:"field"},el("label",{},label),input);}

function ViewIntel(s){
  const wrap=el("div",{});
  if(!s.intel){wrap.appendChild(el("div",{class:"card muted"},"Loading public-source intel…"));return wrap;}
  const d=s.intel;
  wrap.appendChild(el("div",{class:"notice"},
    "🛈 ",el("b",{},"Lawful public-source intelligence only. "),
    "Figures are operator snapshots for triage — verify against the linked primary sources below before publication or filing."));
  wrap.appendChild(el("div",{class:"stats"},
    ...d.metrics.map(m=>el("div",{class:"stat"},
      el("div",{class:"k"},m.label),
      el("div",{class:"v "+(m.trend==="down"?"down":m.trend==="up"?"warn":""),style:"font-size:18px;line-height:1.25;margin-top:8px"},m.value),
      el("div",{class:"d"},m.note),
      el("div",{class:"tiny mono",style:"color:var(--text-3);margin-top:6px"},"src: "+m.source),
    ))));
  wrap.appendChild(el("div",{class:"card",style:"margin-bottom:16px"},
    el("h3",{},"Regional picture — "+d.region),
    el("div",{class:"muted",style:"font-size:13px"},d.summary)));
  const srcCard=el("div",{class:"card",style:"margin-bottom:16px"},el("h3",{},"Cited public sources"));
  d.sources.forEach(src=>srcCard.appendChild(el("div",{class:"src"},
    el("a",{href:src.url,target:"_blank",rel:"noopener noreferrer"},src.name+" ↗"),
    el("span",{class:"ty"},src.type))));
  wrap.appendChild(srcCard);
  const notes=el("div",{class:"card"},el("h3",{},"Operator notes"),
    el("ul",{style:"padding-left:18px;color:var(--text-2);font-size:12px;line-height:1.8"},
      ...d.notes.map(n=>el("li",{},n))));
  wrap.appendChild(notes);
  wrap.appendChild(el("div",{class:"tiny mono",style:"color:var(--text-3);margin-top:14px"},"Intel snapshot updated: "+d.updated));
  return wrap;
}

function ViewConfig(s){
  const wrap=el("div",{});
  wrap.appendChild(el("div",{class:"card",style:"margin-bottom:16px"},
    el("h3",{},"Realtime stream controls"),
    el("div",{class:"row",style:"align-items:center"},
      el("button",{class:"btn "+(s.streamOn?"":"primary")+" sm",onclick:()=>toggleStream()},s.streamOn?"⏸ Pause stream":"▶ Resume stream"),
      el("button",{class:"btn sm",onclick:()=>stream.pulse()},"⊕ Inject test event"),
      el("span",{class:"muted tiny mono"},"Interval: ~8.5s · transport: in-page EventTarget (mock)"))));

  const fr=el("select",{onchange:e=>{Api.failRate=parseFloat(e.target.value);Toast.info("Failure injection",(Api.failRate*100)+"% of mutations will fail");}});
  [["0","0% (off)"],["0.25","25%"],["0.5","50%"],["1","100% (force rollback)"]].forEach(([v,l])=>{const o=el("option",{value:v},l);if(parseFloat(v)===Api.failRate)o.selected=true;fr.appendChild(o);});
  wrap.appendChild(el("div",{class:"card",style:"margin-bottom:16px"},
    el("h3",{},"Optimistic-UI fault injection"),
    el("div",{class:"muted tiny",style:"margin-bottom:10px"},"Simulate upstream mutation failures to demonstrate automatic rollback on task create / status / delete."),
    el("div",{style:"max-width:240px"},fr)));

  wrap.appendChild(el("div",{class:"card",style:"margin-bottom:16px"},
    el("h3",{},"Data sources / integration registry"),
    el("ul",{style:"padding-left:18px;color:var(--text-2);font-size:12px;line-height:1.9"},
      el("li",{},"HRPS ArcGIS crime map — ",el("span",{class:"mono tiny"},"ready to wire (REST query)")),
      el("li",{},"Statistics Canada CSI tables — ",el("span",{class:"mono tiny"},"open data, CSV/JSON")),
      el("li",{},"City of Burlington council minutes — ",el("span",{class:"mono tiny"},"scrape / FOI")),
      el("li",{},"Ontario Land Tribunal case search — ",el("span",{class:"mono tiny"},"manual / scrape")),
      el("li",{},"intel.json snapshot — ",el("span",{class:"mono tiny"},"data/burlington-osint/intel.json")),
    )));

  wrap.appendChild(el("div",{class:"card"},
    el("h3",{},"Local data"),
    el("div",{class:"row"},
      el("button",{class:"btn sm",onclick:()=>{
        const blob=new Blob([JSON.stringify(store.get().tasks,null,2)],{type:"application/json"});
        const a=el("a",{href:URL.createObjectURL(blob),download:"burlington-tasks.json"});a.click();
        Toast.info("Export","Task queue exported as JSON.");
      }},"⤓ Export tasks (JSON)"),
      el("button",{class:"btn sm",onclick:()=>{
        if(!confirm("Reset task queue to seeded Burlington tasks? This clears local changes."))return;
        const seeded=SEED_TASKS();store.set({tasks:seeded});saveTasks(seeded);Toast.info("Reset","Task queue restored to seed.");
      }},"↺ Reset to seed"),
    ),
    el("div",{class:"muted tiny mono",style:"margin-top:10px"},"Tasks persist in your browser (localStorage). Nothing is transmitted off-device.")));
  return wrap;
}

function toggleStream(){
  const on=!store.get().streamOn;
  store.set({streamOn:on});
  if(on){stream.start();Toast.info("Stream resumed","Live status feed armed.");}
  else{stream.stop();Toast.info("Stream paused","Live status feed halted.");}
}

/* ============================================================
   ERROR BOUNDARY + RENDER
   ============================================================ */
const NAV=[
  ["status","◉","LIVE STATUS"],
  ["tasks","▦","INVESTIGATION TASKS"],
  ["intel","🗺","CRIME INTEL FEED"],
  ["config","⚙","CONFIG / SOURCES"],
];
const VIEWS={status:ViewStatus,tasks:ViewTasks,intel:ViewIntel,config:ViewConfig};
const TITLES={status:"Live Status Stream",tasks:"Investigation Task Queue",intel:"Crime Intelligence Feed",config:"Configuration & Sources"};

function render(){
  const s=store.get();
  const app=$("#app");
  let body;
  try{ body=(VIEWS[s.route]||ViewStatus)(s); }
  catch(err){
    body=el("div",{class:"errband"},
      el("div",{class:"mono",style:"color:var(--red);font-weight:700;margin-bottom:8px"},"⚠ Render error caught by boundary"),
      el("div",{class:"muted",style:"font-size:12px;margin-bottom:10px"},String(err&&err.message||err)),
      el("button",{class:"btn sm",onclick:()=>render()},"↻ Retry view"));
    console.error(err);
  }
  const highCount=s.events.filter(e=>e.sev==="high").length;
  app.replaceChildren(
    el("div",{class:"shell"},
      el("aside",{class:"sidebar"},
        el("div",{class:"brand"},
          el("span",{class:"dot"}),
          el("div",{},
            el("div",{class:"t1"},"OSINT DECK"),
            el("div",{class:"t2"},"Burlington · Halton"))),
        ...NAV.map(([r,ic,label])=>{
          const n=el("button",{class:"navlink"+(s.route===r?" active":""),onclick:()=>{store.set({route:r});}},
            el("span",{class:"ic"},ic),label);
          if(r==="status"&&highCount)n.appendChild(el("span",{class:"badge"},String(highCount)));
          if(r==="tasks")n.appendChild(el("span",{class:"badge"},String(s.tasks.filter(t=>t.status!=="completed").length)));
          return n;
        }),
        el("div",{class:"foot"},
          el("div",{},"Operator: D. Otieno"),
          el("div",{},"ClearGlass Inc."),
          el("div",{style:"margin-top:6px;color:var(--cyan-dim)"},"Lawful public sources only"),
          el("div",{style:"margin-top:8px"},el("a",{href:"index.html"},"← clearglassinc.github.io")),
        )),
      el("section",{class:"main"},
        el("header",{class:"topbar"},
          el("div",{},
            el("h1",{},TITLES[s.route]||""),
            el("div",{class:"sub"},"Burlington, Ontario · Crime & Governance OSINT")),
          el("div",{class:"spacer"}),
          el("span",{class:"pill"+(s.streamOn?"":" off")},el("span",{class:"lv"}),s.streamOn?"STREAM LIVE":"STREAM PAUSED"),
          el("span",{class:"clock",id:"clk"},clockStr()),
        ),
        el("div",{class:"content"},body)),
    )
  );
}

function clockStr(){return new Date().toLocaleString("en-CA",{hour12:false,timeZone:"America/Toronto"})+" ET";}

/* ============================================================
   WIRE-UP
   ============================================================ */
store.subscribe(()=>render());

stream.addEventListener("incident",e=>{
  const ev=e.detail;
  store.set(s=>({events:[ev,...s.events].slice(0,80)}));
  if(ev.sev==="high")Toast.error("⚠ High-severity incident",ev.ti);
});

window.addEventListener("error",e=>{Toast.error("Runtime error",e.message||"unknown");});
window.addEventListener("unhandledrejection",e=>{Toast.error("Async error",(e.reason&&e.reason.message)||"promise rejected");});

// live clock without full re-render
setInterval(()=>{const c=$("#clk");if(c)c.textContent=clockStr();},1000);

render();
stream.start();
loadIntel();

/* expose a tiny test surface (used by the page's self-test below) */
window.__deck={uid,fmtTime,createStore,SEED_TASKS,Api};
})();
</script>

<!-- ============================================================
     Lightweight in-page self-tests (parity with the Vitest spec:
     id generation, time formatting, optimistic patch + rollback).
     Run by appending ?selftest to the URL. Logs to console.
     ============================================================ -->
<script>
(function(){
  if(!/[?&]selftest/.test(location.search))return;
  const D=window.__deck; const results=[];
  const ok=(name,cond)=>results.push((cond?"PASS":"FAIL")+" · "+name);
  // 1. uid uniqueness
  ok("uid() generates unique ids", new Set(Array.from({length:500},()=>D.uid())).size===500);
  // 2. fmtTime returns HH:MM:SS
  ok("fmtTime() formats clock", /^\d{2}:\d{2}:\d{2}$/.test(D.fmtTime(Date.now())));
  // 3. store optimistic patch + rollback semantics
  const s=D.createStore({tasks:[{id:"a",status:"open"}]});
  const prev=s.get().tasks;
  s.set(st=>({tasks:st.tasks.map(t=>t.id==="a"?{...t,status:"completed"}:t)}));
  ok("optimistic patch applies", s.get().tasks[0].status==="completed");
  s.set({tasks:prev});
  ok("rollback restores previous", s.get().tasks[0].status==="open");
  // 4. seed shape
  const seed=D.SEED_TASKS();
  ok("seed tasks have required fields", seed.every(t=>t.id&&t.title&&t.status&&t.priority));
  console.log("%c[Burlington OSINT Deck] self-tests","color:#22d3ee;font-weight:bold");
  results.forEach(r=>console.log((r.startsWith("PASS")?"%c":"%c")+r, r.startsWith("PASS")?"color:#34d399":"color:#f87171"));
})();
</script>
