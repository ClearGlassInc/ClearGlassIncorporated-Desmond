[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearglassinc-sdk"
version = "0.2.0"
description = "ClearGlassInc Agent SDK — a modular, provider-agnostic framework for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
http = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
all = ["openai>=1.40", "anthropic>=0.34", "httpx>=0.27"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
clearglassinc = "clearglassinc_sdk.cli:main"
clearglassinc-server = "clearglassinc_sdk.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["clearglassinc_sdk*"]
