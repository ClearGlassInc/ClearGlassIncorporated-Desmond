<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS-7 Sentinel Ultra | Advanced Security Dashboard</title>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(10, 18, 40, 0.85);
      --line: rgba(120, 180, 255, 0.18);
      --text: #e8f2ff;
      --muted: #9bb2d1;
      --cyan: #5ee7ff;
      --blue: #4d7cff;
      --green: #57f287;
      --yellow: #ffd166;
      --red: #ff5c7a;
      --shadow: 0 0 30px rgba(77, 124, 255, 0.4);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
    }
    header {
      background: rgba(10,18,40,0.95);
      border-bottom: 1px solid var(--cyan);
      padding: 12px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: var(--cyan); text-shadow: 0 0 15px var(--cyan); }
    .status {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); animation: pulse 2s infinite; }
    main {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      height: calc(100vh - 60px);
      padding: 20px;
      gap: 20px;
    }
    .sidebar, .right-panel {
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 20px;
      box-shadow: var(--shadow);
      overflow-y: auto;
    }
    .center {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 18px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .card h2 { font-size: 14px; color: var(--cyan); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .threat {
      font-size: 48px;
      font-weight: 900;
      text-align: center;
      color: var(--red);
      text-shadow: 0 0 20px var(--red);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .alert { padding: 10px; border-left: 4px solid var(--red); background: rgba(255,92,122,0.1); margin-bottom: 8px; font-size: 13px; }
    .live { animation: flicker 1.5s infinite alternate; }
    @keyframes pulse { 0%{opacity:0.4} 100%{opacity:1} }
    @keyframes flicker { 0%{opacity:1} 100%{opacity:0.6} }
    canvas { width:100%; height:240px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">AEGIS-7<span style="color:#57f287">SENTINEL</span></div>
    <div class="status">
      <span>SECURE</span><span class="dot"></span>
      <span>QUANTUM SHIELD ACTIVE</span>
      <span id="time" style="font-size:13px; color:var(--muted);"></span>
    </div>
  </header>
  <main>
    <!-- LEFT -->
    <div class="sidebar">
      <h2>System Nodes</h2>
      <div class="grid">
        <div class="card"><div style="color:var(--green);font-size:28px">142</div><div style="font-size:11px;color:var(--muted)">ONLINE</div></div>
        <div class="card"><div style="color:var(--yellow);font-size:28px">7</div><div style="font-size:11px;color:var(--muted)">COMPROMISED</div></div>
      </div>
      <h2 style="margin-top:30px">Network Topology</h2>
      <canvas id="net"></canvas>
    </div>

    <!-- CENTER -->
    <div class="center">
      <div class="card" style="text-align:center">
        <h2>Global Threat Level</h2>
        <div id="threat" class="threat">CRITICAL</div>
        <div style="color:var(--red);font-size:13px;margin-top:8px">89% • 3.2s AGO</div>
      </div>

      <div class="card">
        <h2>Live Sentinel Feed</h2>
        <div id="feed" style="height:240px;overflow-y:auto;font-size:13px;line-height:1.5;color:var(--muted)"></div>
      </div>

      <div class="card">
        <h2>AI Prediction</h2>
        <div style="display:flex;justify-content:space-between;align-items:end">
          <div style="font-size:42px;color:var(--cyan)">92%</div>
          <div style="text-align:right">Next breach prevented in<br><span style="color:var(--green)">17s</span></div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <h2>Active Alerts <span class="live" style="color:var(--red);font-size:11px">LIVE</span></h2>
      <div id="alerts"></div>
      <h2 style="margin-top:30px">Uptime</h2>
      <div style="font-size:52px;color:var(--green);font-weight:900">99.997%</div>
      <div style="font-size:11px;color:var(--muted)">14d 7h 42m</div>
    </div>
  </main>

  <script>
    // Time
    setInterval(()=>{ document.getElementById('time').textContent = new Date().toLocaleTimeString('en-US',{hour12:false}) },1000);

    // Fake feed
    const feed = document.getElementById('feed');
    const messages = ["Quantum anomaly detected → neutralized","DDoS vector blocked at edge node","Zero-day signature matched","Orbital relay secure","Biometric ghosting scan clean"];
    setInterval(()=>{ feed.innerHTML += `<div style="margin-bottom:4px">› ${messages[Math.floor(Math.random()*messages.length)]}</div>`; feed.scrollTop=9999; },1200);

    // Fake alerts
    const alertsHTML = `
      <div class="alert">Intrusion attempt from 185.44.12.91 → blocked</div>
      <div class="alert">Ransomware signature detected in sector 4</div>
      <div class="alert" style="border-color:#ffd166;color:#ffd166">Encrypted beacon from shadow node</div>
    `;
    document.getElementById('alerts').innerHTML = alertsHTML;

    // Network canvas
    const c = document.getElementById('net');
    const ctx = c.getContext('2d');
    c.width=260; c.height=240;
    function drawNet(){
      ctx.clearRect(0,0,c.width,c.height);
      ctx.strokeStyle = 'rgba(94,231,255,0.3)';
      for(let i=0;i<18;i++){
        ctx.beginPath();
        ctx.moveTo(Math.random()*c.width, Math.random()*c.height);
        ctx.lineTo(Math.random()*c.width, Math.random()*c.height);
        ctx.stroke();
      }
      ctx.fillStyle = '#5ee7ff';
      for(let i=0;i<12;i++) ctx.fillRect(Math.random()*c.width, Math.random()*c.height, 3, 3);
    }
    setInterval(drawNet,800);
    drawNet();

    // Threat pulse
    let t=89;
    setInterval(()=>{ t=t===89?92:89; document.getElementById('threat').textContent = t===89?'CRITICAL':'EXTREME'; },2500);
  </script>
</body>
</html>
