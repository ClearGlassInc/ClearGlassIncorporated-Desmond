<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearGlass · Hover Menu (GitHub style)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0c10 0%, #0f1117 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .hero {
            background: rgba(18, 22, 28, 0.65);
            backdrop-filter: blur(2px);
            border-radius: 42px;
            padding: 3rem 2rem;
            border: 1px solid rgba(88, 166, 255, 0.12);
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.5);
        }
        .hover-menu { position: relative; display: inline-block; width: auto; }
        .menu-trigger {
            background: rgba(25, 30, 38, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            color: #e6edf5;
            border: 1px solid rgba(88, 166, 255, 0.35);
            cursor: default;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: monospace;
        }
        .menu-trigger::before { content: "⌘"; font-size: 1.2rem; opacity: 0.7; }
        .menu-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            min-width: 720px;
            background: #0d1117;
            border-radius: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(88,166,255,0.1);
            padding: 18px 20px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.2s ease, visibility 0.2s, transform 0.2s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .hover-menu:hover .menu-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        .grid-menu { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: baseline; }
        .menu-group { display: flex; flex-direction: column; gap: 8px; }
        .menu-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #58a6ff;
            border-left: 2px solid #58a6ff;
            padding-left: 8px;
        }
        .menu-item {
            background: transparent; border: none; color: #c9d1d9; font-weight: 450; font-size: 0.85rem;
            padding: 4px 8px; border-radius: 8px; transition: 0.1s; cursor: default; white-space: nowrap;
        }
        .menu-item:hover { background: #21262d; color: #ffffff; }
        .brand-footer {
            font-size: 0.7rem; color: #5c6e8c; margin-top: 12px; text-align: right;
            border-top: 1px solid #21262d; padding-top: 10px;
        }
        @media (max-width: 780px) {
            .menu-dropdown { min-width: 260px; left: -20px; }
            .grid-menu { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="hero">
    <div class="hover-menu">
        <div class="menu-trigger">ClearGlass ▲ 2040</div>
        <div class="menu-dropdown">
            <div class="grid-menu">
                <div class="menu-group"><div class="menu-category">VISION</div><div class="menu-item">Artemis VI</div><div class="menu-item">Artemis IV Core</div><div class="menu-item">Guardian</div></div>
                <div class="menu-group"><div class="menu-category">TECH</div><div class="menu-item">Threads Kit</div><div class="menu-item">SMB Suite</div><div class="menu-item">Revenue Engine</div></div>
                <div class="menu-group"><div class="menu-category">PRODUCTS</div><div class="menu-item">ClearTax AI</div><div class="menu-item">Enter the Grid</div><div class="menu-item">Founder</div></div>
                <div class="menu-group"><div class="menu-category">CORE</div><div class="menu-item">Vision</div><div class="menu-item">Technology</div><div class="menu-item">Products</div></div>
            </div>
            <div class="brand-footer">ClearGlass · closed alpha</div>
        </div>
    </div>
    <div style="margin-top: 3rem; text-align: center; font-size: 0.8rem; color: #3d4a5f;">hover “ClearGlass ▲ 2040” → menu appears</div>
</div>
</body>
</html>
