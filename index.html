<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearGlass Inc. | Subscribe with GitHub</title>
  <meta name="description" content="Subscribe for updates from ClearGlass Inc. using email or GitHub OAuth." />
  <style>
    :root {
      --bg-1: #040711;
      --bg-2: #0a1022;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.18);
      --text: #edf3ff;
      --muted: #a7b2cc;
      --accent-1: #5eead4;
      --accent-2: #60a5fa;
      --danger: #fb7185;
      --ok: #34d399;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 600px at 10% 10%, rgba(96,165,250,.16), transparent 55%),
        radial-gradient(900px 500px at 85% 0%, rgba(94,234,212,.14), transparent 60%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(130deg, rgba(96,165,250,.55), rgba(94,234,212,.25), rgba(167,139,250,.45));
      box-shadow: 0 22px 60px rgba(0,0,0,.45);
    }

    .card {
      background: linear-gradient(165deg, rgba(8,14,30,.9), rgba(5,10,24,.88));
      border: 1px solid var(--border);
      border-radius: 23px;
      padding: clamp(20px, 4vw, 34px);
      backdrop-filter: blur(16px) saturate(130%);
    }

    .kicker {
      letter-spacing: .18em;
      font-size: .72rem;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .sub {
      margin: 12px 0 22px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    .form-row { display: grid; gap: 12px; }
    label {
      font-size: .82rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input[type="email"] {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(2, 6, 18, .78);
      color: var(--text);
      border-radius: 14px;
      font-size: 1rem;
      padding: 14px 16px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    input[type="email"]:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, .2);
    }

    button {
      border: 0;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }
    button:active { transform: translateY(1px); }

    .btn-subscribe {
      background: linear-gradient(135deg, #f8fafc, #e5e7eb);
      color: #0f172a;
      padding: 14px 16px;
    }

    .or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .or::before, .or::after {
      content: "";
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.35), transparent);
      flex: 1;
    }

    .btn-github {
      width: 100%;
      background: rgba(15, 23, 42, .78);
      color: #f8fafc;
      border: 1px solid var(--glass-strong);
      padding: 14px 16px;
    }

    .helper { margin-top: 14px; color: var(--muted); font-size: .9rem; }
    .helper a, .status a { color: var(--accent-1); }

    .status {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 48px;
      color: var(--muted);
      background: rgba(15, 23, 42, .45);
    }

    .status.ok { border-color: rgba(52, 211, 153, .55); color: #bbf7d0; }
    .status.error { border-color: rgba(251, 113, 133, .55); color: #fecdd3; }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .card { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="subscribe-title">
    <section class="card">
      <p class="kicker">Join the update list</p>
      <h1 id="subscribe-title">Subscribe with GitHub</h1>
      <p class="sub">Get product updates, launches, and private beta access. Clean homepage with no guardian elements.</p>

      <form id="subscribeForm" novalidate>
        <div class="form-row">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          <button class="btn-subscribe" id="emailSubmit" type="submit">Subscribe</button>
        </div>
      </form>

      <div class="or">or</div>

      <!-- GitHub OAuth setup (static front-end redirect only):
           1) Create OAuth app: https://github.com/settings/applications/new
           2) Homepage URL: https://your-github.io
           3) Authorization callback URL: https://your-github.io/auth/callback
           4) Implement /auth/github on your backend OR use Firebase/Auth0 hosted auth endpoint.
      -->
      <button class="btn-github" id="githubLogin" type="button">Continue with GitHub</button>

      <p class="helper">By subscribing, you agree to receive updates. You can unsubscribe anytime.</p>

      <!-- ARIA live region for success/error handling -->
      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">Ready.</div>
    </section>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "cg_subscribed_email";
      const STORAGE_TS_KEY = "cg_subscribed_at";
      const form = document.getElementById("subscribeForm");
      const emailInput = document.getElementById("email");
      const submitBtn = document.getElementById("emailSubmit");
      const githubBtn = document.getElementById("githubLogin");
      const statusEl = document.getElementById("status");

      function setStatus(message, type) {
        statusEl.textContent = "";
        statusEl.classList.remove("ok", "error");
        if (type) statusEl.classList.add(type);
        statusEl.innerHTML = message;
      }

      function lockIfSubscribed() {
        const existing = localStorage.getItem(STORAGE_KEY);
        if (existing) {
          emailInput.value = existing;
          emailInput.disabled = true;
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.65";
          setStatus(
            `You are already subscribed as <strong>${existing}</strong>. <a href="/unsubscribe">Unsubscribe</a>.`,
            "ok"
          );
        }
      }

      lockIfSubscribed();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (emailInput.disabled) return;

        const email = emailInput.value.trim().toLowerCase();
        if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
          setStatus("Please enter a valid email address.", "error");
          return;
        }

        console.log("[subscribe] sending email signup", { email, endpoint: "https://your-backend.example/subscribe" });
        setStatus("Submitting subscription...", null);
        submitBtn.disabled = true;

        try {
          const res = await fetch("https://your-backend.example/subscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, source: "github-pages-homepage" })
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          localStorage.setItem(STORAGE_KEY, email);
          localStorage.setItem(STORAGE_TS_KEY, new Date().toISOString());
          emailInput.disabled = true;

          setStatus(
            `Success! You're subscribed as <strong>${email}</strong>. <a href="/unsubscribe">Unsubscribe</a>.`,
            "ok"
          );
        } catch (err) {
          console.error("[subscribe] failed", err);
          setStatus("Subscription failed. Please try again later.", "error");
          submitBtn.disabled = false;
        }
      });

      githubBtn.addEventListener("click", () => {
        console.log("[oauth] redirecting to GitHub auth", { url: "/auth/github" });
        // Option A (custom backend): keep /auth/github and /auth/callback routes.
        // Option B (Firebase Auth): redirect to a hosted auth page that calls signInWithRedirect(GithubAuthProvider).
        // Option C (Auth0): replace with your Auth0 authorize URL for GitHub connection.
        window.location.href = "/auth/github";
      });

      // Backend replacement notes:
      // - Firebase Functions: replace fetch URL with your HTTPS callable endpoint.
      // - Netlify Functions: use "/.netlify/functions/subscribe".
      // - EmailJS: call emailjs.send(...) in place of fetch (public key + template ID required).
    })();
  </script>
</body>
</html>
