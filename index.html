*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--white:#fafbfc;--off:#f3f5f8;--glass:rgba(255,255,255,0.55);--glass-border:rgba(0,0,0,0.06);--glass-strong:rgba(255,255,255,0.8);--dark:#0a0c10;--dark-2:#1a1d25;--dark-3:#2a2d35;--text:#0a0c10;--text-2:#3a3f4a;--text-3:#6b7280;--text-4:#9ca3af;--prism-1:#38bdf8;--prism-2:#a78bfa;--prism-3:#f472b6;--prism-4:#34d399;--prism-5:#fbbf24;--prism-6:#60a5fa;--crystal:linear-gradient(135deg,#38bdf8 0%,#a78bfa 25%,#f472b6 50%,#fbbf24 75%,#34d399 100%);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Urbanist',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}

  background:#af1cb7;color:#fff;text-align:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;font-weight:700;
  padding:6px 16px;position:relative;z-index:200;

}
.class-banner span{opacity:.8;font-weight:400;margin:0 8px}
.unclass-banner{
  background:#1a4731;color:#4ade80;text-align:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;font-weight:700;

html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--sans);color:var(--text);background:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.cursor-glow{position:fixed;width:400px;height:400px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(56,189,248,0.06) 0%,rgba(167,139,250,0.04) 30%,transparent 70%);transform:translate(-50%,-50%);transition:left .5s ease,top .5s ease}
.nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(1240px,calc(100% - 2.5rem));z-index:100;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,3vw,1.5rem);background:rgba(250,251,252,0.6);backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(255,255,255,.72);border-radius:20px;box-shadow:0 8px 28px rgba(10,12,16,.05);transition:height .2s cubic-bezier(.4,0,.2,1),background .2s cubic-bezier(.4,0,.2,1),box-shadow .2s cubic-bezier(.4,0,.2,1),border-color .2s cubic-bezier(.4,0,.2,1)}
.nav.scrolled{height:66px;background:rgba(250,251,252,0.78);border-color:rgba(0,0,0,.08);box-shadow:0 10px 30px rgba(10,12,16,.1)}
.nav-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text)}
.nav-mark{width:44px;height:44px;border-radius:12px;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.08);flex-shrink:0}.nav-mark img{width:100%;height:100%;object-fit:cover;display:block}
.nav-name{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}.nav-name em{font-style:italic;font-weight:300;color:var(--text-3)}
.nav-links{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
.nav-links a{position:relative;color:var(--text-3);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.01em;padding:9px 14px;border-radius:999px;transition:color .2s cubic-bezier(.4,0,.2,1),background .2s cubic-bezier(.4,0,.2,1)}
.nav-links a::after{content:'';position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:4px;background:linear-gradient(90deg,rgba(56,189,248,.85),rgba(167,139,250,.85));transform:scaleX(0);transform-origin:left;transition:transform .2s cubic-bezier(.4,0,.2,1),opacity .2s;opacity:.7}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--text);background:rgba(255,255,255,.65);outline:none}
.nav-links a:hover::after,.nav-links a:focus-visible::after,.nav-links a.is-active::after{transform:scaleX(1)}
.nav-links a.is-active{color:var(--text);background:rgba(255,255,255,.75)}
.nav-cta{color:#fff!important;background:var(--dark)!important;font-weight:700!important;margin-left:4px;padding:10px 18px!important}.nav-cta:hover,.nav-cta:focus-visible{background:var(--dark-2)!important;transform:translateY(-1px)}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;color:var(--text)}.nav-toggle svg{width:24px;height:24px}
.mobile-menu{position:fixed;top:92px;left:1rem;right:1rem;z-index:99;background:rgba(250,251,252,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.78);border-radius:18px;display:flex;flex-direction:column;gap:2px;padding:10px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s cubic-bezier(.4,0,.2,1),transform .2s cubic-bezier(.4,0,.2,1)}.mobile-menu.open{opacity:1;transform:translateY(0);pointer-events:auto}.mobile-menu a{color:var(--text);text-decoration:none;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.01em;padding:11px 14px;border-radius:12px;transition:background .2s ease,color .2s ease}.mobile-menu a:hover,.mobile-menu a:focus-visible{background:rgba(255,255,255,.75);color:var(--text);outline:none}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 2rem 80px;position:relative;overflow:hidden}.hero-prism{position:absolute;top:50%;left:50%;width:700px;height:700px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,0.07) 0%,rgba(167,139,250,0.05) 30%,rgba(244,114,182,0.03) 50%,transparent 70%);animation:prismPulse 10s ease-in-out infinite;pointer-events:none}@keyframes prismPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.hero-lines{position:absolute;inset:0;pointer-events:none;overflow:hidden}.hero-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,248,0.12),rgba(167,139,250,0.08),transparent);animation:lineSlide 12s linear infinite}@keyframes lineSlide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hero-year{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text-4);letter-spacing:.15em;margin-bottom:32px;animation:fadeUp 1s ease both}
.hero h1{font-family:var(--serif);font-size:clamp(3rem,8vw,7.5rem);font-weight:300;line-height:1;letter-spacing:-.03em;max-width:900px;animation:fadeUp 1s ease .15s both}.hero h1 strong{font-weight:600}.hero h1 .crystal-text{background:var(--crystal);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(1.05rem,1.8vw,1.25rem);color:var(--text-3);line-height:1.75;max-width:560px;margin-top:28px;font-weight:400;animation:fadeUp 1s ease .3s both}
.hero-domain-line{margin-top:18px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--glass-border);backdrop-filter:blur(12px);font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.08em;color:var(--text-2);animation:fadeUp 1s ease .38s both}
.hero-domain-line a{color:var(--text);text-decoration:none;font-weight:600}
.hero-profile{width:min(42vw,300px);max-width:300px;min-width:180px;height:auto;border-radius:22px;display:block;box-shadow:0 14px 40px rgba(0,0,0,.16);margin:0 auto 26px;position:relative;z-index:1;object-fit:contain;border:1px solid rgba(255,255,255,.65)}
.hero-actions{display:flex;gap:14px;margin-top:40px;flex-wrap:wrap;justify-content:center;animation:fadeUp 1s ease .45s both}.hero-scroll{margin-top:auto;padding-top:60px;animation:fadeUp 1s ease .6s both}.hero-scroll span{display:block;font-family:var(--mono);font-size:11px;color:var(--text-4);letter-spacing:.1em;margin-bottom:12px}.scroll-line{width:1px;height:48px;margin:0 auto;background:linear-gradient(180deg,var(--text-4),transparent);animation:scrollPulse 2s ease-in-out infinite}@keyframes scrollPulse{0%,100%{opacity:.3;height:48px}50%{opacity:1;height:64px}}@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 32px;border-radius:999px;font-family:var(--sans);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:all .35s}.btn-dark{color:#fff;background:var(--dark);box-shadow:0 2px 20px rgba(0,0,0,.08)}.btn-dark:hover{background:var(--dark-2);transform:translateY(-2px)}.btn-glass{color:var(--text);background:rgba(255,255,255,.6);border:1px solid var(--glass-border);backdrop-filter:blur(10px)}.btn-glass:hover{background:rgba(255,255,255,.9)}.btn-crystal{color:#fff;background:var(--crystal);background-size:200% 200%;animation:crystalShift 6s ease infinite;box-shadow:0 4px 25px rgba(56,189,248,.2)}@keyframes crystalShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}.btn-crystal:hover{transform:translateY(-2px)}
.container{width:min(1180px,92vw);margin:0 auto;padding:0 clamp(1rem,3vw,2rem)}.sect{padding:clamp(80px,12vw,140px) 0}.sect-dark{background:var(--dark);color:var(--white)}
