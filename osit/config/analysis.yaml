project_name: "OSIT — Urban Mobility Baseline"
area_of_interest:
  mode: bbox
  value: [43.3000, -79.9000, 43.3300, -79.8200]

network_modes:
  - drive
  - walk
  - bike
  - transit_rail

analysis_profile: multimodal
travel_time_thresholds_minutes: [5, 10, 15, 30, 45]

points_of_interest:
  - healthcare
  - schools
  - transit
  - parks
  - public_services

output_crs: auto_local_metric
retain_all_components: true
simplify_network: true
request_timeout_seconds: 180
overpass_max_retries: 4
overpass_url: null
repair_invalid_aoi: false
cache_dir: data/cache
output_dir: outputs
max_area_km2: 5000
max_centrality_nodes: 7500
