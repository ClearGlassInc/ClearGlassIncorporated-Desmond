<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClearGlass · Platform Command Center</title>
<meta name="description" content="ClearGlassInc platform command center — a live visual dashboard of the monorepo: composition, the governed-commerce safety model, systems map, audit findings, and CI posture.">
<link rel="icon" href="/assets/images/clearglass-logo.png">
<link rel="apple-touch-icon" href="/assets/images/clearglass-logo.png">
<meta property="og:image" content="https://www.clearglassinc.com/assets/images/clearglass-logo.png">
<style>
  /* ClearGlass Platform Command Center — self-contained HUD. No external deps.
     Logo marker for site-health: references clearglass-logo + /logo-badge.js. */
  :root{
    --bg:#05070d; --bg2:#0a0f1a; --panel:rgba(17,25,40,.72); --panel-line:rgba(120,160,220,.14);
    --ink:#e7eefc; --ink-dim:#93a4c4; --ink-faint:#5f7196;
    --cyan:#22d3ee; --emerald:#34d399; --amber:#fbbf24; --red:#f87171;
    --violet:#a78bfa; --pink:#f472b6; --blue:#60a5fa; --teal:#2dd4bf; --slate:#94a3b8;
    --glow:0 0 24px rgba(34,211,238,.22);
    --radius:16px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; font-family:var(--sans); color:var(--ink);
    background:radial-gradient(1200px 800px at 78% -8%,rgba(34,211,238,.10),transparent 60%),
               radial-gradient(1000px 700px at 12% 108%,rgba(52,211,153,.08),transparent 60%),
               linear-gradient(180deg,var(--bg),var(--bg2));
  }
  canvas#grid{position:fixed;inset:0;z-index:0;opacity:.5}
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 2px,transparent 4px);
    mix-blend-mode:overlay}
  .app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:18px 22px;gap:14px}

  /* header */
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:34px;height:34px;border-radius:8px;box-shadow:var(--glow)}
  .brand .t{line-height:1.1}
  .brand h1{margin:0;font-size:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .brand small{color:var(--ink-dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;
    padding:7px 13px;border:1px solid var(--panel-line);border-radius:999px;background:var(--panel);color:var(--ink-dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .clock{font-family:var(--mono);color:var(--cyan)}

  /* tabs */
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);
    background:var(--panel);border:1px solid var(--panel-line);padding:9px 15px;border-radius:11px;cursor:pointer;
    transition:.2s;display:flex;align-items:center;gap:8px}
  .tab:hover{color:var(--ink);border-color:rgba(34,211,238,.4)}
  .tab[aria-selected=true]{color:#04121a;background:linear-gradient(180deg,var(--cyan),#0fb8d4);border-color:transparent;box-shadow:var(--glow)}
  .tab .g{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}

  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow:auto;padding:2px;opacity:0;transform:translateY(8px);
    pointer-events:none;transition:opacity .35s,transform .35s}
  .view.active{opacity:1;transform:none;pointer-events:auto}
  .view::-webkit-scrollbar{width:9px}.view::-webkit-scrollbar-thumb{background:rgba(120,160,220,.25);border-radius:8px}

  .grid{display:grid;gap:14px}
  .k4{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)} .k2{grid-template-columns:repeat(2,1fr)}
  @media (max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.k3,.k2{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);
    padding:18px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.5),transparent);opacity:.5}
  .card h3{margin:0 0 3px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
  .card .sub{color:var(--ink-faint);font-size:11px;margin-bottom:12px}

  /* KPI */
  .kpi .num{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .kpi .lab{margin-top:8px;color:var(--ink-dim);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .kpi .foot{margin-top:10px;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
  .kpi.cyan .num{color:var(--cyan)}.kpi.em .num{color:var(--emerald)}.kpi.am .num{color:var(--amber)}
  .kpi.vi .num{color:var(--violet)}.kpi.bl .num{color:var(--blue)}.kpi.pk .num{color:var(--pink)}

  /* donut */
  .donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .donut{position:relative;width:210px;height:210px;flex:0 0 auto}
  .donut svg{transform:rotate(-90deg)}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .donut .center b{font-family:var(--mono);font-size:30px}
  .donut .center span{font-size:11px;color:var(--ink-dim);letter-spacing:.12em;text-transform:uppercase}
  .legend{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
  .legend .row{display:flex;align-items:center;gap:10px;font-size:12px;cursor:default;padding:3px 5px;border-radius:7px;transition:.15s}
  .legend .row:hover{background:rgba(120,160,220,.08)}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .legend .nm{flex:1;color:var(--ink)}
  .legend .vl{font-family:var(--mono);color:var(--ink-dim)}
  .legend .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);width:96px;overflow:hidden;flex:0 0 auto}
  .legend .bar i{display:block;height:100%;border-radius:3px}

  /* risk ladder */
  .ladder{display:flex;flex-direction:column;gap:7px}
  .rung{display:grid;grid-template-columns:190px 1fr 54px;align-items:center;gap:12px}
  .rung .act{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .rung .track{height:22px;border-radius:7px;background:rgba(255,255,255,.05);position:relative;overflow:hidden}
  .rung .fill{height:100%;border-radius:7px;position:relative;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .rung .sc{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink-dim)}
  .tier-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--ink-dim)}
  .tier-legend span{display:inline-flex;align-items:center;gap:6px}
  .tier-legend i{width:10px;height:10px;border-radius:3px}
  .thresholds{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:8px;border:1px solid var(--panel-line);color:var(--ink-dim)}

  /* pipeline */
  .pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:6px}
  .step{flex:1;min-width:150px;background:rgba(255,255,255,.03);border:1px solid var(--panel-line);
    border-radius:12px;padding:14px;position:relative;margin-right:26px}
  .step:last-child{margin-right:0}
  .step::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--cyan);font-size:20px}
  .step:last-child::after{display:none}
  .step .n{font-family:var(--mono);font-size:11px;color:var(--cyan)}
  .step h4{margin:6px 0 4px;font-size:14px}
  .step p{margin:0;font-size:11px;color:var(--ink-dim);line-height:1.5}
  .step.gate{border-color:rgba(251,191,36,.4);box-shadow:0 0 20px rgba(251,191,36,.08)}
  .step.gate .n{color:var(--amber)}

  /* systems map */
  .map{width:100%;height:auto}
  .node rect{fill:rgba(17,25,40,.9);stroke:var(--panel-line);rx:12}
  .node.core rect{stroke:var(--cyan);filter:drop-shadow(0 0 8px rgba(34,211,238,.4))}
  .node .tl{fill:var(--ink);font:700 13px var(--sans)}
  .node .st{fill:var(--ink-dim);font:11px var(--mono)}
  .edge{stroke:rgba(120,160,220,.35);stroke-width:1.5;fill:none}
  .edge.hot{stroke:var(--cyan);stroke-dasharray:5 5;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .badge{font:700 9px var(--mono);letter-spacing:.05em}

  /* findings */
  .finds{display:flex;flex-direction:column;gap:10px}
  .find{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;
    background:rgba(255,255,255,.03);border:1px solid var(--panel-line);border-left-width:3px;border-radius:12px;padding:13px 15px}
  .find .rk{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink-faint);text-align:center}
  .find h4{margin:0 0 3px;font-size:14px}
  .find p{margin:0;font-size:12px;color:var(--ink-dim);line-height:1.45}
  .find .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .tag{font:700 10px/1 var(--mono);padding:5px 8px;border-radius:7px;letter-spacing:.04em;white-space:nowrap}
  .tag.S{background:rgba(52,211,153,.16);color:var(--emerald)}
  .tag.M{background:rgba(96,165,250,.16);color:var(--blue)}
  .tag.L{background:rgba(167,139,250,.16);color:var(--violet)}
  .tag.done{background:rgba(52,211,153,.2);color:var(--emerald)}
  .tag.plan{background:rgba(148,163,184,.16);color:var(--slate)}
  .sev{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

  /* workflow grid */
  .wf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
  .wf .w{background:rgba(255,255,255,.03);border:1px solid var(--panel-line);border-radius:10px;padding:11px 12px;
    display:flex;align-items:center;gap:9px;font-size:12px;transition:.15s}
  .wf .w:hover{border-color:rgba(34,211,238,.4);transform:translateY(-1px)}
  .wf .w i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .wf .w b{font-weight:600;color:var(--ink)}
  .cat-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-dim);margin-bottom:10px}
  .cat-legend span{display:inline-flex;align-items:center;gap:6px}
  .cat-legend i{width:9px;height:9px;border-radius:50%}

  /* gauge */
  .gauges{display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:center}
  .gauge{position:relative;width:150px;height:150px;text-align:center}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .lab b{font-family:var(--mono);font-size:26px}
  .gauge .lab span{font-size:10px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase}

  .note{font-size:11px;color:var(--ink-faint);margin-top:12px;line-height:1.5}
  a.src{color:var(--cyan);text-decoration:none;border-bottom:1px dotted rgba(34,211,238,.4)}
</style>
</head>

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tierColor=s=>s>=90?"var(--red)":s>=60?"var(--amber)":s>=30?"var(--blue)":"var(--emerald)";
const tierName=s=>s>=90?"CRITICAL":s>=60?"HIGH":s>=30?"MEDIUM":"LOW";

/* count-up */
function countUp(node,to,dur=1100){
  const start=performance.now();const from=0;
  const step=t=>{const p=Math.min(1,(t-start)/dur);const e=1-Math.pow(1-p,3);
    node.textContent=Math.round(from+(to-from)*e).toLocaleString();
    if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
/* donut via stroke-dasharray */
function donut(items,{size=210,stroke=26,centerTop,centerBottom}={}){
  const r=(size-stroke)/2, c=2*Math.PI*r, total=items.reduce((a,b)=>a+b.v,0);
  const wrap=el("div","donut");wrap.style.width=wrap.style.height=size+"px";
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("width",size);svg.setAttribute("height",size);
  const track=document.createElementNS(NS,"circle");
  [["cx",size/2],["cy",size/2],["r",r],["fill","none"],["stroke","rgba(255,255,255,.05)"],["stroke-width",stroke]]
    .forEach(([k,v])=>track.setAttribute(k,v));svg.appendChild(track);
  let off=0;
  items.forEach((it,i)=>{
    const seg=document.createElementNS(NS,"circle");const len=c*it.v/total;
    [["cx",size/2],["cy",size/2],["r",r],["fill","none"],["stroke",it.c],["stroke-width",stroke],
     ["stroke-dasharray",`${len} ${c-len}`],["stroke-dashoffset",-off]].forEach(([k,v])=>seg.setAttribute(k,v));
    seg.style.transition="stroke-width .2s";seg.style.opacity="0";
    setTimeout(()=>seg.style.opacity="1",60*i);
    seg.addEventListener("mouseenter",()=>seg.setAttribute("stroke-width",stroke+6));
    seg.addEventListener("mouseleave",()=>seg.setAttribute("stroke-width",stroke));
    svg.appendChild(seg);off+=len;
  });
  wrap.appendChild(svg);
  const ctr=el("div","center",`<b>${(centerTop||total.toLocaleString())}</b><span>${centerBottom||"files"}</span>`);
  wrap.appendChild(ctr);return {wrap,total};
}
function legend(items,total){
  const box=el("div","legend");
  items.forEach(it=>{
    const row=el("div","row");
    row.innerHTML=`<span class="sw" style="background:${it.c}"></span>
      <span class="nm">${it.n}</span>
      <span class="bar"><i style="width:${(it.v/total*100).toFixed(1)}%;background:${it.c}"></i></span>
      <span class="vl">${it.v}</span>`;
    box.appendChild(row);
  });return box;
}
function gauge(pct,label,color){
  const size=150,stroke=13,r=(size-stroke)/2,c=2*Math.PI*r;
  const g=el("div","gauge");const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("width",size);svg.setAttribute("height",size);
  const bg=document.createElementNS(NS,"circle");
  [["cx",size/2],["cy",size/2],["r",r],["fill","none"],["stroke","rgba(255,255,255,.06)"],["stroke-width",stroke]].forEach(([k,v])=>bg.setAttribute(k,v));
  const fg=document.createElementNS(NS,"circle");
  [["cx",size/2],["cy",size/2],["r",r],["fill","none"],["stroke",color],["stroke-width",stroke],
   ["stroke-linecap","round"],["stroke-dasharray",c],["stroke-dashoffset",c]].forEach(([k,v])=>fg.setAttribute(k,v));
  fg.style.transition="stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)";
  svg.append(bg,fg);g.appendChild(svg);
  g.appendChild(el("div","lab",`<b style="color:${color}">${pct}%</b><span>${label}</span>`));
  setTimeout(()=>fg.setAttribute("stroke-dashoffset",c*(1-pct/100)),120);
  return g;
}

/* animated grid background */
const cv=$("#grid"),cx=cv.getContext("2d");let W,H,t=0;
function rz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener("resize",rz);rz();
(function loop(){
  cx.clearRect(0,0,W,H);t+=.4;const g=46;
  cx.strokeStyle="rgba(90,130,190,.10)";cx.lineWidth=1;
  const oy=(t*.4)%g;
  for(let y=-g+oy;y<H;y+=g){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
  for(let x=0;x<W;x+=g){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
  // travelling pulse dots along a couple lines
  for(let i=0;i<3;i++){
    const px=((t*2.2+i*W/3)%W);const py=H*(.28+i*.22);
    const grd=cx.createRadialGradient(px,py,0,px,py,60);
    grd.addColorStop(0,"rgba(34,211,238,.20)");grd.addColorStop(1,"transparent");
    cx.fillStyle=grd;cx.beginPath();cx.arc(px,py,60,0,7);cx.fill();
  }
  requestAnimationFrame(loop);
})();
