[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-intelligence"
version = "5.0.0"
description = "ARTEMIS ClearGlass Intelligence Platform Agent Layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
artemis-api = "artemis.api.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["artemis/tests"]
addopts = "-v --tb=short --cov=artemis --cov-report=term-missing"

[tool.coverage.run]
source = ["artemis"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["artemis*"]
